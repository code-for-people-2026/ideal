<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="排好菜手机页面地图：四条端到端客户旅程与补充功能验证。" />
    <title>排好菜 · 手机页面地图</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e1b16;
        --muted: #655d55;
        --line: #e1d9cd;
        --canvas: #ddd8d0;
        --paper: #fff9ef;
        --phone: #fbf8f1;
        --red: #b64131;
        --red-dark: #8f2d22;
        --red-soft: #fbe9e4;
        --gold: #edae32;
        --gold-soft: #fff2d5;
        --green: #287557;
        --green-dark: #1e5d45;
        --green-soft: #e7f3ec;
        --blue: #557b91;
        --blue-soft: #e8f0f3;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { min-width: 320px; color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
      button, input, a { color: inherit; font: inherit; }
      button:not(:disabled), a { cursor: pointer; }
      button:focus-visible, input:focus-visible, a:focus-visible, .phone-node:focus-visible {
        outline: 4px solid rgba(40, 117, 87, .42);
        outline-offset: 5px;
      }

      .workspace-toolbar {
        position: fixed;
        z-index: 70;
        top: 0;
        left: 0;
        width: 100%;
        height: 68px;
        padding: 0 24px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        border-bottom: 1px solid rgba(45, 39, 32, .12);
        background: rgba(255, 252, 246, .96);
        box-shadow: 0 8px 30px rgba(49, 40, 31, .06);
        backdrop-filter: blur(18px);
      }

      .workspace-toolbar a { color: inherit; text-decoration: none; }
      .workspace-back, .workspace-customer {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .workspace-back { justify-self: start; }
      .workspace-customer {
        justify-self: end;
        min-height: 38px;
        padding: 0 14px;
        border-radius: 11px;
        color: white !important;
        background: var(--ink);
      }

      .workspace-nav {
        display: flex;
        padding: 4px;
        border: 1px solid #ded6ca;
        border-radius: 12px;
        background: #f1ece4;
      }
      .workspace-nav a, .workspace-nav span {
        min-height: 34px;
        padding: 0 14px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .workspace-nav .active {
        color: var(--green-dark);
        background: white;
        box-shadow: 0 3px 10px rgba(47, 39, 31, .09);
      }

      .local-toolbar {
        position: fixed;
        z-index: 60;
        top: 80px;
        left: 50%;
        width: min(1320px, calc(100% - 24px));
        min-height: 56px;
        padding: 8px 12px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(255, 255, 255, .9);
        border-radius: 16px;
        background: rgba(255, 253, 249, .96);
        box-shadow: 0 12px 30px rgba(54, 40, 30, .11);
        transform: translateX(-50%);
        backdrop-filter: blur(18px);
      }
      .local-label { display: grid; line-height: 1.1; }
      .local-label strong { font-size: 13px; font-weight: 950; }
      .local-label small { margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 750; }
      .view-tabs {
        height: 40px;
        padding: 3px;
        display: flex;
        flex: 0 0 auto;
        gap: 2px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f2eee8;
      }
      .view-tab {
        height: 32px;
        min-height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        font-size: 11px;
        font-weight: 850;
        white-space: nowrap;
      }
      .view-tab[aria-pressed="true"] {
        color: var(--green-dark);
        background: var(--green-soft);
        box-shadow: inset 0 0 0 1px rgba(40, 117, 87, .18);
      }
      .local-state {
        justify-self: end;
        padding: 7px 9px;
        border-radius: 9px;
        color: var(--green-dark);
        background: var(--green-soft);
        font-size: 9px;
        font-weight: 900;
        white-space: nowrap;
      }

      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        background: var(--canvas);
      }
      .viewport.is-dragging { cursor: grabbing; user-select: none; }
      .board {
        position: absolute;
        top: 0;
        left: 0;
        width: 5200px;
        height: 5920px;
        overflow: hidden;
        transform-origin: 0 0;
        border: 1px solid #cec3b6;
        border-radius: 36px;
        background: var(--paper);
        box-shadow: 0 30px 90px rgba(56, 40, 29, .17);
        will-change: transform;
      }
      .board-intro { position: absolute; top: 40px; left: 58px; }
      .board-intro span {
        color: var(--green-dark);
        font-size: 11px;
        font-weight: 950;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      .board-intro h1 { margin: 8px 0 0; font-size: 42px; line-height: 1; letter-spacing: -.045em; }
      .legend { position: absolute; top: 70px; right: 58px; display: flex; gap: 8px; }
      .legend span {
        padding: 7px 10px;
        border-radius: 999px;
        color: var(--green-dark);
        background: var(--green-soft);
        font-size: 9px;
        font-weight: 900;
      }
      .legend .planned { color: var(--red-dark); background: var(--red-soft); }
      .legend .supplementary { color: #765313; background: var(--gold-soft); }
      .board.is-filtered .board-intro, .board.is-filtered .legend { display: none; }
      .board.is-filtered .lane:not(.is-active) { visibility: hidden; }

      .lane {
        position: absolute;
        top: var(--lane-y);
        left: 48px;
        width: 5104px;
        height: 1120px;
        padding: 20px 24px 26px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 255, 255, .82);
        box-shadow: 0 18px 46px rgba(55, 43, 33, .09);
      }
      .lane.onboarding { --accent: var(--green); --accent-dark: var(--green-dark); --accent-soft: var(--green-soft); }
      .lane.weekly { --accent: var(--red); --accent-dark: var(--red-dark); --accent-soft: var(--red-soft); }
      .lane.reuse { --accent: #a16c10; --accent-dark: #765313; --accent-soft: var(--gold-soft); }
      .lane.rules { --accent: var(--blue); --accent-dark: #385d70; --accent-soft: var(--blue-soft); }
      .lane.support { --accent: #6f7775; --accent-dark: #46504d; --accent-soft: #edf0ee; }
      .lane-head {
        height: 74px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 28px;
      }
      .lane-title { display: flex; gap: 14px; align-items: flex-start; }
      .lane-number {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 11px;
        font-weight: 950;
      }
      .lane-title h2 { margin: 0; font-size: 29px; line-height: 1; letter-spacing: -.035em; }
      .lane-title p { margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .lane-state {
        flex: 0 0 auto;
        padding: 7px 10px;
        border-radius: 999px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 9px;
        font-weight: 900;
      }
      .phone-flow { display: flex; align-items: start; justify-content: flex-start; }
      .connector {
        flex: 0 0 100px;
        width: 100px;
        height: 1020px;
        display: grid;
        place-content: center;
        justify-items: center;
        color: var(--accent-dark);
      }
      .connector b { font-size: 36px; line-height: 1; }
      .connector small {
        margin-top: 8px;
        max-width: 96px;
        font-size: 9px;
        font-weight: 900;
        line-height: 1.35;
        text-align: center;
      }
      .journey-result {
        position: absolute;
        right: 24px;
        bottom: 16px;
        padding: 7px 10px;
        border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
        border-radius: 999px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 9px;
        font-weight: 900;
      }

      .phone-node {
        position: relative;
        width: 511px;
        min-height: 1020px;
        border-radius: 44px;
        transition: opacity .16s ease, filter .16s ease;
      }
      .phone-node.planned::before {
        content: "";
        position: absolute;
        z-index: 0;
        inset: 43px 14px 7px;
        border: 3px dashed rgba(182, 65, 49, .48);
        border-radius: 60px;
        pointer-events: none;
      }
      .board.phone-focused .phone-node:not(.is-focused) { opacity: .16; filter: saturate(.35); }
      .phone-node.is-focused { z-index: 8; }
      .node-label {
        height: 52px;
        padding: 0 12px 9px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .node-label small, .node-label strong { display: block; }
      .node-label small {
        color: var(--accent-dark);
        font-size: 9px;
        font-weight: 950;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .node-label strong {
        margin-top: 3px;
        overflow: hidden;
        font-size: 15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .node-label > span {
        flex: 0 0 auto;
        padding: 5px 7px;
        border-radius: 7px;
        color: var(--accent-dark);
        background: var(--accent-soft);
        font-size: 8px;
        font-weight: 900;
      }
      .phone-node.planned .node-label > span { color: var(--red-dark); background: var(--red-soft); }

      .device-frame {
        position: relative;
        z-index: 1;
        width: 511px;
        height: 968px;
        filter: drop-shadow(0 24px 26px rgba(34, 28, 23, .18));
      }
      .phone-bezel {
        position: absolute;
        z-index: 4;
        inset: 0;
        width: 511px;
        height: 968px;
        pointer-events: none;
        user-select: none;
      }
      .phone-screen {
        position: absolute;
        z-index: 2;
        left: 59px;
        top: 58px;
        width: 393px;
        height: 852px;
        overflow: hidden;
        border-radius: 42px;
        background: var(--phone);
      }
      .status-bar {
        height: 54px;
        padding: 0 31px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        font-size: 14px;
        font-weight: 750;
      }
      .status-bar img { width: 79px; height: 13px; }
      .app-bar {
        height: 56px;
        padding: 0 15px;
        display: grid;
        grid-template-columns: 58px 1fr 58px;
        align-items: center;
        border-bottom: 1px solid rgba(30, 27, 22, .07);
        background: white;
      }
      .app-bar strong { text-align: center; font-size: 17px; }
      .back-button {
        min-height: 34px;
        padding: 0;
        border: 0;
        color: var(--green-dark);
        background: transparent;
        font-size: 11px;
        font-weight: 850;
        text-align: left;
      }
      .app-state {
        justify-self: end;
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 8px;
        font-weight: 850;
      }
      .mobile-content {
        position: absolute;
        inset: 110px 0 72px;
        padding: 15px;
        overflow-y: auto;
        background: var(--phone);
        scrollbar-width: none;
      }
      .phone-node.no-nav .mobile-content { inset-bottom: 20px; }
      .mobile-content::-webkit-scrollbar, .day-grid-scroll::-webkit-scrollbar { display: none; }
      .bottom-navigation {
        position: absolute;
        z-index: 12;
        left: 0;
        right: 0;
        bottom: 0;
        height: 72px;
        padding: 8px 12px 10px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        border-top: 1px solid #ded8cf;
        background: rgba(255, 255, 255, .98);
      }
      .bottom-navigation button, .bottom-navigation [data-static-control] {
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 10px;
        color: #8a857e;
        background: transparent;
        font-size: 10px;
        font-weight: 800;
      }
      .bottom-navigation button.active, .bottom-navigation [data-static-control].active { color: var(--green-dark); background: var(--green-soft); }

      .week-toolbar {
        display: grid;
        grid-template-columns: 42px 1fr 42px;
        gap: 8px;
        align-items: center;
      }
      .week-toolbar button, .week-toolbar [data-static-control] {
        display: grid;
        height: 40px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: white;
        font-size: 10px;
        font-weight: 850;
      }
      .week-toolbar div { text-align: center; }
      .week-toolbar strong, .week-toolbar small { display: block; }
      .week-toolbar strong { font-size: 15px; }
      .week-toolbar small { margin-top: 3px; color: var(--muted); font-size: 9px; }
      .plan-state, .notice {
        margin-top: 11px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-radius: 13px;
        color: var(--green-dark);
        background: var(--green-soft);
      }
      .plan-state strong, .plan-state small { display: block; }
      .plan-state small { font-size: 9px; }
      .plan-state strong { margin-top: 3px; font-size: 13px; }
      .plan-state span { padding: 5px 8px; border-radius: 999px; background: white; font-size: 9px; font-weight: 850; }
      .card {
        margin-top: 11px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: white;
        box-shadow: 0 8px 22px rgba(52, 41, 31, .06);
      }
      .card > small { color: var(--red-dark); font-size: 9px; font-weight: 900; }
      .card h2 { margin: 7px 0 5px; font-size: 21px; }
      .card p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
      .metrics { display: flex; gap: 7px; margin-top: 12px; }
      .metrics span {
        padding: 6px 9px;
        border-radius: 8px;
        color: #765313;
        background: var(--gold-soft);
        font-size: 9px;
        font-weight: 850;
      }
      .mobile-content .primary {
        width: 100%;
        min-height: 49px;
        margin-top: 13px;
        border: 0;
        border-radius: 13px;
        color: white;
        background: var(--red);
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 9px 20px rgba(182, 65, 49, .18);
      }
      .mobile-content .primary.green {
        background: var(--green-dark);
        box-shadow: 0 9px 20px rgba(30, 93, 69, .18);
      }
      .mobile-content .primary:active { transform: translateY(1px); }
      .mini-note {
        margin-top: 10px;
        padding: 11px;
        border-radius: 12px;
        color: #765313;
        background: var(--gold-soft);
        font-size: 9px;
        line-height: 1.5;
      }

      .menu-board { padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: white; }
      .menu-board header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee6da;
      }
      .menu-board header strong, .menu-board header small { display: block; }
      .menu-board header strong { font-size: 14px; }
      .menu-board header small { margin-top: 2px; color: var(--muted); font-size: 8px; }
      .filter-row button, .filter-row [data-static-control] {
        min-height: 29px;
        padding: 0 9px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        font-size: 9px;
        font-weight: 850;
      }
      .filter-row button.active, .filter-row [data-static-control].active { color: white; background: var(--green-dark); }
      .view-caption { color: var(--green-dark) !important; font-size: 9px !important; font-weight: 850; }
      .day-grid-scroll { margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
      .day-grid {
        width: max-content;
        display: grid;
        grid-template-columns: 28px repeat(5, 112px);
        gap: 5px;
      }
      .day-grid span, .day-grid .dish-cell {
        min-height: 39px;
        padding: 3px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--ink);
        background: white;
        font-size: 9px;
        font-weight: 800;
        text-align: center;
      }
      .day-grid .head { min-height: 28px; border: 0; background: transparent; font-size: 10px; }
      .day-grid .meal { color: var(--muted); background: #f5f0e8; writing-mode: vertical-rl; }
      .replace-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .replace-actions button, .replace-actions span, .replace-actions [data-static-control] {
        min-height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: white;
        font-size: 10px;
        font-weight: 900;
      }
      .replace-actions > :first-child { border-color: var(--red); color: white; background: var(--red); }
      .replace-actions button:last-child, .replace-actions [data-static-control]:last-child { color: var(--green-dark); }
      .selection-card {
        margin-top: 10px;
        padding: 11px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        border: 1px solid #d4dfd8;
        border-left: 3px solid var(--green-dark);
        border-radius: 11px;
        background: white;
      }
      .selection-card small, .selection-card strong { display: block; }
      .selection-card small { color: var(--green-dark); font-size: 8px; font-weight: 850; }
      .selection-card strong { margin-top: 3px; font-size: 13px; }
      .selection-card button, .selection-card [data-static-control] {
        display: grid;
        place-items: center;
        min-height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #f4efe7;
        font-size: 9px;
        font-weight: 900;
      }

      .candidate-list, .dish-list, .meal-list, .history-list { display: grid; gap: 8px; margin-top: 11px; }
      .candidate-button, .dish-row, .history-week {
        width: 100%;
        min-height: 68px;
        padding: 10px 11px;
        display: grid;
        grid-template-columns: 26px 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 13px;
        color: var(--ink);
        background: white;
        text-align: left;
      }
      .candidate-button.selected {
        border-color: var(--green);
        background: #f5fbf7;
        box-shadow: 0 0 0 1px var(--green);
      }
      .radio {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border: 1px solid #d8d0c4;
        border-radius: 50%;
        color: white;
        background: white;
        font-size: 0;
      }
      .selected .radio { border-color: var(--green); background: var(--green); }
      .selected .radio::after { content: "✓"; font-size: 12px; font-weight: 900; }
      .candidate-button strong, .candidate-button small, .dish-row strong, .dish-row small, .history-week strong, .history-week small { display: block; }
      .candidate-button strong, .dish-row strong, .history-week strong { font-size: 12px; }
      .candidate-button small, .dish-row small, .history-week small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 8px;
        line-height: 1.35;
      }
      .candidate-button > b, .dish-row > b { color: var(--green-dark); font-size: 9px; }
      .hero { padding: 15px; border-radius: 17px; color: white; background: var(--green-dark); }
      .hero.red { background: var(--red-dark); }
      .hero small, .hero strong { display: block; }
      .hero small { font-size: 9px; opacity: .78; }
      .hero strong { margin-top: 4px; font-size: 22px; }
      .hero p { margin: 5px 0 0; font-size: 9px; line-height: 1.5; opacity: .82; }
      .meal-row { padding: 10px 11px; border: 1px solid var(--line); border-radius: 11px; background: white; }
      .meal-row header { display: flex; align-items: center; justify-content: space-between; }
      .meal-row header strong { color: var(--green-dark); font-size: 12px; }
      .meal-row header span { color: var(--muted); font-size: 9px; }
      .meal-row p { margin: 5px 0 0; color: var(--muted); font-size: 9px; line-height: 1.45; }

      .search-field {
        min-height: 42px;
        margin-top: 10px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: white;
      }
      .search-field input, .search-field .static-phone-field { width: 100%; border: 0; outline: 0; color: var(--muted); background: transparent; font-size: 10px; }
      .filter-row { display: flex; gap: 5px; margin-top: 8px; }
      .filter-row button, .filter-row [data-static-control] { border: 1px solid var(--line); border-radius: 999px; background: white; }

              make("onboardingReady", "o06", "01-06 · 准备完成", "确认基础已可用于排菜")
            ],
            arrows: [
              ["先说清家里怎么吃"],
              ["日期与餐次决定要排多少"],
              ["餐型决定每餐几个位置"],
              ["连续挑选，随时可以结束"],
              ["补充自家常吃的菜"]
            ]
          },
          {
            key: "weekly", number: "02", y: 1300, label: "给家里排好本周菜单",
            scene: "周末一次安排五天午晚餐；不合适的只换一道，最后保存到历史。",
            state: "核心旅程", result: "完成：本周菜单已保存，可查看、可复用",
            phones: [
              make("start", "w01", "02-01 · 开始排菜", "选好周次，准备排菜"),
              make("review", "w02", "02-02 · 对照菜单", "对照五天十餐"),
              make("replace", "w03", "02-03 · 替换菜品", "决定怎么换这一道"),
              make("manualPick", "w04", "02-04 · 手选菜品", "从菜品库手选"),
              make("replacedReview", "w05", "02-05 · 返回菜单", "回到菜单确认只改一道"),
              make("confirm", "w06", "02-06 · 确认菜单", "查看总览并保存"),
              make("saved", "w07", "02-07 · 保存完成", "看到保存成功"),
              make("historyDetail", "w08", "02-08 · 完整结果", "从历史查看完整结果", { content: `<section class="plan-state"><div><small>9月7日—11日</small><strong>本周已保存</strong></div><span>只读</span></section><div class="meal-list">${allMeals}</div>` })
            ],
            arrows: [
              ["生成整周菜单"],
              ["这道不合适，换一道"],
              ["想自己挑，从菜品库手选"],
              ["选好后回到本周菜单"],
              ["只改这一道，其余不动"],
              ["确认并保存"],
              ["保存后查看完整菜单"]
            ]
          },
          {
            key: "reuse", number: "03", y: 2450, label: "沿用上一周，少改几道菜",
            scene: "新一周不从空白开始；复制上一周成为新草稿，再调整并单独保存。",
            state: "核心旅程", result: "完成：旧记录保持只读，新一周独立保存",
            phones: [
              make("historyList", "r01", "03-01 · 查找历史", "找到上一周菜单"),
              make("historyDetail", "r02", "03-02 · 查看菜单", "查看完整十餐"),
              make("copy", "r03", "03-03 · 确认复制", "确认复制到下一周"),
              make("copiedDraft", "r04", "03-04 · 生成草稿", "新草稿回到排菜单"),
              make("nextWeekReview", "r05", "03-05 · 调整菜单", "保留大部分，只改几道"),
              make("nextWeekConfirm", "r06", "03-06 · 确认菜单", "确认下一周菜单"),
              make("nextWeekSaved", "r07", "03-07 · 保存完成", "新一周单独保存")
            ],
            arrows: [
              ["找到合适的一周"],
              ["看完再决定复用"],
              ["复制，不修改原记录"],
              ["草稿回到排菜单"],
              ["换掉不合适的菜"],
              ["保存成新的一周"]
            ]
          },
          {
            key: "rules", number: "04", y: 3600, label: "家庭情况变化后重新排菜",
            scene: "人数、忌口或餐次改变；保存新规则，并验证下一次生成已经应用。",
            state: "计划中", result: "目标：新规则影响未来生成，不改历史菜单",
            phones: [
              make("profileSummary", "q01", "04-01 · 规则摘要", "查看当前家庭规则"),
              make("ruleEdit", "q02", "04-02 · 修改规则", "修改人数、排菜日期、餐次和忌口"),
              make("ruleSaved", "q03", "04-03 · 保存规则", "确认新规则摘要"),
              make("ruledStart", "q04", "04-04 · 生成菜单", "按新规则生成菜单"),
              make("ruledResult", "q05", "04-05 · 验证结果", "验证生成结果已应用")
            ],
            arrows: [
              ["家庭情况有变化"],
              ["保存并确认摘要"],
              ["去排下一周菜单"],
              ["生成后验证规则生效"]
            ]
          },
          {
            key: "support", number: "05", y: 4750, label: "主旅程未覆盖的功能验证",
            scene: "这里检查独立页面、局部控件和边界状态，不把它们包装成客户主故事。",
            state: "补充验证", result: "覆盖：菜品浏览、详情、维护与无候选状态",
            phones: [
              make("libraryBrowse", "s01", "05-01 · 浏览菜品", "搜索与分类筛选"),
              make("dishDetail", "s02", "05-02 · 菜品详情", "查看独立菜品资料"),
              make("catalogMaintain", "s03", "05-03 · 维护菜品", "新增、编辑与停用"),
              make("noCandidate", "s04", "05-04 · 边界状态", "没有合适候选时")
            ],
            arrows: [
              ["查看一份菜品资料"],
              ["验证计划中的维护页"],
              ["验证无候选边界"]
            ]
          }
        ];

        const statusLabel = phone => phone.planned ? "计划中" : phone.support ? "补充验证" : "已实现";

        const renderPhone = (phone, previousId, nextId) => `
          <section class="phone-node ${phone.planned ? "planned" : ""} ${phone.hideNav ? "no-nav" : ""}" tabindex="0" data-phone-id="${phone.id}" data-next-phone="${nextId || ""}" data-previous-phone="${previousId || ""}">
            <header class="node-label"><div><small>步骤 ${phone.id.slice(1)}</small><strong>${phone.name}</strong></div><span>${statusLabel(phone)}</span></header>
            <div class="device-frame">
              <div class="phone-screen">
                <div class="status-bar"><strong>9:41</strong><img src="./assets/status/ios-status-icons.svg" alt=""></div>
                <header class="app-bar">
                  ${phone.back ? `<button class="back-button" type="button" data-back-action>${phone.back}</button>` : "<span></span>"}
                  <strong>${phone.title}</strong><span class="app-state">${phone.state}</span>
                </header>
                <div class="mobile-content">${phone.content}</div>
                ${phone.hideNav ? "" : nav(phone.tab)}
              </div>
              <img class="phone-bezel" src="./assets/iphone/Bezel.png" alt="">
            </div>
          </section>`;

        const renderConnector = connector => `
          <div class="connector"><b>→</b><small>${connector[0]}</small></div>`;

        const renderJourney = journey => `
          <article class="lane ${journey.key}" data-lane="${journey.key}" style="--lane-y:${journey.y}px">
            <header class="lane-head">
              <div class="lane-title"><span class="lane-number">${journey.number}</span><div><h2>${journey.label}</h2><p>${journey.scene}</p></div></div>
              <span class="lane-state">${journey.state}</span>
            </header>
            <div class="phone-flow">
              ${journey.phones.map((phone, index) =>
                renderPhone(phone, journey.phones[index - 1]?.id, journey.phones[index + 1]?.id) +
                (journey.arrows[index] ? renderConnector(journey.arrows[index]) : "")
              ).join("")}
            </div>
            <div class="journey-result">${journey.result}</div>
          </article>`;

        document.querySelector("#lanes").innerHTML = journeys.map(renderJourney).join("");

        document.querySelectorAll(".phone-node button").forEach(button => {
          const staticControl = document.createElement("div");
          staticControl.className = button.className;
          staticControl.innerHTML = button.innerHTML;
          staticControl.setAttribute("data-static-control", "");
          button.replaceWith(staticControl);
        });
        document.querySelectorAll(".phone-node input").forEach(input => {
          const staticField = document.createElement("div");
          staticField.className = "static-phone-field";
          staticField.textContent = input.value || input.placeholder;
          input.replaceWith(staticField);
        });

        const viewport = document.querySelector("#viewport");
        const board = document.querySelector("#board");
        const zoomStatus = document.querySelector("#zoomStatus");
        const viewTabs = [...document.querySelectorAll("[data-focus]")];
        const phoneNodes = [...document.querySelectorAll(".phone-node")];
        const lanes = [...document.querySelectorAll(".lane")];
        const state = { x: 0, y: 0, scale: 1, dragging: false, px: 0, py: 0 };
        const regions = {
          all: { x: 0, y: 0, width: 5200, height: 5920 },
          onboarding: { x: 35, y: 130, width: 5130, height: 1160 },
          weekly: { x: 35, y: 1280, width: 5130, height: 1160 },
          reuse: { x: 35, y: 2430, width: 5130, height: 1160 },
          rules: { x: 35, y: 3580, width: 5130, height: 1160 },
          support: { x: 35, y: 4730, width: 5130, height: 1160 }
        };

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const render = () => {
          board.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
          zoomStatus.textContent = `${Math.round(state.scale * 100)}%`;
        };
        const setPressed = name => viewTabs.forEach(tab =>
          tab.setAttribute("aria-pressed", String(tab.dataset.focus === name))
        );
        const setLaneVisibility = name => {
          const filtered = name && name !== "all";
          board.classList.toggle("is-filtered", filtered);
          lanes.forEach(lane => lane.classList.toggle("is-active", !filtered || lane.dataset.lane === name));
        };
        const clearPhoneFocus = () => {
          board.classList.remove("phone-focused");
          phoneNodes.forEach(node => node.classList.remove("is-focused"));
        };
        const focusRect = (region, name = "all") => {
          const top = window.innerWidth < 780 ? 186 : 148;
          const side = window.innerWidth < 700 ? 22 : 50;
          const availableWidth = viewport.clientWidth - side * 2;
          const availableHeight = viewport.clientHeight - top - 54;
          const fit = Math.min(availableWidth / region.width, availableHeight / region.height);
          const minimum = name !== "all" ? (window.innerWidth < 720 ? .34 : .46) : .1;
          clearPhoneFocus();
          setLaneVisibility(name);
          state.scale = clamp(Math.max(fit, minimum), .1, 1.15);
          state.x = name === "all"
            ? (viewport.clientWidth - region.width * state.scale) / 2 - region.x * state.scale
            : side - region.x * state.scale;
          state.y = top + (availableHeight - region.height * state.scale) / 2 - region.y * state.scale;
          board.dataset.view = name;
          setPressed(name);
          render();
        };
        const focusPhone = element => {
          const lane = element.closest(".lane");
          setLaneVisibility(lane.dataset.lane);
          const boardRect = board.getBoundingClientRect();
          const rect = element.getBoundingClientRect();
          const x = (rect.left - boardRect.left) / state.scale;
          const y = (rect.top - boardRect.top) / state.scale;
          const width = rect.width / state.scale;
          const height = rect.height / state.scale;
          const top = window.innerWidth < 780 ? 188 : 150;
          const availableHeight = viewport.clientHeight - top - 34;
          state.scale = clamp(Math.max(Math.min((viewport.clientWidth - 44) / width, availableHeight / height, .92), .70), .70, .92);
          state.x = viewport.clientWidth / 2 - (x + width / 2) * state.scale;
          state.y = top + (availableHeight - height * state.scale) / 2 - y * state.scale;
          board.classList.add("phone-focused");
          phoneNodes.forEach(node => node.classList.toggle("is-focused", node === element));
          board.dataset.view = lane.dataset.lane;
          setPressed("");
          render();
        };
        const focusPhoneById = id => {
          const target = document.querySelector(`[data-phone-id="${id}"]`);
          if (target) focusPhone(target);
        };
        const zoomAt = (next, cx = viewport.clientWidth / 2, cy = viewport.clientHeight / 2) => {
          const old = state.scale;
          state.scale = clamp(next, .1, 1.25);
          state.x = cx - ((cx - state.x) / old) * state.scale;
          state.y = cy - ((cy - state.y) / old) * state.scale;
          render();
        };

        viewport.addEventListener("pointerdown", event => {
          if (event.target.closest("a,button,input,.phone-node")) return;
          state.dragging = true;
          state.px = event.clientX;
          state.py = event.clientY;
          viewport.classList.add("is-dragging");
          viewport.setPointerCapture(event.pointerId);
        });
        viewport.addEventListener("pointermove", event => {
          if (!state.dragging) return;
          state.x += event.clientX - state.px;
          state.y += event.clientY - state.py;
          state.px = event.clientX;
          state.py = event.clientY;
          render();
        });
        const endDrag = () => { state.dragging = false; viewport.classList.remove("is-dragging"); };
        viewport.addEventListener("pointerup", endDrag);
        viewport.addEventListener("pointercancel", endDrag);
        viewport.addEventListener("wheel", event => {
          event.preventDefault();
          zoomAt(state.scale * (event.deltaY > 0 ? .9 : 1.1), event.clientX, event.clientY);
        }, { passive: false });

        viewTabs.forEach(tab => tab.addEventListener("click", () =>
          focusRect(regions[tab.dataset.focus], tab.dataset.focus)
        ));
        document.querySelector("[data-zoom='out']").addEventListener("click", () => zoomAt(state.scale - .1));
        document.querySelector("[data-zoom='in']").addEventListener("click", () => zoomAt(state.scale + .1));
        document.querySelector("[data-zoom='fit']").addEventListener("click", () => focusRect(regions.all, "all"));

        phoneNodes.forEach(node => {
          node.addEventListener("click", event => {
            if (!event.target.closest("button,input")) focusPhone(node);
          });
          node.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              focusPhone(node);
            }
          });
        });

        window.addEventListener("resize", () => focusRect(regions.all, "all"));
        focusRect(regions.all, "all");
      })();
    </script>
  </body>
