    <script>
      (()=>{

        const phone=(active,p)=>`<section class="phone-node ${p.planned?"planned":""}" tabindex="0" data-phone-id="${p.id}"><header class="node-label"><div><small>${p.code}</small><strong>${p.name}</strong></div><span>${p.planned?"计划中":"工程目标"}</span></header><div class="device-frame"><div class="phone-screen"><div class="status-bar"><strong>9:41</strong><img src="./assets/status/ios-status-icons.svg" alt=""></div><header class="app-bar">${p.back?'<button class="back-button" type="button">'+p.back+'</button>':"<span></span>"}<strong>${p.title}</strong><span class="app-state">${p.state}</span></header><div class="mobile-content">${p.content}</div>${nav(active)}</div><img class="phone-bezel" src="./assets/iphone/Bezel.png" alt=""></div></section>`;
        const flow=(active,phones,arrows)=>phones.map((p,i)=>phone(active,p)+(i<arrows.length?`<div class="connector"><b>→</b><small>${arrows[i]}</small></div>`:"")).join("");
        const meal=(title,date,text)=>`<article class="meal-row"><header><strong>${title}</strong><span>${date}</span></header><p>${text}</p></article>`;
        const allMeals=[["周一","9/7","萝卜焖牛腩、白切鸡、蒜蓉菜心、清炒西兰花、冬瓜虾皮汤","梅菜扣肉、清蒸鲈鱼、荷塘小炒、手撕包菜、玉米排骨汤"],["周二","9/8","红烧排骨、番茄炒蛋、清炒油麦菜、香菇青菜、海带豆腐汤","红烧牛腩、冬菇蒸肉饼、蓜蓉时蔬、清炒芦笋、番茄蛋汤"],["周三","9/9","香菇滑鸡、萝卜炖肉、清炒菠菜、酸辣土豆丝、菌菇汤","糖醋排骨、芹菜炒肉、蚝油生菜、家常茄子、紫菜蛋花汤"],["周四","9/10","啤酒鸭、豆角炒肉、蓜蓉空心菜、清炒藕片、萝卜汤","清炖狮子头、豉汁蒸鱼、小炒杏鲍菇、上汤娃娃菜、丝瓜蛋汤"],["周五","9/11","板栗烧鸡、木须肉、清炒小白菜、麻婆豆腐、莲藕排骨汤","土豆焖鸭、红烧带鱼、蓜蓉西兰花、干煸四季豆、冬瓜肉丸汤"]].flatMap(([day,date,lunch,dinner])=>[meal(`${day} · 午饭`,date,lunch),meal(`${day} · 晚饭`,date,dinner)]).join("");
        const candidates=(manual=false)=>`<div class="candidate-list" data-candidate-list><button class="candidate-button selected" type="button" aria-pressed="true"><span class="radio"></span><span><strong>${manual?"姜葱蒸鱼":"萝卜焖牛腩"}</strong><small>近期使用较少 · 主料不重复</small></span><b>已选</b></button><button class="candidate-button" type="button" aria-pressed="false"><span class="radio"></span><span><strong>豉汁排骨</strong><small>同类候选 · 可用菜品</small></span><b>可选</b></button><button class="candidate-button" type="button" aria-pressed="false"><span class="radio"></span><span><strong>香菇蒸鸡</strong><small>同类候选 · 可用菜品</small></span><b>可选</b></button></div>`;
        const navButtons=`<div class="day-grid-scroll" aria-label="左右滑动查看周一至周五"><div class="day-grid" data-menu-grid><span class="head"></span><span class="head">周一</span><span class="head">周二</span><span class="head">周三</span><span class="head">周四</span><span class="head">周五</span><span class="meal">午饭</span><button class="active" type="button">土豆烧牛肉</button><button type="button">红烧排骨</button><button type="button">香菇滑鸡</button><button type="button">啤酒鸭</button><button type="button">板栗烧鸡</button><span class="meal">晚饭</span><button type="button">梅菜扣肉</button><button type="button">红烧牛腩</button><button type="button">糖醋排骨</button><button type="button">清炖狮子头</button><button type="button">土豆焖鸭</button></div></div>`;
        const lanes=[
          {key:"schedule",number:"01",goal:"从选周生成到确认保存，排好完整一周。",state:"工程目标",layout:"four",arrows:["生成 WeekPlan","选中当前 Dish","确认并保存"],phones:[
            {id:"p01",code:"P01 · Start",name:"选周次并生成",title:"本周菜单",state:"演示",content:`<div class="week-toolbar" data-week-picker><button type="button" data-week-move="-1">上周</button><div><strong data-week-label>9月7日—9月11日</strong><small data-week-sub>本周 · 周一至周五</small></div><button type="button" data-week-move="1">下周</button></div><section class="plan-state" data-generate-state><div><small>本周还没有菜单</small><strong>10 餐待安排</strong></div><span>待生成</span></section><section class="card"><small>默认排菜规则</small><h2>五天十餐，一次排好</h2><p>每餐 2 荤 2 素 1 汤，只使用已确认菜品，同一主料尽量错开。</p><div class="metrics"><span>5 天</span><span>10 餐</span><span>50 道菜</span></div></section><div class="mini-note">菜品池已就绪，生成后可以逐道调整。</div><button class="primary" type="button" data-generate>生成本周菜单</button>`},
            {id:"p02",code:"P02 · Review",name:"查看五天十餐",title:"修改菜单",state:"调整中",back:"返回",content:`<section class="menu-board"><header><div><strong>五天十餐菜单</strong><small>9月7日—11日</small></div><div class="segments" data-segments><button class="active" type="button" aria-pressed="true">荤菜</button><button type="button" aria-pressed="false">全部</button></div></header>${navButtons}</section><section class="selection-card"><div><small>周一午饭 · 荤菜</small><strong data-selected-dish>土豆烧牛肉</strong></div><button type="button">换这道</button></section><div class="mini-note">左右滑动继续查看周四、周五。</div><button class="primary" type="button">确认十餐菜单</button>`},
            {id:"p03",code:"P03 · Replace",name:"换一道或自己选",title:"替换菜品",state:"调整中",back:"返回",content:`<section class="card" style="margin-top:0"><small>只换这一道</small><h2>土豆烧牛肉</h2><p>其他 49 道菜保持不变。</p></section><div class="replace-actions"><button type="button">自动换一道</button><button type="button" data-jump-lane="library">去菜品库手选</button></div>${candidates()}<button class="primary" type="button">保存这次替换</button>`},
            {id:"p04",code:"P04 · Save",name:"确认并保存本周",title:"确认菜单",state:"待保存",back:"返回",content:`<section class="hero"><small>9月7日—11日</small><strong>五天十餐，准备保存</strong><p>共 50 道菜，已保留 1 条软规则提醒。</p></section><div class="meal-list">${allMeals}</div><button class="primary green" type="button" data-save-menu>保存本周菜单</button>`}
          ]},
          {key:"library",number:"02",goal:"搜索、了解并选中一道合适的菜。",state:"工程目标",layout:"four",handoff:"返回 Dish → 排菜单 P03",arrows:["查看 Dish 资料","选中同类 Dish","维护 DishCatalog"],phones:[
            {id:"l01",code:"L01 · Browse",name:"搜索与分类筛选",title:"菜品库",state:"已确认",content:`<section class="hero"><small>已确认菜品池</small><strong>家常菜品库</strong><p>生成和换菜只会使用这个菜品池。</p></section><label class="search-field"><input data-dish-search placeholder="搜索菜名或主料"></label><div class="filter-row" data-library-filters><button class="active" type="button" data-kind="all">全部</button><button type="button" data-kind="meat">荤菜</button><button type="button" data-kind="veg">素菜</button><button type="button" data-kind="soup">汤羹</button></div><div class="dish-list" data-dish-list><button class="dish-row" type="button" data-kind="meat" data-dish-name="土豆烧牛肉 牛肉"><i class="dish-kind"></i><span><strong>土豆烧牛肉</strong><small>荤菜 · 主料牛肉</small></span><b>查看</b></button><button class="dish-row" type="button" data-kind="veg" data-dish-name="蒜蓉菜心 菜心"><i class="dish-kind veg"></i><span><strong>蒜蓉菜心</strong><small>素菜 · 主料菜心</small></span><b>查看</b></button><button class="dish-row" type="button" data-kind="soup" data-dish-name="冬瓜虾皮汤 冬瓜"><i class="dish-kind soup"></i><span><strong>冬瓜虾皮汤</strong><small>汤羹 · 主料冬瓜</small></span><b>查看</b></button></div>`},
            {id:"l02",code:"L02 · Detail",name:"查看菜品详情",title:"菜品详情",state:"可用",back:"返回",content:`<section class="detail-title"><small>荤菜 · 主料牛肉</small><strong>土豆烧牛肉</strong></section><div class="fact-grid"><div><b>常用</b><span>使用频率</span></div><div><b>午饭</b><span>常用餐次</span></div><div><b>已确认</b><span>菜品状态</span></div></div><section class="card"><small>菜品备注</small><h2>牛肉软烂下饭</h2><p>生成时会与本周其他牛肉菜一起执行主料避重。</p></section><section class="rule-list"><div class="rule-row"><span>菜品分类</span><strong>荤菜</strong></div><div class="rule-row"><span>主料标签</span><strong>牛肉、土豆</strong></div><div class="rule-row"><span>菜品来源</span><strong>家庭常用菜</strong></div></section>`},
            {id:"l03",code:"L03 · Pick",name:"手选一道菜",title:"手选替换菜",state:"荤菜",back:"取消",content:`<div class="notice"><strong>为“土豆烧牛肉”手选替换</strong></div>${candidates(true)}<button class="primary green" type="button">选中并返回菜单</button><div class="mini-note">选好后回到当前菜单，只替换这一道。</div>`},
            {id:"l04",code:"L04 · Maintain",name:"新增、编辑与停用",title:"编辑菜品",state:"编辑",back:"取消",planned:true,content:`<section class="form-row" style="margin-top:0"><header><strong>菜品名称</strong><small>必填</small></header><div class="choice-row"><button class="active" type="button">土豆烧牛肉</button></div></section><section class="form-row"><header><strong>菜品类型</strong><small>单选</small></header><div class="choice-row" data-rule-options><button class="active" type="button" aria-pressed="true">荤菜</button><button type="button" aria-pressed="false">素菜</button><button type="button" aria-pressed="false">汤羹</button></div></section><section class="form-row"><header><strong>主料标签</strong><small>可多选</small></header><div class="choice-row"><button class="active" type="button">牛肉</button><button class="active" type="button">土豆</button><button type="button">添加标签</button></div></section><button class="primary green" type="button">保存菜品</button><button class="primary" type="button" style="margin-top:8px">停用这道菜</button>`}
          ]},
          {key:"history",number:"03",goal:"查看已保存菜单，需要复用时复制到下一周。",state:"工程目标",layout:"three",handoff:"复制为 WeekPlan draft → 排菜单 P02",arrows:["展开 SavedPlan","复制为 draft"],phones:[
            {id:"h01",code:"H01 · List",name:"按周查看已保存菜单",title:"历史",state:"已保存",content:`<section class="hero red"><small>已保存菜单</small><strong>按周查看</strong><p>可展开查看完整菜单，也可复制到下一周。</p></section><div class="history-list"><button class="history-week" type="button" data-history-toggle><span><small>本周已保存</small><strong>9月7日—9月11日</strong><small>10 餐 · 50 道菜</small></span><b>展开</b></button><div class="history-preview">周一午饭：萝卜焖牛腩、白切鸡、蒜蓉菜心……</div><button class="history-week" type="button" data-history-toggle><span><small>上周已保存</small><strong>8月31日—9月4日</strong><small>10 餐 · 50 道菜</small></span><b>展开</b></button><div class="history-preview">周一午饭：红烧排骨、番茄炒蛋、清炒油麦菜……</div></div>`},
            {id:"h02",code:"H02 · Detail",name:"查看完整十餐详情",title:"历史菜单详情",state:"只读",back:"返回",content:`<section class="plan-state"><div><small>9月7日—11日</small><strong>本周已保存</strong></div><span>只读</span></section><div class="meal-list">${allMeals}</div><button class="primary green" type="button">复制到下一周</button>`},
            {id:"h03",code:"H03 · Copy",name:"确认复制到下周",title:"复制菜单",state:"下周",back:"取消",content:`<section class="copy-dialog"><small>整周复用</small><h2>复制整周菜单？</h2><p>9月7日—11日将复到9月14日—18日，然后生成一份可继续调整的菜单。</p><div class="dialog-actions"><button type="button">取消</button><button type="button" data-copy-confirm>确认复制</button></div></section><div class="mini-note">复制后会回到排菜单，可以再换掉几道菜。</div>`}
          ]},
          {key:"profile",number:"04",goal:"设置家庭人数、忌口和排菜偏好，供下次生成使用。",state:"计划中",layout:"three",handoff:"读取 HouseholdRule → 排菜单 P01",arrows:["调整 HouseholdRule","保存规则"],phones:[
            {id:"m01",code:"M01 · Summary",name:"我的与家庭规则摘要",title:"我的",state:"家庭",planned:true,content:`<section class="hero"><small>家庭菜单工作台</small><strong>桃子家的排好菜</strong><p>默认规则会在每次生成菜单时自动应用。</p></section><section class="rule-list"><div class="rule-row"><span>家庭人数</span><strong>4 人</strong></div><div class="rule-row"><span>排菜周期</span><strong>周一至周五</strong></div><div class="rule-row"><span>餐次</span><strong>午饭和晚饭</strong></div><div class="rule-row"><span>每餐结构</span><strong>2 荤 2 素 1 汤</strong></div><div class="rule-row"><span>忌口</span><strong>不吃芹菜</strong></div><div class="rule-row"><span>避重规则</span><strong>近 5 天主料尽量不重复</strong></div></section>`},
            {id:"m02",code:"M02 · Configure",name:"编辑人数、忌口与偏好",title:"家庭排菜规则",state:"编辑",back:"取消",planned:true,content:`<section class="form-row" style="margin-top:0"><header><strong>家庭人数</strong><small>单选</small></header><div class="choice-row" data-rule-options><button type="button" aria-pressed="false">2 人</button><button class="active" type="button" aria-pressed="true">4 人</button><button type="button" aria-pressed="false">6 人</button></div></section><section class="form-row"><header><strong>工作日餐次</strong><small>可多选</small></header><div class="choice-row" data-rule-options data-multiple><button class="active" type="button" aria-pressed="true">午饭</button><button class="active" type="button" aria-pressed="true">晚饭</button></div></section><section class="form-row"><header><strong>忌口</strong><small>可多选</small></header><div class="choice-row" data-rule-options data-multiple><button class="active" type="button" aria-pressed="true">芹菜</button><button type="button" aria-pressed="false">香菜</button><button type="button" aria-pressed="false">花生</button></div></section><section class="form-row"><header><strong>每餐结构</strong><small>当前</small></header><div class="choice-row"><button class="active" type="button">2 荤</button><button class="active" type="button">2 素</button><button class="active" type="button">1 汤</button></div></section><button class="primary green" type="button">保存家庭规则</button>`},
            {id:"m03",code:"M03 · Apply",name:"保存并交给下次生成",title:"规则已保存",state:"已保存",back:"完成",planned:true,content:`<section class="success-card" style="margin-top:0"><small>家庭规则已更新</small><strong>下次生成自动应用</strong><p>新规则不会回头修改已保存的历史菜单。</p></section><section class="card"><small>下次排菜将使用</small><h2>4 人 · 五天十餐</h2><p>午饭和晚饭 · 2 荤 2 素 1 汤 · 不吃芹菜。</p></section><button class="primary green" type="button">回到我的</button>`}
          ]}
        ];
        document.querySelector("#lanes").innerHTML=lanes.map(lane=>`<article class="lane ${lane.key}" data-lane="${lane.key}"><header class="lane-head"><div class="lane-title"><span class="lane-number">${lane.number}</span><div><h2>${labels[lane.key]}</h2><p>${lane.goal}</p></div></div><span class="lane-state">${lane.state}</span></header><div class="phone-flow ${lane.layout}">${flow(lane.key,lane.phones,lane.arrows)}</div>${lane.handoff?`<div class="handoff">${lane.handoff}</div>`:""}</article>`).join("");

        const viewport=document.querySelector("#viewport"),board=document.querySelector("#board"),zoomStatus=document.querySelector("#zoomStatus"),viewTabs=[...document.querySelectorAll("[data-focus]")];
        const state={x:0,y:0,scale:1,dragging:false,px:0,py:0};
        const regions={all:{x:0,y:0,width:5090,height:2470},schedule:{x:35,y:130,width:2470,height:1160},library:{x:2585,y:130,width:2470,height:1160},history:{x:260,y:1280,width:2040,height:1160},profile:{x:2810,y:1280,width:2040,height:1160}};
        const clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
        const render=()=>{board.style.transform=`translate(${state.x}px, ${state.y}px) scale(${state.scale})`;zoomStatus.textContent=`${Math.round(state.scale*100)}%`};
        const setPressed=name=>viewTabs.forEach(tab=>tab.setAttribute("aria-pressed",String(tab.dataset.focus===name)));
        const focusRect=(region,name="")=>{const top=window.innerWidth<780?186:148,side=window.innerWidth<700?22:50,aw=viewport.clientWidth-side*2,ah=viewport.clientHeight-top-54,fit=Math.min(aw/region.width,ah/region.height),min=name&&name!=="all"?(window.innerWidth<720?.34:.46):.1;board.classList.remove("phone-focused");document.querySelectorAll(".phone-node.is-focused").forEach(node=>node.classList.remove("is-focused"));state.scale=clamp(Math.max(fit,min),.1,1.15);state.x=(viewport.clientWidth-region.width*state.scale)/2-region.x*state.scale;state.y=top+(ah-region.height*state.scale)/2-region.y*state.scale;board.dataset.view=name||"all";setPressed(name);render()};
        const focusPhone=el=>{const br=board.getBoundingClientRect(),r=el.getBoundingClientRect(),x=(r.left-br.left)/state.scale,y=(r.top-br.top)/state.scale,w=r.width/state.scale,h=r.height/state.scale,top=window.innerWidth<780?188:150,ah=viewport.clientHeight-top-34;state.scale=clamp(Math.max(Math.min((viewport.clientWidth-44)/w,ah/h,.92),.70),.70,.92);state.x=viewport.clientWidth/2-(x+w/2)*state.scale;state.y=top+(ah-h*state.scale)/2-y*state.scale;board.classList.add("phone-focused");document.querySelectorAll(".phone-node.is-focused").forEach(node=>node.classList.remove("is-focused"));el.classList.add("is-focused");board.dataset.view=el.closest(".lane").dataset.lane;setPressed("");render()};
        const zoomAt=(next,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2)=>{const old=state.scale;state.scale=clamp(next,.1,1.25);state.x=cx-((cx-state.x)/old)*state.scale;state.y=cy-((cy-state.y)/old)*state.scale;render()};
        viewport.addEventListener("pointerdown",e=>{if(e.target.closest("a,button,input,.phone-node"))return;state.dragging=true;state.px=e.clientX;state.py=e.clientY;viewport.classList.add("is-dragging");viewport.setPointerCapture(e.pointerId)});viewport.addEventListener("pointermove",e=>{if(!state.dragging)return;state.x+=e.clientX-state.px;state.y+=e.clientY-state.py;state.px=e.clientX;state.py=e.clientY;render()});const endDrag=()=>{state.dragging=false;viewport.classList.remove("is-dragging")};viewport.addEventListener("pointerup",endDrag);viewport.addEventListener("pointercancel",endDrag);viewport.addEventListener("wheel",e=>{e.preventDefault();zoomAt(state.scale*(e.deltaY>0?.9:1.1),e.clientX,e.clientY)},{passive:false});
        viewTabs.forEach(tab=>tab.addEventListener("click",()=>focusRect(regions[tab.dataset.focus],tab.dataset.focus)));document.querySelector("[data-zoom='out']").addEventListener("click",()=>zoomAt(state.scale-.1));document.querySelector("[data-zoom='in']").addEventListener("click",()=>zoomAt(state.scale+.1));document.querySelector("[data-zoom='fit']").addEventListener("click",()=>focusRect(regions.all,"all"));
        document.querySelectorAll(".phone-node").forEach(el=>{el.addEventListener("click",e=>{if(!e.target.closest("button,input"))focusPhone(el)});el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();focusPhone(el)}})});document.querySelectorAll("[data-jump-lane]").forEach(button=>button.addEventListener("click",e=>{e.stopPropagation();const lane=button.dataset.jumpLane;focusRect(regions[lane],lane)}));
        const weeks=[["8月31日—9月4日","上周 · 周一至周五"],["9月7日—9月11日","本周 · 周一至周五"],["9月14日—9月18日","下周 · 周一至周五"]];document.querySelectorAll("[data-week-picker]").forEach(picker=>{let i=1;picker.querySelectorAll("[data-week-move]").forEach(button=>button.addEventListener("click",()=>{i=clamp(i+Number(button.dataset.weekMove),0,2);picker.querySelector("[data-week-label]").textContent=weeks[i][0];picker.querySelector("[data-week-sub]").textContent=weeks[i][1]}))});
        document.querySelectorAll("[data-generate]").forEach(button=>button.addEventListener("click",()=>{const plan=button.closest(".mobile-content").querySelector("[data-generate-state]");plan.querySelector("small").textContent="本周菜单已生成";plan.querySelector("strong").textContent="5 天 · 10 餐 · 50 道菜";plan.querySelector("span").textContent="调整中";button.textContent="查看并调整菜单"}));
        document.querySelectorAll("[data-segments]").forEach(group=>group.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>group.querySelectorAll("button").forEach(item=>{item.classList.toggle("active",item===button);item.setAttribute("aria-pressed",String(item===button))}))));document.querySelectorAll("[data-menu-grid]").forEach(grid=>grid.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>{grid.querySelectorAll("button").forEach(item=>item.classList.toggle("active",item===button));grid.closest(".mobile-content").querySelector("[data-selected-dish]").textContent=button.textContent})));
        document.querySelectorAll("[data-candidate-list]").forEach(list=>list.querySelectorAll(".candidate-button").forEach(button=>button.addEventListener("click",()=>list.querySelectorAll(".candidate-button").forEach(item=>{item.classList.toggle("selected",item===button);item.setAttribute("aria-pressed",String(item===button));item.querySelector("b").textContent=item===button?"已选":"可选"}))));
        document.querySelectorAll("[data-library-filters]").forEach(filters=>{const content=filters.closest(".mobile-content"),search=content.querySelector("[data-dish-search]");let kind="all";const apply=()=>{const q=search.value.trim().toLowerCase();content.querySelectorAll("[data-dish-list] .dish-row").forEach(row=>row.hidden=(kind!=="all"&&row.dataset.kind!==kind)||!row.dataset.dishName.toLowerCase().includes(q))};filters.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>{kind=button.dataset.kind;filters.querySelectorAll("button").forEach(item=>item.classList.toggle("active",item===button));apply()}));search.addEventListener("input",apply)});
        document.querySelectorAll("[data-history-toggle]").forEach(button=>button.addEventListener("click",()=>{const preview=button.nextElementSibling,open=preview.classList.toggle("open");button.querySelector("b").textContent=open?"收起":"展开"}));document.querySelectorAll("[data-rule-options]").forEach(group=>group.querySelectorAll("button").forEach(button=>button.addEventListener("click",()=>{if(group.hasAttribute("data-multiple")){button.classList.toggle("active");button.setAttribute("aria-pressed",String(button.classList.contains("active")))}else group.querySelectorAll("button").forEach(item=>{item.classList.toggle("active",item===button);item.setAttribute("aria-pressed",String(item===button))})})));
        document.querySelectorAll("[data-save-menu],[data-copy-confirm]").forEach(button=>button.addEventListener("click",()=>{button.textContent=button.hasAttribute("data-save-menu")?"本周菜单已保存":"已复制到下周";button.classList.add("green")}));window.addEventListener("resize",()=>focusRect(regions.all,"all"));focusRect(regions.all,"all");
      })();
    </script>
  </body>
</html>
