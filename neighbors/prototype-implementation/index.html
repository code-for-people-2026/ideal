<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="canonical" href="https://ideal.codeforpeople.cn/neighbors/prototype-implementation/" />
    <title>近邻互助组 · 实施对照原型</title>
    <!--
      近邻互助组 · 面向工程师的实施对照原型（IRP / PROTOTYPE）
      问题：工程师能否逐条对照 User Story，理解角色、状态、权限、数据与验收边界？
      交互模型：
      - App 内一切皆是与 AI 的对话，功能以卡片出现在聊天流里
      - 业务操作（确认、转发、继续）长在卡片内部
      - 快捷 pill 只做产品功能引导：刚进入时显示、用户开始对话后隐藏、业务完成后适时再出现
      场景 A：鲁师傅 · 服务者拉消费者（5 界面）
      场景 B：桃子 · 先行者拉求助者（4 界面）
      运行：python3 -m http.server 4173
    -->
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #666;
        --line: #e8e8e8;
        --paper: #f7f6f2;
        --wechat: #07c160;
        --wechat-dark: #048a3f;
        --wechat-soft: #e6f5eb;
        --gold: #c8942b;
        --gold-dark: #8a6418;
        --gold-soft: #faf3e0;
        --red: #c53e45;
        --red-dark: #9a2a30;
        --red-soft: #fdecec;
        --shadow: 0 20px 60px rgba(0,0,0,0.08);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background: var(--public-background);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; cursor: pointer; }

      .shell { min-height: 0; padding: 42px 32px 100px; background: var(--public-surface); }
      .shell.wechat, .shell.shared, .shell.private,
      .shell.pioneer, .shell.confirm, .shell.mycards, .shell.discover, .shell.provide, .shell.home,
      .shell.requester { background: var(--public-surface); }

      .hero { max-width: 1200px; margin: 0 auto 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
      .hero-main h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; letter-spacing: -0.03em; }
      .hero-main p { margin: 12px 0 0; color: var(--public-muted-foreground); font-size: 16px; line-height: 1.6; max-width: 640px; }
      .badge { flex: 0 0 auto; padding: 8px 14px; border: 1px solid var(--public-border); border-radius: 999px; background: var(--public-muted); color: var(--public-muted-foreground); font-size: 12px; font-weight: 700; }

      .scenario-switch { max-width: 1200px; margin: 0 auto 24px; display: flex; gap: 12px; }
      .scenario-btn { flex: 1; padding: 16px 18px; border: 1px solid var(--public-border); border-radius: 14px; background: var(--public-surface); text-align: left; transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease; }
      .scenario-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
      .scenario-btn.active.lu, .scenario-btn.active.taozi { border-color: var(--public-primary); background: var(--public-primary-soft); }
      .scenario-btn .scenario-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--public-muted-foreground); margin-bottom: 4px; }
      .scenario-btn .scenario-title { font-size: 16px; font-weight: 800; }
      .scenario-btn .scenario-desc { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.45; }

      .journey { max-width: 1200px; margin: 0 auto 32px; display: grid; gap: 12px; }
      .journey.flow-4 { grid-template-columns: repeat(4, 1fr); }
      .journey.flow-5 { grid-template-columns: repeat(5, 1fr); }
      .journey.flow-6 { grid-template-columns: repeat(6, 1fr); }
      .journey-step { position: relative; padding: 18px 16px; border-radius: 14px; background: var(--public-surface); border: 1px solid var(--public-border); cursor: pointer; transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease; text-align: left; }
      .journey-step:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
      .journey-step.active { border-width: 2px; }
      .journey-step.active.wechat-step, .journey-step.active.private-step, .journey-step.active.shared-step,
      .journey-step.active.pioneer-step, .journey-step.active.confirm-step, .journey-step.active.mycards-step,
      .journey-step.active.discover-step, .journey-step.active.provide-step, .journey-step.active.home-step,
      .journey-step.active.requester-step { border-color: var(--public-primary); background: var(--public-primary-soft); }
      .journey-step .step-label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; color: var(--muted); }
      .journey-step.active .step-label { color: inherit; }
      .journey-step .step-title { font-size: 15px; font-weight: 800; line-height: 1.3; display: block; }
      .journey-step .step-role { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 999px; background: rgba(0,0,0,0.05); font-size: 11px; font-weight: 700; }
      .journey-step.active.wechat-step .step-role, .journey-step.active.private-step .step-role, .journey-step.active.shared-step .step-role { background: rgba(7,193,96,0.15); color: var(--wechat-dark); }
      .journey-step.active.pioneer-step .step-role, .journey-step.active.confirm-step .step-role, .journey-step.active.mycards-step .step-role, .journey-step.active.discover-step .step-role, .journey-step.active.provide-step .step-role, .journey-step.active.home-step .step-role { background: rgba(200,148,43,0.15); color: var(--gold-dark); }
      .journey-step.active.requester-step .step-role { background: rgba(197,62,69,0.15); color: var(--red-dark); }

      .stage { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
      .phone-stage { display: grid; place-items: center; min-height: 760px; padding: 40px; overflow: hidden; border: 1px solid #17283b; border-radius: 20px; background: var(--public-prototype-stage); box-shadow: var(--public-e3); }

      .phone { width: min(100%, 380px); min-height: 720px; background: #fff; border-radius: 36px; border: 6px solid #1f2422; overflow: hidden; box-shadow: 0 24px 50px rgba(0,0,0,0.18); position: relative; }
      .statusbar { height: 34px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; }
      .status-icons { display: flex; align-items: center; gap: 6px; }
      .status-icons svg { width: 15px; height: 11px; }
      .battery { position: relative; width: 20px; height: 10px; border: 1px solid currentColor; border-radius: 2px; padding: 1px; }
      .battery::after { content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; border-radius: 0 1px 1px 0; background: currentColor; }
      .battery span { display: block; width: 75%; height: 100%; background: currentColor; border-radius: 1px; }

      .wechat-phone .statusbar, .wechat-phone .appbar { background: var(--wechat); color: #fff; }
      .pioneer-phone .statusbar, .pioneer-phone .appbar,
      .confirm-phone .statusbar, .confirm-phone .appbar,
      .mycards-phone .statusbar, .mycards-phone .appbar,
      .discover-phone .statusbar, .discover-phone .appbar,
      .provide-phone .statusbar, .provide-phone .appbar, .home-phone .statusbar, .home-phone .appbar { background: var(--gold); color: #fff; }
      .requester-phone .statusbar, .requester-phone .appbar { background: var(--red); color: #fff; }

      .appbar { position: relative; height: 58px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
      .nav-back { font-size: 30px; font-weight: 300; line-height: 1; }
      .appbar-title { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; width: 200px; font-size: 17px; font-weight: 800; }
      .appbar-title.as-btn { background: none; border: 0; color: inherit; font-family: inherit; cursor: pointer; padding: 4px 8px; }
      .appbar-title small { display: block; font-size: 10px; opacity: 0.8; font-weight: 600; margin-top: 2px; }

      .capsule { width: 86px; height: 32px; border: 1px solid rgba(255,255,255,0.5); border-radius: 999px; background: rgba(0,0,0,0.08); display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; }
      .capsule-more { display: flex; justify-content: center; gap: 2px; }
      .capsule-more i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
      .capsule-divider { width: 1px; height: 18px; background: rgba(255,255,255,0.35); }
      .capsule-close { display: grid; place-items: center; }
      .capsule-close-ring { width: 15px; height: 15px; border: 2px solid currentColor; border-radius: 50%; position: relative; }
      .capsule-close-ring::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
      .wechat-more { display: flex; gap: 3px; }
      .wechat-more i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

      .phone-content { min-height: 620px; }

      /* ===== 微信聊天 ===== */
      .wechat-chat { min-height: 620px; padding: 16px 12px 72px; background: #ededed; position: relative; }
      .chat-time { text-align: center; color: #999; font-size: 11px; margin: 8px 0 16px; }
      .msg { display: flex; gap: 8px; margin-bottom: 18px; align-items: flex-start; }
      .msg.mine { flex-direction: row-reverse; }
      .avatar { width: 38px; height: 38px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 800; flex: 0 0 auto; }
      .msg.mine .avatar { background: var(--wechat); }
      .msg-body { max-width: 250px; }
      .msg.mine .msg-body { text-align: right; }
      .sender { font-size: 11px; color: #888; margin: 0 3px 4px; }
      .bubble { display: inline-block; padding: 11px 13px; border-radius: 4px 16px 16px 16px; background: #fff; font-size: 15px; line-height: 1.55; text-align: left; }
      .msg.mine .bubble { border-radius: 16px 4px 16px 16px; background: #95ec69; }
      .chat-input { position: absolute; bottom: 0; left: 0; right: 0; height: 58px; padding: 8px 10px; display: grid; grid-template-columns: 32px 1fr 32px 32px; gap: 8px; align-items: center; background: #f7f7f7; border-top: 1px solid #ddd; }
      .chat-tool { width: 30px; height: 30px; border: 1px solid #888; border-radius: 50%; display: grid; place-items: center; color: #555; font-size: 13px; }
      .chat-field { height: 38px; border-radius: 6px; background: #fff; }

      .mp-card { width: 250px; margin-top: 8px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: left; border: 0; padding: 0; display: block; }
      .mp-card-main { padding: 14px; }
      .mp-card-brand { display: flex; align-items: center; gap: 6px; color: #777; font-size: 11px; }
      .mp-card-logo { width: 22px; height: 22px; border-radius: 5px; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
      .mp-card-title { margin-top: 10px; font-size: 16px; font-weight: 800; line-height: 1.35; }
      .mp-card-body { margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--red-soft); }
      .mp-card-body strong { display: block; font-size: 15px; color: var(--red-dark); }
      .mp-card-body span { font-size: 12px; color: #7a5d5e; }
      .mp-card-footer { padding: 8px 14px; border-top: 1px solid #eee; color: #999; font-size: 10px; display: flex; justify-content: space-between; }

      .service-card { width: 250px; margin-top: 8px; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: left; border: 0; padding: 0; display: block; }
      .service-card-main { padding: 14px; }
      .service-card-brand { display: flex; align-items: center; gap: 6px; color: #777; font-size: 11px; }
      .service-card-logo { width: 22px; height: 22px; border-radius: 5px; background: var(--gold); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
      .service-card-title { margin-top: 10px; font-size: 16px; font-weight: 800; line-height: 1.35; }
      .service-card-body { margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--gold-soft); }
      .service-card-body strong { display: block; font-size: 15px; color: var(--gold-dark); }
      .service-card-body span { font-size: 12px; color: #7a6a4e; }
      .service-card-footer { padding: 8px 14px; border-top: 1px solid #eee; color: #999; font-size: 10px; display: flex; justify-content: space-between; }

      /* ===== Chat First：App 内聊天 ===== */
      .app-content { min-height: 620px; padding: 14px; display: flex; flex-direction: column; }
      .pioneer-phone .app-content, .confirm-phone .app-content, .mycards-phone .app-content, .discover-phone .app-content, .provide-phone .app-content { background: #fdf9ef; }
      .requester-phone .app-content { background: #fdf3f3; }

      .chat-main { flex: 1; display: grid; align-content: start; gap: 12px; padding: 4px 2px 14px; }

      .ai-msg { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; max-width: 94%; }
      .ai-msg.me { justify-self: end; grid-template-columns: 1fr 32px; }
      .ai-avatar { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 900; background: #566684; }
      .ai-avatar.provider { background: #f5d786; color: var(--gold-dark); }
      .ai-msg.me .ai-avatar { background: var(--gold); }
      .requester-phone .ai-msg.me .ai-avatar { background: var(--red); }
      .ai-body { background: #fff; padding: 10px 12px; border-radius: 3px 14px 14px 14px; font-size: 14px; line-height: 1.55; }
      .ai-msg.provider .ai-body { background: #fff8e6; }
      .ai-msg.me .ai-body { border-radius: 14px 3px 14px 14px; background: var(--gold); color: #fff; }
      .requester-phone .ai-msg.me .ai-body { background: var(--red); }
      .ai-name { font-size: 11px; color: #888; margin-bottom: 4px; }
      .ai-msg.me .ai-name { text-align: right; }

      /* 聊天流中的卡片 */
      .chat-card { width: 100%; max-width: 94%; }
      .chat-card .inner { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
      .chat-card .kicker { font-size: 11px; font-weight: 800; margin-bottom: 6px; }
      .pioneer-phone .chat-card .kicker, .confirm-phone .chat-card .kicker, .mycards-phone .chat-card .kicker, .discover-phone .chat-card .kicker, .provide-phone .chat-card .kicker { color: var(--gold-dark); }
      .requester-phone .chat-card .kicker { color: var(--red-dark); }
      .chat-card h3 { margin: 0 0 6px; font-size: 18px; }
      .chat-card .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .chat-card .quote { background: var(--red-soft); border-left: 4px solid var(--red); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 14px; line-height: 1.55; margin: 10px 0; }
      .chat-card .quote-gold { background: var(--gold-soft); border-left: 4px solid var(--gold); padding: 10px 12px; border-radius: 0 10px 10px 0; font-size: 14px; line-height: 1.55; margin: 10px 0; }

      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .tag { padding: 5px 10px; border-radius: 999px; background: #f1f1f1; color: #555; font-size: 12px; font-weight: 700; }
      .tag.gold { background: var(--gold-soft); color: var(--gold-dark); }
      .tag.red { background: var(--red-soft); color: var(--red-dark); }
      .tag.green { background: var(--wechat-soft); color: var(--wechat-dark); }

      .fact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .fact-cell { background: #f7f4ec; border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.45; }
      .requester-phone .fact-cell { background: #f8f2f2; }
      .fact-cell strong { display: block; font-size: 16px; margin-bottom: 2px; }
      .fact-cell span { color: var(--muted); }

      .disclosure { background: var(--red-soft); color: var(--red-dark); padding: 10px; border-radius: 10px; font-size: 12px; line-height: 1.5; margin-top: 10px; }
      .disclosure-gold { background: #fff9e6; color: var(--gold-dark); border: 1px solid #f0dca6; padding: 10px; border-radius: 10px; font-size: 12px; line-height: 1.5; margin-top: 10px; }

      /* 卡片内业务按钮 */
      .card-actions { display: grid; gap: 8px; margin-top: 14px; }
      .card-btn { padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 800; border: 0; width: 100%; }
      .card-btn.primary { background: var(--gold); color: #fff; }
      .requester-phone .card-btn.primary { background: var(--red); }
      .card-btn.secondary { background: #fff; border: 1px solid var(--line); color: var(--ink); }
      .card-btn.text { background: none; border: 0; color: var(--muted); font-weight: 500; padding: 8px; }

      /* 数据承诺卡 */
      .privacy-card { background: var(--red); color: #fff; border-radius: 14px; padding: 18px; }
      .privacy-card h3 { margin: 0 0 8px; font-size: 20px; line-height: 1.25; color: #fff; }
      .privacy-card p { margin: 0; font-size: 13px; line-height: 1.55; opacity: 0.92; }
      .promise-row { display: flex; gap: 8px; margin-top: 10px; font-size: 13px; line-height: 1.5; }
      .promise-row span:first-child { font-weight: 900; }

      .price-big { display: flex; align-items: baseline; gap: 6px; margin: 8px 0 4px; }
      .requester-phone .price-big { color: var(--red); }
      .price-big strong { font-size: 28px; }
      .price-big span { font-size: 13px; }
      .mini-tag { padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; }
      .mini-tag.free { background: var(--red-soft); color: var(--red); }
      .mini-tag.points { background: var(--gold-soft); color: var(--gold-dark); }

      .details-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
      .details-table td { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
      .details-table td:last-child { text-align: right; font-weight: 800; }
      .details-table tr.total td { border-bottom: 0; font-size: 14px; }
      .requester-phone .details-table tr.total td { color: var(--red); }

      /* 快捷 pills：仅用于产品功能引导 */
      .quick-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
      .quick-pill { padding: 10px 14px; border-radius: 999px; border: 1px solid var(--gold); background: #fff; color: var(--gold-dark); font-size: 14px; font-weight: 700; }
      .quick-pill.primary { background: var(--gold); color: #fff; }
      .quick-pill.text { border: 0; background: none; color: var(--muted); font-weight: 500; padding: 10px 8px; }
      .requester-phone .quick-pill { border-color: var(--red); color: var(--red-dark); }
      .requester-phone .quick-pill.primary { background: var(--red); color: #fff; }

      .composer-gold { display: grid; grid-template-columns: 1fr 40px; gap: 10px; }
      .composer-gold input { border: 1px solid #e3d6b8; border-radius: 999px; padding: 11px 14px; font-size: 14px; outline: 0; background: #fff; }
      .composer-gold button { border: 0; border-radius: 50%; background: var(--gold); color: #fff; font-size: 17px; }
      .requester-phone .composer-gold input { border-color: #e2ced0; }
      .requester-phone .composer-gold button { background: var(--red); }

      /* 混合会话（场景B小李端） */
      .room-card { background: #fff; border-radius: 14px; padding: 14px; }
      .room-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
      .room-header strong { font-size: 16px; }
      .room-header small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
      .room-status { padding: 4px 9px; border-radius: 999px; background: #eaf6ed; color: var(--wechat-dark); font-size: 10px; font-weight: 800; white-space: nowrap; }
      .members { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
      .member-avatar { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 900; margin: 0 auto 5px; }
      .member-avatar.system { background: #566684; }
      .member-avatar.provider { color: var(--gold-dark); background: #f5d786; }
      .member-avatar.human { background: #a05a5e; }
      .member-avatar.me { background: var(--red); }
      .member-name { font-size: 10px; color: #666; }
      .room-scope { margin-top: 10px; padding-top: 8px; border-top: 1px solid #f0e2e2; font-size: 11px; color: #777; line-height: 1.45; }
      .room-action { margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--red); background: #fff; color: var(--red-dark); font-size: 13px; font-weight: 800; width: 100%; }
      .room-action.joined { border-color: var(--line); color: var(--muted); background: #fafafa; }

      .chat-msg { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; max-width: 94%; }
      .chat-msg.me { justify-self: end; grid-template-columns: 1fr 32px; }
      .msg-avatar { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 900; }
      .msg-avatar.system { background: #566684; }
      .msg-avatar.provider { color: var(--gold-dark); background: #f5d786; }
      .msg-avatar.human { background: #a05a5e; }
      .msg-avatar.me { background: var(--red); }
      .msg-body2 { background: #fff; padding: 10px 12px; border-radius: 3px 14px 14px 14px; font-size: 14px; line-height: 1.5; }

    <script>
      const scenarios = {
        lu: {

          desc: "鲁师傅把赵阿姨拉进 App：确认服务、积累亲历卡、自己发现服务者、也能成为服务者",
          flow: ["private", "confirm", "home", "discover", "provide", "mycards"],

        taozi: {
          name: "桃子的厨房",
          type: "先行者拉求助者",
          desc: "赵阿姨已有亲历卡，把卡分享给群里求助的小李，小李进入 App",

          needShort: "家常菜 · 清淡 · 19:00后可取",

      const screenLabels = {
        private: { label: "收到服务记录", title: "一次真实维修刚刚完成", subtitle: "鲁师傅发来服务记录卡片，赵阿姨需要进入小程序确认。", role: "赵阿姨", scene: "微信私聊 · 平台外" },
        confirm: { label: "确认服务记录", title: "赵阿姨确认这次服务", subtitle: "进入小程序就是和 AI 的聊天，鲁师傅的 Agent 发来服务确认卡片。", role: "赵阿姨", scene: "近邻互助组 · 金色" },
        home: { label: "消息列表首页", title: "赵阿姨的近邻互助组首页", subtitle: "所有对话和功能都从这里进入，和微信首页一样的交互。", role: "赵阿姨", scene: "近邻互助组 · 金色" },
        mycards: { label: "我的亲历卡", title: "赵阿姨的亲历卡夹", subtitle: "确认公开后，亲历卡保存在这里，随时可以转发给需要的邻居。", role: "赵阿姨", scene: "近邻互助组 · 金色" },
        discover: { label: "问问还能找谁", title: "赵阿姨自己也能找服务", subtitle: "她不只是记录者，也可以从其他消费者的亲历网络里发现自己需要的服务者。", role: "赵阿姨", scene: "近邻互助组 · 金色" },
        provide: { label: "我也想提供服务", title: "赵阿姨想从消费者变成服务者", subtitle: "她跟 AI 提交服务意向，由工作人员联系她看如何接入。", role: "赵阿姨", scene: "近邻互助组 · 金色" },
        wechat: { label: "微信群求助", title: "求助发生在真实的邻居群里", subtitle: "小李在微信群提出需求。平台尚未介入，也没有推荐卡。", role: "小李", scene: "真实微信群 · 平台外" },
        pioneer: { label: "赵阿姨分享亲历", title: "赵阿姨用自己的亲历回应", subtitle: "她把群聊截图带进近邻互助组，AI 帮她匹配亲历卡，一键发回群里。", role: "赵阿姨", scene: "近邻互助组 · 金色" },
        shared: { label: "卡片回到群里", title: "亲历推荐回到微信群", subtitle: "赵阿姨把小程序卡片发回群里，小李还没打开近邻互助组。", role: "小李", scene: "微信群 · 小程序卡片" },
        requester: { label: "小李查看亲历", title: "小李看到赵阿姨分享的亲历", subtitle: "从卡片进入近邻互助组，数据承诺、月卡、亲历详情都在聊天里展开。", role: "小李", scene: "近邻互助组 · 红色" },
      };

      const state = {
        providerType: new URLSearchParams(location.search).get("scenario") === "taozi" ? "taozi" : "lu",
        pioneerMode: "match",
        requesterMode: "welcome",
        chatMode: "room",
        chatTarget: "agent",
        taoziJoined: false,
        lastChatMessage: "",
        newNeed: "",
        newProviderJoined: false,
        newProviderTarget: "agent",
        lastProviderMessage: "",
        showPricingDetails: false,
        welcomeShowPrice: false,
        chatStarted: false,
        cardSheetOpen: false,
        cardShared: "",
        activeThread: "taozi",
        repairStarted: false,
        drawerOpen: false,
        mycardsVisited: false,
        welcomeDone: false,
        communitySheetOpen: false,
        luConfirmStep: 0,
        luPublic: true,
        luDiscoverAsked: false,
        luProvideStep: 0,
        luProvideSkill: "",
        luProvidePlan: "",
      };

      const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));

      function currentScreen() {
        const v = new URLSearchParams(location.search).get("variant")?.toLowerCase();
        const flow = scenarios[state.providerType].flow;
        return flow.includes(v) ? v : flow[0];
      }

      function setScreen(screen) {
        if (screen === "requester" && currentScreen() === "shared") state.requesterMode = "welcome";
        if (screen === "mycards") state.mycardsVisited = true;
        const url = new URL(location.href);
        url.searchParams.set("variant", screen);
        history.replaceState({}, "", url);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function cycle(dir) {
        const flow = scenarios[state.providerType].flow;
        const idx = flow.indexOf(currentScreen());
        setScreen(flow[(idx + dir + flow.length) % flow.length]);
      }

      function currentScenario() { return scenarios[state.providerType]; }

      function scenarioSwitch() {
        return `<div class="scenario-switch">
          <button class="scenario-btn lu ${state.providerType==="lu"?"active":""}" data-action="set-provider-lu">
            <div class="scenario-label">场景 A · 供给侧进入</div>
            <div class="scenario-title">鲁师傅 · 服务者拉消费者</div>
            <div class="scenario-desc">确认服务、积累亲历卡、自己发现服务者、也能成为服务者</div>
          </button>
          <button class="scenario-btn taozi ${state.providerType==="taozi"?"active":""}" data-action="set-provider-taozi">
            <div class="scenario-label">场景 B · 需求侧进入</div>
            <div class="scenario-title">桃子 · 先行者拉求助者</div>
            <div class="scenario-desc">赵阿姨已有亲历卡，分享给群里求助的小李</div>
          </button>
        </div>`;
      }

      function journey(current) {
        const flow = currentScenario().flow;
        const items = {
          private: { n: "01", t: "收到服务记录", r: "赵阿姨 ↔ 鲁师傅", place: "微信私聊" },
          confirm: { n: "02", t: "确认服务记录", r: "赵阿姨", place: "近邻互助组" },
          home: { n: "03", t: "消息列表首页", r: "赵阿姨", place: "近邻互助组" },
          discover: { n: "04", t: "问问还能找谁", r: "赵阿姨", place: "二级对话" },
          provide: { n: "05", t: "我也想提供服务", r: "赵阿姨", place: "二级对话" },
          mycards: { n: "06", t: "我的亲历卡", r: "赵阿姨", place: "二级功能页" },
          wechat: { n: "01", t: "微信群求助", r: "小李提出需求", place: "真实关系场" },
          pioneer: { n: "02", t: "赵阿姨分享", r: "亲历先行者", place: "近邻互助组" },
          shared: { n: "03", t: "卡片回到群里", r: "小程序分享", place: "真实关系场" },
          requester: { n: "04", t: "小李查看亲历", r: "进入小程序", place: "近邻互助组" },
        };
        return `<div class="journey flow-${flow.length}">${flow.map(k=>`
          <button class="journey-step ${k}-step ${current===k?"active":""}" data-action="jump-${k}">
            <span class="step-label">${items[k].n} · ${items[k].place}</span>
            <span class="step-title">${items[k].t}</span>
            <span class="step-role">${items[k].r}</span>
          </button>`).join("")}</div>`;
      }

      function phoneFrame(kind, title, subtitle, content, leftHtml = "") {
        const isMp = kind !== "wechat" && kind !== "private" && kind !== "shared";
        const right = isMp
          ? `<div class="capsule"><span class="capsule-more"><i></i><i></i><i></i></span><span class="capsule-divider"></span><span class="capsule-close"><i class="capsule-close-ring"></i></span></div>`
          : `<span class="wechat-more"><i></i><i></i><i></i></span>`;
        const left = leftHtml || `<span class="nav-back">‹</span>`;
        return `
          <div class="phone ${kind}-phone">
            <div class="statusbar">
              <span>19:42</span>

        const panels = {
          private: { number: "01 / 06", role: "赵阿姨 · 消费者", place: "微信私聊", platform: "收到服务记录", knows: "刚完成的服务", stories: ["US-A01"], storyTitle: "收到待确认的服务记录", accepts: ["微信卡片直达对应记录", "未确认记录不计为履约事实"], copy: "鲁师傅发来服务记录卡片，赵阿姨需要点击进入近邻互助组小程序确认。", next: "进入小程序确认", action: "jump-confirm" },
          confirm: { number: "02 / 06", role: "赵阿姨 · 消费者", place: "二级对话", platform: "确认服务记录", knows: "服务详情 + 公开选项", stories: ["US-A02"], storyTitle: "确认事实并选择公开范围", accepts: ["确认事实与公开亲历是两个动作", "仅自己保存时不进入可发现网络"], copy: "业务按钮长在卡片上：确认、公开都在卡片内完成。左上角返回消息列表首页。", next: "回到首页", action: "jump-home" },
          home: { number: "03 / 06", role: "赵阿姨 · 消费者", place: "近邻互助组", platform: "消息列表首页", knows: "所有对话与功能", stories: ["US-A03"], storyTitle: "从消息首页处理独立任务", accepts: ["首页以会话和待办为中心", "返回后保留各会话状态"], copy: "所有对话和功能都从首页进入，点对话进二级页，左上角返回——和微信首页一样的交互。", next: "问问还能找谁", action: "jump-discover" },
          mycards: { number: "06 / 06", role: "赵阿姨 · 消费者", place: "二级功能页", platform: "亲历卡夹", knows: "自己的亲历卡", stories: ["US-A04"], storyTitle: "复用并分享本人亲历卡", accepts: ["只显示本人有权分享的亲历", "分享不携带其他私人记忆"], copy: "卡夹是独立列表页（微信卡包模式），不再是聊天。每张卡带转发按钮，左上角返回首页。", next: "回到首页", action: "jump-home" },
          discover: { number: "04 / 06", role: "赵阿姨 · 消费者", place: "二级对话", platform: "从亲历网络找服务", knows: "自己的需求", stories: ["US-A05"], storyTitle: "从可见亲历网络寻找服务者", accepts: ["只检索当前用户有权查看的亲历", "候选不是全局排名或平台担保"], copy: "示例 pill 只在刚进来时显示；用户开始提问后隐藏；找到候选人后，对话按钮在候选人卡片内。", next: "我也想提供服务", action: "jump-provide" },
          provide: { number: "05 / 06", role: "赵阿姨 · 准服务者", place: "二级对话", platform: "提交服务意向", knows: "自己的技能", stories: ["US-A06"], storyTitle: "表达成为服务者的意向", accepts: ["提交的是意向，不是自动认证", "后续由工作人员联系确认"], copy: "示例 pill 初始显示，对话开始即隐藏；意向提交完成后，pill 再引导回其他功能。", next: "看看场景 B", action: "set-provider-taozi" },
          wechat: { number: "01 / 04", role: "小李 · 求助者", place: "阳光花园邻居群", platform: "尚未介入", knows: "自己的真实需求", stories: ["US-B01"], storyTitle: "求助保留在原有关系场", accepts: ["平台不自动抓取群聊", "亲历先行者主动带入截图后才处理"], copy: "需求原本就发生在真实关系场里。这一屏不展示推荐卡，也不出现近邻互助组。", next: "赵阿姨开始回应", action: "jump-pioneer" },
          pioneer: { number: "02 / 04", role: "赵阿姨 · 亲历先行者", place: "近邻互助组", platform: "选择或补录亲历", knows: "群聊需求 + 本人记录", stories: ["US-B02", "US-B03"], storyTitle: "匹配已有亲历，或补录本人陈述", accepts: ["系统不得自动发回微信群", "新补录必须本人确认并标明证据等级"], copy: "AI 识别截图并匹配亲历卡，「发回微信群」「补录一张」都在卡片内。", next: "卡片回到微信群", action: "share-existing" },
          shared: { number: "03 / 04", role: "小李 · 求助者", place: "阳光花园邻居群", platform: "小程序卡片已出现", knows: "赵阿姨有一段亲历", stories: ["US-B04"], storyTitle: "亲历卡回到原微信群", accepts: ["卡片说明分享者、匹配点和证据等级", "点击后才真正打开近邻互助组"], copy: "小李仍在微信里。他先看到赵阿姨的回复和一张小程序卡片；只有点击卡片后，近邻互助组才真正打开。", next: "点击卡片，打开近邻互助组", action: "open-card" },
          requester: { number: "04 / 04", role: "小李 · 求助者", place: "近邻互助组", platform: "查看亲历与混合会话", knows: "谁推荐、凭什么、下一步", stories: ["US-C01", "US-C02"], storyTitle: "首次进入、查看亲历与继续行动", accepts: ["只展示当前判断所需的有限亲历", "数据承诺、证据等级与非担保边界可见"], copy: "数据承诺、月卡、亲历详情在聊天流里展开；「继续查看」「问桃子两句」等业务按钮都在卡片内。", next: "回到微信群卡片", action: "jump-shared" },
        };
        const data = panels[screen];
        if (screen === "requester") {
          if (["welcome", "pricing"].includes(state.requesterMode)) {
            Object.assign(data, { stories: ["US-C01"], storyTitle: "首次访问者理解数据与付费承诺", accepts: ["明确不出售消费记录和关系链", "拒绝或退出必须真实可用"] });
          } else if (state.requesterMode === "detail") {
            Object.assign(data, { stories: ["US-C02"], storyTitle: "查看足够但不过量的亲历证据", accepts: ["展示关系、次数、新鲜度与证据等级", "说明无佣金、非平台担保"] });
          } else if (state.requesterMode === "handoff") {
            Object.assign(data, { stories: ["US-C03"], storyTitle: "跨小程序前获得明确授权", accepts: ["说明目标小程序与最小需求摘要", "取消后留在当前亲历详情"] });
          } else if (state.requesterMode === "chat" && ["new-need", "matching"].includes(state.chatMode)) {
            Object.assign(data, { stories: ["US-D03"], storyTitle: "为新需求创建独立会话", accepts: ["默认不继承桃子房间内容", "新旧会话状态互不覆盖"] });
          } else if (state.requesterMode === "chat" && state.chatMode === "new-provider-room") {
            Object.assign(data, { stories: ["US-D04"], storyTitle: "为新服务者建立新混合会话", accepts: ["新房间不复用旧参与者或数据", "继续区分真人、服务者 Agent 与系统 Agent"] });
          } else if (state.requesterMode === "chat") {
            Object.assign(data, { stories: ["US-D01", "US-D02"], storyTitle: "看清参与者，并选择与谁沟通", accepts: ["每条消息标明责任主体", "报价、接单与最终承诺必须由真人确认"] });
          }
        }
        const colorClass = screen==="private" ? "green" : screen==="wechat" ? "gold" : ["confirm","mycards","discover","provide"].includes(screen) ? "gold" : screen==="pioneer" ? "green" : screen==="shared" ? "red" : "white";
        return `
          <aside class="status-panel">
            <div class="status-head"><div class="scene">${data.number} · ${screenLabels[screen].scene}</div><h2>${data.role}</h2></div>
            <div class="status-body">
              <div class="status-item"><div class="label">所在位置</div><div class="value">${data.place}</div></div>
              <div class="status-item"><div class="label">平台状态</div><div class="value">${data.platform}</div></div>
              <div class="status-item"><div class="label">此时知道</div><div class="value">${data.knows}</div></div>
            </div>
            <div class="status-copy">${data.copy}</div>
            <div class="story-block">
              <div class="story-kicker">Implementation reference</div>
              <div class="story-chips">${data.stories.map(id => `<a class="story-chip" href="https://github.com/code-for-people-2026/ideal/blob/main/%E7%89%9B%E9%A9%AC%E4%BA%92%E5%8A%A9%E5%B9%B3%E5%8F%B0/user-stories/%E8%BF%91%E9%82%BB%E4%BA%92%E5%8A%A9%E7%BB%84-MVP.md" title="打开 User Stories">${id}</a>`).join("")}</div>
              <div class="story-title">${data.storyTitle}</div>
              <ul class="accept-list">${data.accepts.map(item => `<li>${item}</li>`).join("")}</ul>
            </div>
            <div class="spec-links">
              <a href="https://github.com/code-for-people-2026/ideal/blob/main/%E7%89%9B%E9%A9%AC%E4%BA%92%E5%8A%A9%E5%B9%B3%E5%8F%B0/user-stories/%E8%BF%91%E9%82%BB%E4%BA%92%E5%8A%A9%E7%BB%84-MVP.md">完整 User Stories</a>
              <a href="https://github.com/code-for-people-2026/ideal/blob/main/%E7%89%9B%E9%A9%AC%E4%BA%92%E5%8A%A9%E5%B9%B3%E5%8F%B0/product-decisions/%E5%8F%8C%E8%BD%A8%E5%8E%9F%E5%9E%8B-%E7%90%86%E8%AE%BA%E5%9F%BA%E7%A1%80%E4%B8%8E%E8%BE%B9%E7%95%8C%E7%A0%94%E7%A9%B6.md">原型边界</a>
            </div>
            <button class="status-action ${colorClass}" data-action="${data.action}">${data.next}</button>
          </aside>`;
      }

      function render() {
        const screen = currentScreen();
        const s = currentScenario();
        document.title = `${screenLabels[screen].label} · ${s.name} · 近邻互助组`;
        const phones = {
          private: privateScreen,
          confirm: confirmScreen,
          home: luHomeScreen,
          mycards: mycardsScreen,
          discover: discoverScreen,
          provide: provideScreen,
          wechat: wechatScreen,
          pioneer: pioneerScreen,
          shared: sharedCardScreen,
          requester: requesterScreen,
        };
        document.querySelector("#app").innerHTML = `
          <main class="shell ${screen}">
            <header class="hero">
              <div class="hero-main">
                <h1>${screenLabels[screen].title}</h1>
                <p>${screenLabels[screen].subtitle}</p>
              </div>
              <div class="badge">IRP · 对照 User Story · 不接真实数据</div>
            </header>
            ${scenarioSwitch()}
            ${journey(screen)}
            <div class="stage">
              <section class="phone-stage">${phones[screen]()}</section>
              ${statusPanel(screen)}
            </div>
          </main>
          <nav class="switcher"><button data-action="previous">←</button><div class="switcher-label">${screenLabels[screen].label}</div><button data-action="next">→</button></nav>`;
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        const a = el?.dataset.action;
        if (!a) return;
        if (a === "previous") cycle(-1);
        if (a === "next") cycle(1);
        if (a === "set-provider-taozi") { state.providerType = "taozi"; const url = new URL(location.href); url.searchParams.set("scenario", "taozi"); history.replaceState({}, "", url); setScreen("wechat"); }
        if (a === "set-provider-lu") { state.providerType = "lu"; const url = new URL(location.href); url.searchParams.set("scenario", "lu"); history.replaceState({}, "", url); setScreen("private"); }
        if (a === "confirm-lu-service") { state.luConfirmStep = 1; render(); }
        if (a === "public-lu-card") { state.luPublic = true; state.luConfirmStep = 2; render(); }
        if (a === "keep-private") { state.luPublic = false; state.luConfirmStep = 2; render(); }
        if (a === "edit-lu-service") { setScreen("private"); }
        if (a === "open-card-sheet") { state.cardSheetOpen = true; render(); }
        if (a === "close-card-sheet") { state.cardSheetOpen = false; render(); }
        if (a === "share-card") { state.cardShared = el.dataset.name; state.cardSheetOpen = false; render(); }
        if (a === "discover-ask") { state.luDiscoverAsked = true; render(); }
        if (a === "discover-chat") { alert("原型：建立与老张的四方混合会话"); }
        if (a === "provide-skill") { const i=document.querySelector("#provide-skill-input"); state.luProvideSkill = el.dataset.skill || i?.value.trim() || "我会包荠菜饺子，邻居都说好吃"; state.luProvideStep = 1; render(); }
        if (a === "provide-plan") { const i=document.querySelector("#provide-plan-input"); state.luProvidePlan = i?.value.trim() || "周末可以包，一份 30 个 25 块钱，送到楼下"; state.luProvideStep = 2; render(); }
        if (a.startsWith("jump-")) setScreen(a.replace("jump-",""));
        if (a === "open-card") { state.requesterMode = "welcome"; state.welcomeShowPrice = false; state.chatStarted = false; state.chatMode = "room"; state.activeThread = "taozi"; state.repairStarted = false; setScreen("requester"); }
        if (a === "ask-price") { state.welcomeShowPrice = true; render(); }
        if (a === "skip-pricing") { state.welcomeDone = true; state.requesterMode = "detail"; render(); }
        if (a === "continue-requester") { state.welcomeDone = true; state.requesterMode = "detail"; render(); }
        if (a === "show-pricing") { state.requesterMode = "pricing"; render(); }
        if (a === "back-welcome") { state.requesterMode = "welcome"; render(); }
        if (a === "toggle-pricing") { state.showPricingDetails = !state.showPricingDetails; render(); }
        if (a === "start-agent-chat") { state.chatStarted = true; state.requesterMode = "chat"; state.chatMode = "room"; render(); }
        if (a === "talk-to-provider" || a === "target-human") { state.taoziJoined = true; state.chatTarget = "human"; render(); }
        if (a === "target-agent") { state.chatTarget = "agent"; render(); }
        if (a === "send-chat-message") { const i=document.querySelector("#mixed-chat-input"); if(i?.value.trim()){state.lastChatMessage=i.value.trim();render();} }
        if (a === "start-new-need") { state.requesterMode = "chat"; state.activeThread = "repair"; state.repairStarted = true; state.chatMode = "new-need"; render(); }
        if (a === "back-provider-room") { state.activeThread = "taozi"; render(); }
        if (a === "open-community") { state.communitySheetOpen = true; render(); }
        if (a === "close-community") { state.communitySheetOpen = false; render(); }
        if (a === "new-chat-quick") {
          if (state.providerType === "lu") { setScreen("discover"); }
          else { state.activeThread = "repair"; state.repairStarted = true; state.chatMode = "new-need"; state.requesterMode = "chat"; render(); }
        }
        if (a === "back-home") { state.requesterMode = "home"; render(); }
        if (a === "open-thread-taozi") { state.activeThread = "taozi"; state.requesterMode = "chat"; render(); }
        if (a === "open-thread-repair") { state.activeThread = "repair"; state.requesterMode = "chat"; render(); }
        if (a === "drawer-go-welcome") { state.requesterMode = "welcome"; state.welcomeShowPrice = true; render(); }
        if (a === "search-new-service") { const i=document.querySelector("#new-need-input"); state.newNeed = el.dataset.need || i?.value.trim() || "周末上门修洗衣机"; state.chatMode = "matching"; render(); }
        if (a === "back-new-need") { state.chatMode = "new-need"; render(); }
        if (a === "open-new-provider-room") { state.chatMode = "new-provider-room"; render(); }
        if (a === "back-matching") { state.chatMode = "matching"; render(); }
        if (a === "talk-to-new-provider" || a === "target-new-human") { state.newProviderJoined = true; state.newProviderTarget = "human"; render(); }
        if (a === "target-new-agent") { state.newProviderTarget = "agent"; render(); }
        if (a === "send-new-provider-message") { const i=document.querySelector("#new-provider-input"); if(i?.value.trim()){state.lastProviderMessage=i.value.trim();render();} }
        if (a === "open-provider") { state.requesterMode = "handoff"; render(); }
        if (a === "back-detail") { state.requesterMode = "detail"; state.chatStarted = false; state.chatMode = "room"; render(); }
        if (a === "back-handoff") { state.requesterMode = state.chatStarted ? "chat" : "detail"; render(); }
        if (a === "start-voice") { state.pioneerMode = "voice"; render(); }
        if (a === "capture-voice") { state.pioneerMode = "draft"; render(); }
        if (a === "back-to-match") { state.pioneerMode = "match"; render(); }
        if (a === "share-existing") { state.pioneerMode = "match"; if(state.providerType==="taozi"){setScreen("shared");}else{alert("原型：已转发");} }
        if (a === "share-voice") { setScreen("shared"); }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && ["mixed-chat-input","new-need-input","new-provider-input","discover-input","provide-skill-input","provide-plan-input"].includes(e.target.id)) {
          e.preventDefault();
          e.target.parentElement.querySelector("[data-action]")?.click();
        }
        if (["INPUT","TEXTAREA"].includes(document.activeElement?.tagName)) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
      });

      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
