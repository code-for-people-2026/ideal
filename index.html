<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="近邻互助组通过真实亲历帮助邻里找到彼此，街坊味和楼道收一收承接具体协作。"
    />
    <title>近邻互助组 · 原型地图</title>
    <!--
      PROTOTYPE — 不接真实数据，不是生产代码。
      本轮问题：入口页能否像社交图谱一样表达近邻互助组与不同应用之间的关系，而不形成树状层级？
    -->
    <style>
      :root {
        color-scheme: light;
        --ink: #172019;
        --muted: #5e695f;
        --paper: #f5f1e7;
        --paper-deep: #eae3d4;
        --green: #176044;
        --green-dark: #0d422f;
        --red: #b43d31;
        --red-dark: #78241f;
        --orange: #d8652d;
        --orange-dark: #8b3517;
        --grey: #a9afa8;
        --shadow: 0 26px 70px rgba(35, 47, 38, 0.14);
      }

      * { box-sizing: border-box; }

      html {
        min-width: 320px;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 9% 7%, rgba(216, 101, 45, 0.12), transparent 29rem),
          radial-gradient(circle at 91% 24%, rgba(23, 96, 68, 0.12), transparent 31rem),
          linear-gradient(180deg, #faf8f2 0%, var(--paper) 48%, var(--paper-deep) 100%);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      a:focus-visible {
        outline: 4px solid rgba(23, 96, 68, 0.36);
        outline-offset: 5px;
      }

      .page {
        width: min(1320px, calc(100% - 48px));
        margin: 0 auto;
        padding: 28px 0 54px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        font-size: 15px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(23, 96, 68, 0.16);
        border-radius: 999px;
        color: var(--green);
        background: rgba(255, 255, 255, 0.62);
        font-size: 11px;
        font-weight: 850;
      }

      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #29a36a;
        box-shadow: 0 0 0 4px rgba(41, 163, 106, 0.12);
      }

      .hero {
        max-width: 980px;
        margin: 0 auto;
        padding: 70px 0 50px;
        text-align: center;
      }

      .eyebrow {
        color: var(--red);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
      }

      h1 {
        max-width: 960px;
        margin: 17px auto 22px;
        font-size: clamp(48px, 6.5vw, 88px);
        line-height: 1;
        letter-spacing: -0.07em;
        text-wrap: balance;
      }

      .lead {
        max-width: 720px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(17px, 1.8vw, 21px);
        line-height: 1.72;
        text-wrap: pretty;
      }

      .atlas {
        position: relative;
        height: 800px;
        border: 1px solid rgba(53, 65, 56, 0.12);
        border-radius: 44px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.42) 45%, transparent 72%),
          rgba(255, 255, 255, 0.34);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), var(--shadow);
      }

      .connections {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .connection {
        fill: none;
        stroke: rgba(23, 96, 68, 0.42);
        stroke-width: 1.8;
        vector-effect: non-scaling-stroke;
      }

      .connection.future {
        stroke: rgba(111, 121, 112, 0.42);
        stroke-dasharray: 5 8;
      }

      .connections-mobile { display: none; }

      .map-node {
        position: absolute;
        z-index: 2;
        left: var(--x);
        top: var(--y);
        display: flex;
        width: var(--size);
        height: var(--size);
        padding: 26px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        text-align: center;
      }

      a.map-node {
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      a.map-node:hover {
        transform: translate(-50%, -50%) scale(1.025);
      }

      .map-node h2,
      .map-node h3 {
        margin: 0;
        line-height: 1.06;
        letter-spacing: -0.045em;
      }

      .map-node h2 { font-size: 38px; }
      .map-node h3 { font-size: 29px; }

      .map-node p {
        max-width: 210px;
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.58;
        text-wrap: pretty;
      }

      .hub-node {
        --x: 50%;
        --y: 400px;
        --size: 310px;
        color: #fff;
        background:
          radial-gradient(circle at 31% 23%, rgba(255, 255, 255, 0.16), transparent 36%),
          linear-gradient(145deg, #1b6d4d, var(--green-dark));
        box-shadow: 0 30px 72px rgba(13, 66, 47, 0.28), inset 0 0 0 1px rgba(255, 255, 255, 0.17);
      }

      .hub-node p { color: rgba(255, 255, 255, 0.78); }

      .app-node {
        --size: 224px;
        color: #fff;
        box-shadow: 0 24px 58px rgba(58, 42, 32, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.24);
      }

      .app-node p {
        max-width: 174px;
        color: rgba(255, 255, 255, 0.8);
      }

      .kith-node {
        --x: 19%;
        --y: 290px;
        background:
          radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.18), transparent 36%),
          linear-gradient(145deg, #c94a3d, var(--red-dark));
      }

      .recycle-node {
        --x: 81%;
        --y: 515px;
        background:
          radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.2), transparent 36%),
          linear-gradient(145deg, #e4773f, var(--orange-dark));
      }

      .future-node {
        --size: 116px;
        z-index: 1;
        padding: 17px;
        color: #697169;
        border: 1px dashed #aeb4ad;
        background: rgba(227, 228, 223, 0.88);
        box-shadow: 0 12px 28px rgba(59, 65, 59, 0.08);
      }

      .future-node h3 { font-size: 17px; }
      .future-node p { margin-top: 7px; font-size: 9px; line-height: 1.4; }
      .future-one { --x: 50%; --y: 90px; }
      .future-two { --x: 25%; --y: 700px; }
      .future-three { --x: 78%; --y: 135px; }

      footer {
        display: flex;
        margin-top: 38px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: #687269;
        font-size: 11px;
        line-height: 1.6;
      }

      footer strong { color: var(--ink); }

      @media (max-width: 900px) {
        .page { width: min(100% - 32px, 760px); }
        .hero { padding: 62px 0 44px; }
        .atlas { height: 790px; border-radius: 34px; }
        .connections-desktop { display: none; }
        .connections-mobile { display: block; }

        .hub-node { --x: 50%; --y: 370px; --size: 230px; }
        .app-node { --size: 164px; }
        .kith-node { --x: 23%; --y: 145px; }
        .recycle-node { --x: 77%; --y: 605px; }
        .future-node { --size: 76px; padding: 10px; }
        .future-one { --x: 82%; --y: 145px; }
        .future-two { --x: 15%; --y: 585px; }
        .future-three { --x: 50%; --y: 735px; }

        .map-node { padding: 18px; }
        .map-node h2 { font-size: 30px; }
        .map-node h3 { font-size: 23px; }
        .map-node p { margin-top: 9px; font-size: 10px; line-height: 1.48; }
        .future-node h3 { font-size: 12px; }
        .future-node p { margin-top: 4px; font-size: 7px; }
      }

      @media (max-width: 560px) {
        .page { width: calc(100% - 24px); padding-top: 18px; }
        .brand { font-size: 12px; }
        .status { padding: 7px 9px; font-size: 9px; }
        .hero { padding: 52px 5px 36px; }
        .eyebrow { font-size: 10px; }
        h1 { font-size: clamp(43px, 14vw, 62px); }
        .lead { font-size: 16px; }
        .atlas { height: 760px; border-radius: 28px; }

        .hub-node { --y: 354px; --size: 210px; }
        .app-node { --size: 146px; }
        .kith-node { --y: 132px; }
        .recycle-node { --y: 574px; }
        .future-node { --size: 66px; }
        .future-one { --y: 132px; }
        .future-two { --y: 558px; }
        .future-three { --y: 700px; }

        .map-node { padding: 14px; }
        .map-node h2 { font-size: 27px; }
        .map-node h3 { font-size: 20px; }
        .map-node p { margin-top: 7px; font-size: 9px; line-height: 1.44; }
        footer { align-items: flex-start; flex-direction: column; }
      }

      @media (prefers-reduced-motion: reduce) {
        a.map-node { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">近邻互助组 · 原型地图</div>
        <div class="status">2 个应用开放</div>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div class="eyebrow">邻里之间，真实发生</div>
          <h1 id="page-title">一次互助，长出更多相遇。</h1>
          <p class="lead">
            近邻互助组用真实亲历帮助邻里找到彼此；不同的小应用把一次具体协作接住，新的经历又会帮助下一次相遇发生。
          </p>
        </section>

        <section class="atlas" aria-label="近邻互助组应用图谱">
          <svg class="connections connections-desktop" viewBox="0 0 1000 800" preserveAspectRatio="none" aria-hidden="true">
            <line class="connection" x1="500" y1="400" x2="190" y2="290" />
            <line class="connection" x1="500" y1="400" x2="810" y2="515" />
            <line class="connection future" x1="500" y1="400" x2="500" y2="90" />
            <line class="connection future" x1="500" y1="400" x2="250" y2="700" />
            <line class="connection future" x1="500" y1="400" x2="780" y2="135" />
          </svg>
          <svg class="connections connections-mobile" viewBox="0 0 1000 760" preserveAspectRatio="none" aria-hidden="true">
            <line class="connection" x1="500" y1="354" x2="230" y2="132" />
            <line class="connection" x1="500" y1="354" x2="770" y2="574" />
            <line class="connection future" x1="500" y1="354" x2="820" y2="132" />
            <line class="connection future" x1="500" y1="354" x2="150" y2="558" />
            <line class="connection future" x1="500" y1="354" x2="500" y2="700" />
          </svg>

          <a class="map-node hub-node" href="./牛马互助平台/" aria-label="打开近邻互助组原型入口">
            <h2>近邻互助组</h2>
            <p>用真实发生过的互助经历，帮助邻里找到值得信任、真正帮得上忙的人。</p>
          </a>

          <a class="map-node app-node kith-node" href="./街坊味/" aria-label="打开街坊味原型入口">
            <h3>街坊味</h3>
            <p>认识附近做饭的人，从菜单选择到送达收款，把一餐饭稳稳接住。</p>
          </a>

          <a class="map-node app-node recycle-node" href="./楼道回收提醒/" aria-label="打开楼道收一收原型入口">
            <h3>楼道收一收</h3>
            <p>住户按楼层上报回收或打扫，师傅查看待办并逐项处理。</p>
          </a>

          <div class="map-node future-node future-one">
            <h3>待探索</h3>
            <p>新的邻里协作</p>
          </div>
          <div class="map-node future-node future-two">
            <h3>待探索</h3>
            <p>新的邻里协作</p>
          </div>
          <div class="map-node future-node future-three">
            <h3>待探索</h3>
            <p>新的邻里协作</p>
          </div>
        </section>
      </main>

      <footer>
        <div><strong>码成工</strong> · 一个为工友敲键盘的组织</div>
        <div>全部页面均为交互原型，不接入真实业务数据。</div>
      </footer>
    </div>
  </body>
</html>
