<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="近邻互助组通过真实亲历帮助邻里找到彼此，街坊味、排好菜和楼道收一收承接具体协作。"
    />
    <title>近邻互助组 · 原型地图</title>
    <!-- PROTOTYPE — 不接真实数据，不是生产代码。 -->
    <style>
      :root {
        color-scheme: light;
        --ink: #172019;
        --muted: #4f5751;
        --paper: #f7f3eb;
        --green: #2f5f48;
        --green-soft: #78937f;
        --red: #a94031;
        --orange: #bd6616;
        --future: #64806e;
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 24% 34%, rgba(169, 64, 49, 0.035), transparent 28rem),
          radial-gradient(circle at 69% 52%, rgba(47, 95, 72, 0.035), transparent 34rem),
          var(--paper);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      .page {
        width: min(1404px, calc(100% - 80px));
        margin: 0 auto;
        padding: 34px 0 48px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .status {
        color: var(--green);
        font-weight: 500;
      }

      .showcase {
        display: grid;
        min-height: 920px;
        grid-template-columns: 350px minmax(0, 1fr);
        gap: 28px;
      }

      .intro {
        position: relative;
        z-index: 4;
        padding-top: 152px;
        padding-left: 18px;
      }

      .eyebrow {
        color: var(--red);
        font-size: 17px;
        font-weight: 650;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 22px 0 34px;
        font-size: clamp(52px, 4vw, 60px);
        font-weight: 750;
        line-height: 1.6;
        letter-spacing: -0.055em;
      }

      h1 span { display: block; white-space: nowrap; }

      .divider {
        width: 38px;
        height: 1px;
        margin-bottom: 38px;
        background: var(--ink);
      }

      .lead {
        max-width: 276px;
        margin: 0;
        color: #303733;
        font-size: 16px;
        line-height: 2.55;
      }

      .guide {
        display: flex;
        margin: 28px 0 0;
        align-items: center;
        gap: 9px;
        color: var(--green);
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.02em;
      }

      .guide::before {
        content: "";
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--green);
      }

      .graph {
        position: relative;
        height: 920px;
        min-width: 0;
      }

      .connections {
        position: absolute;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .orbit {
        fill: none;
        stroke: var(--green-soft);
        stroke-width: 1.25;
        vector-effect: non-scaling-stroke;
      }

      .orbit.dashed {
        stroke-dasharray: 3 6;
        stroke-width: 1.45;
      }

      .orbit.faint { opacity: 0.22; }

      .anchor { stroke: var(--paper); stroke-width: 4; }
      .anchor.green { fill: var(--green); }
      .anchor.red { fill: var(--red); }
      .anchor.orange { fill: var(--orange); }

      .connections-mobile { display: none; }

      .node {
        --x: 50%;
        --y: 50%;
        --size: 180px;
        --node-color: var(--green);
        position: absolute;
        z-index: 2;
        left: var(--x);
        top: var(--y);
        display: flex;
        width: var(--size);
        height: var(--size);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 34px;
        transform: translate(-50%, -50%);
        border: 2px solid var(--node-color);
        border-radius: 50%;
        background: rgba(247, 243, 235, 0.93);
        text-align: center;
      }

      .node::after {
        content: "";
        position: absolute;
        inset: 9px;
        border: 1px solid color-mix(in srgb, var(--node-color) 76%, transparent);
        border-radius: inherit;
        pointer-events: none;
      }

      .kith::after,
      .recycle::after { display: none; }

      a.node {
        cursor: pointer;
        text-decoration: none;
        transition: background-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      a.node:hover {
        background: color-mix(in srgb, var(--node-color) 8%, var(--paper));
        box-shadow: 0 18px 38px color-mix(in srgb, var(--node-color) 18%, transparent);
        transform: translate(-50%, -50%) scale(1.028);
      }

      a.node:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--node-color) 34%, transparent);
        outline-offset: 7px;
      }

      a.node::before {
        content: "进入原型 ↗";
        position: absolute;
        z-index: 3;
        bottom: 26px;
        left: 50%;
        color: var(--node-color);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.04em;
        opacity: 0;
        transform: translate(-50%, 5px);
        transition: opacity 180ms ease, transform 180ms ease;
        white-space: nowrap;
      }

      a.node:hover::before,
      a.node:focus-visible::before {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .hub::before { bottom: 74px; }

      .node h2,
      .node h3 {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--node-color);
        line-height: 1.12;
        letter-spacing: -0.045em;
      }

      .node h2 { font-size: 40px; font-weight: 680; }
      .node h3 { font-size: 28px; font-weight: 680; }

      .node h2::after,
      .node h3::after {
        content: "";
        display: block;
        width: 38px;
        height: 1.5px;
        margin: 24px auto 22px;
        background: var(--node-color);
      }

      .node p {
        position: relative;
        z-index: 1;
        max-width: 230px;
        margin: 0;
        color: #303733;
        font-size: 16px;
        line-height: 1.78;
      }

      .hub {
        --x: 47%;
        --y: 53%;
        --size: 520px;
        --node-color: var(--green);
      }

      .kith {
        --x: 17%;
        --y: 27%;
        --size: 300px;
        --node-color: var(--red);
      }

      .recycle {
        --x: 71%;
        --y: 81%;
        --size: 305px;
        --node-color: var(--orange);
      }

      .paihaocai {
        --x: 69%;
        --y: 17%;
        --size: 220px;
        --node-color: var(--green);
      }

      .future {
        --size: 190px;
        --node-color: var(--future);
        z-index: 1;
        padding: 28px;
        border-width: 1.5px;
        border-style: dashed;
      }

      .future::after { display: none; }
      .future h3 { color: #244b39; font-size: 24px; }
      .future h3::after { display: none; }
      .future p { margin-top: 18px; font-size: 15px; line-height: 1.6; }
      .future-two { --x: 90%; --y: 56%; }
      .future-three { --x: 15%; --y: 81%; }

      footer {
        display: flex;
        margin-top: 120px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: #687269;
        font-size: 11px;
        line-height: 1.6;
      }

      footer strong { color: var(--ink); }

      @media (max-width: 1080px) {
        .page { width: min(100% - 48px, 940px); }
        .showcase { grid-template-columns: 300px minmax(0, 1fr); gap: 8px; }
        .intro { padding-top: 120px; }
        h1 { font-size: 54px; }
        .graph { transform: scale(0.88); transform-origin: center left; width: 113.64%; }
      }

      @media (max-width: 760px) {
        .page { width: calc(100% - 32px); padding-top: 24px; }
        .topbar { font-size: 13px; }
        .showcase { display: block; min-height: 0; }
        .intro { padding: 74px 4px 30px; }
        .eyebrow { font-size: 13px; }
        h1 { margin: 22px 0 28px; font-size: clamp(46px, 13.5vw, 62px); line-height: 1.26; }
        .divider { margin-bottom: 26px; }
        .lead { max-width: 560px; font-size: 15px; line-height: 2; }
        .guide { margin-top: 22px; font-size: 13px; }
        .graph { width: 100%; height: 720px; transform: none; }
        .connections-desktop { display: none; }
        .connections-mobile { display: block; }

        .node { padding: 20px; }
        .node h2 { font-size: 26px; }
        .node h3 { font-size: 20px; }
        .node h2::after,
        .node h3::after { width: 24px; margin: 14px auto 12px; }
        .node p { font-size: 10px; line-height: 1.55; }
        a.node::before { display: none; }

        .hub { --x: 50%; --y: 44%; --size: 218px; }
        .kith { --x: 22%; --y: 17%; --size: 150px; }
        .paihaocai { --x: 79%; --y: 16%; --size: 132px; }
        .recycle { --x: 77%; --y: 70%; --size: 150px; }
        .future { --size: 82px; padding: 10px; }
        .future h3 { font-size: 14px; }
        .future p { margin-top: 7px; font-size: 9px; }
        .future-two { --x: 85%; --y: 56%; }
        .future-three { --x: 17%; --y: 68%; }
        footer { margin-top: 32px; align-items: flex-start; flex-direction: column; }
      }

      @media (prefers-reduced-motion: reduce) {
        a.node { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div>近邻互助组 · 原型地图</div>
        <div class="status">4 个原型可体验</div>
      </header>

      <main class="showcase">
        <section class="intro" aria-labelledby="page-title">
          <div class="eyebrow">邻里之间，真实发生</div>
          <h1 id="page-title"><span>始于一次互助，</span><span>共建和谐社区。</span></h1>
          <div class="divider" aria-hidden="true"></div>
          <p class="lead">
            近邻互助组用真实亲历帮助邻<br />里找到彼此；不同的小应用把<br />一次具体协作接住，让互助逐<br />渐成为社区里的日常。
          </p>
          <p class="guide">点击圆形，进入对应原型</p>
        </section>

        <section class="graph" aria-label="近邻互助组应用图谱">
          <svg class="connections connections-desktop" viewBox="0 0 1000 920" preserveAspectRatio="none" aria-hidden="true">
            <ellipse class="orbit faint" cx="470" cy="480" rx="390" ry="330" />
            <ellipse class="orbit dashed" cx="505" cy="484" rx="420" ry="365" />
            <circle class="anchor red" cx="340" cy="282" r="9" />
            <circle class="anchor green" cx="682" cy="316" r="9" />
            <circle class="anchor green" cx="326" cy="678" r="9" />
            <circle class="anchor orange" cx="607" cy="718" r="9" />
          </svg>
          <svg class="connections connections-mobile" viewBox="0 0 1000 780" preserveAspectRatio="none" aria-hidden="true">
            <ellipse class="orbit faint" cx="500" cy="350" rx="385" ry="310" />
            <ellipse class="orbit dashed" cx="515" cy="360" rx="425" ry="335" />
            <circle class="anchor red" cx="315" cy="205" r="10" />
            <circle class="anchor green" cx="690" cy="235" r="10" />
            <circle class="anchor green" cx="315" cy="585" r="10" />
            <circle class="anchor orange" cx="680" cy="560" r="10" />
          </svg>

          <a class="node hub" href="./牛马互助平台/" aria-label="打开近邻互助组原型入口">
            <h2>近邻互助组</h2>
            <p>真实亲历，<br />帮助邻里找到彼此</p>
          </a>

          <a class="node kith" href="./街坊味/" aria-label="打开街坊味原型入口">
            <h3>街坊味</h3>
            <p>认识附近做饭的人，<br />把一餐稳稳接住</p>
          </a>

          <a class="node paihaocai" href="./排好菜/" aria-label="打开排好菜原型入口">
            <h3>排好菜</h3>
            <p>五天十餐，<br />生成一周菜单</p>
          </a>

          <a class="node recycle" href="./楼道回收提醒/" aria-label="打开楼道收一收原型入口">
            <h3>楼道收一收</h3>
            <p>扫码上报回收或打扫，<br />师傅按楼层处理</p>
          </a>

          <div class="node future future-two">
            <h3>待探索</h3>
            <p>更多邻里协作</p>
          </div>
          <div class="node future future-three">
            <h3>待探索</h3>
            <p>更多邻里协作</p>
          </div>
        </section>
      </main>

      <footer>
        <div><strong>码成工</strong> · 一个为工友敲键盘的组织</div>
        <div>全部页面均为交互原型，不接入真实业务数据。</div>
      </footer>
    </div>
  </body>
</html>
