<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>菜品库视觉验收对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #241f1b; background: #e7e1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header { margin: 0 auto 18px; max-width: 900px; }
      h1 { margin: 0; font-size: 24px; }
      p { margin: 6px 0 0; color: #6f675e; }
      main { max-width: 900px; margin: auto; display: grid; gap: 18px; }
      figure { margin: 0; padding: 12px; border-radius: 16px; background: #fffaf4; box-shadow: 0 12px 30px rgba(38, 31, 26, .12); }
      figcaption { margin-bottom: 10px; font-weight: 800; }
      img { width: 100%; display: block; border-radius: 10px; }
    </style>
  </head>
  <body>
    <header><h1>菜品库：基础状态与新增菜状态</h1><p>同一视口下核对层级、颜色、间距、表单与已有组件的一致性。</p></header>
    <main>
      <figure><figcaption>基础样式目标：用户确认的 10 道菜</figcaption><img src="./library-final.png" alt="菜品库基础状态" /></figure>
      <figure><figcaption>实现状态：添加一道菜</figcaption><img src="./library-add-sheet.png" alt="添加菜表单状态" /></figure>
    </main>
  </body>
</html>
