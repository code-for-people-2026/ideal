<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史页表格改版对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #29241f; background: #eee9e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1 { margin: 0 0 18px; font-size: 24px; }
      main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #d6cec2; border-radius: 16px; background: white; box-shadow: 0 12px 28px rgba(52, 41, 31, .08); }
      figcaption { padding: 12px 14px; border-bottom: 1px solid #e8e1d8; font-size: 14px; font-weight: 750; }
      img { width: 100%; display: block; }
    </style>
  </head>
  <body>
    <h1>历史页表格改版 · 同视口对照</h1>
    <main>
      <figure><figcaption>改版前：逐餐卡片＋悬浮按钮</figcaption><img src="./source-history-before.png" alt="改版前历史页" /></figure>
      <figure><figcaption>表格来源：修改菜单页</figcaption><img src="./source-menu-table.png" alt="修改菜单表格" /></figure>
      <figure><figcaption>改版后：只读表格＋贴底操作栏</figcaption><img src="./implementation-history-table.png" alt="改版后历史页" /></figure>
    </main>
  </body>
</html>
