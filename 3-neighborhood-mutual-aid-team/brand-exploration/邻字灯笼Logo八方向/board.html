<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#FFFFFF; font-family:"PingFang SC","Hiragino Sans GB",sans-serif; }
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:32px 24px; padding:40px 32px; width:2048px; }
  .cell { display:flex; flex-direction:column; align-items:center; }
  .cell img { width:440px; height:440px; display:block; }
  .cap { margin-top:14px; font-size:30px; color:#1B2A52; letter-spacing:2px; }
  .cap b { font-weight:600; margin-right:10px; }
</style>
</head>
<body>
<div class="board">
  <div class="cell"><img src="svg/01-汉字融合型.svg"><div class="cap"><b>01</b>汉字融合型</div></div>
  <div class="cell"><img src="svg/02-极简几何型.svg"><div class="cap"><b>02</b>极简几何型</div></div>
  <div class="cell"><img src="svg/03-负空间型.svg"><div class="cap"><b>03</b>负空间型</div></div>
  <div class="cell"><img src="svg/04-一笔连线型.svg"><div class="cap"><b>04</b>一笔连线型</div></div>
  <div class="cell"><img src="svg/05-现代印章型.svg"><div class="cap"><b>05</b>现代印章型</div></div>
  <div class="cell"><img src="svg/06-剪纸轮廓型.svg"><div class="cap"><b>06</b>剪纸轮廓型</div></div>
  <div class="cell"><img src="svg/07-精灵人格型.svg"><div class="cap"><b>07</b>精灵人格型</div></div>
  <div class="cell"><img src="svg/08-灯火传播型.svg"><div class="cap"><b>08</b>灯火传播型</div></div>
</div>
</body>
</html>
