    <script>
      const initialTasks = [
        { id: "12-recycle", floor: 12, type: "recycle", latest: "20 分钟前", first: "45 分钟前", count: 2, hasPhoto: false },
        { id: "8-clean", floor: 8, type: "clean", latest: "1 小时前", first: "1 小时前", count: 1, hasPhoto: true },
        { id: "3-recycle", floor: 3, type: "recycle", latest: "2 小时前", first: "今天 7:20", count: 3, hasPhoto: false },
      ];

      const requestTypes = {
        recycle: {
          short: "回收",
          icon: "收",
          choiceTitle: "有垃圾要回收",
          choiceDescription: "纸箱、瓶子等已经放好",
          formTitle: "提醒师傅来收一下",
          successTitle: "已发出回收提醒",
          taskTitle: "有垃圾要回收",
          completion: "收好了",
        },
        clean: {
          short: "打扫",
          icon: "扫",
          choiceTitle: "楼层需要打扫",
          choiceDescription: "地面或公共区域需要清理",
          formTitle: "提醒师傅来打扫",
          successTitle: "已发出打扫提醒",
          taskTitle: "楼层需要打扫",
          completion: "打扫好了",
        },
      };

      const residentRequestLabels = {
        recycle: {
          short: "回收",
          title: "有垃圾要收走",
          description: "纸箱、瓶子等已经放好",
        },
        clean: {
          short: "打扫",
          title: "楼道需要打扫",
          description: "地面或公共区域需要清理",
        },
      };

      const residentVariants = {
        A: { label: "A — 成功页轻补充" },
        B: { label: "B — 极简上报回执" },
        C: { label: "C — 进度回执页" },
      };

      const state = {
        tasks: structuredClone(initialTasks),
        view: getViewFromUrl(),
        variant: getVariantFromUrl(),
        scanPhase: getViewFromUrl() === "resident" ? "choice" : "idle",
        residentStatus: "waiting",
        residentEntry: "none",
        residentRequestType: null,
        completedRoundCount: 0,
        residentPhoto: false,
        residentMessage: "",
        residentDraft: "",
        residentEditor: null,
        residentSheetOpen: false,
        selectedFloor: null,
        collectorDrawerOpen: false,
        collectorScrollTop: 0,
        lastCleared: null,
        beforeScan: null,
        scanTimer: null,
      };

      const phoneScreen = document.querySelector("#phone-screen");
      const prototypeSwitcher = document.querySelector("#prototype-switcher");
      const switcherLabel = document.querySelector("#switcher-label");

      function getVariantFromUrl() {
        const value = new URLSearchParams(location.search).get("variant");
        return ["A", "B", "C"].includes(value) ? value : "A";
      }

      function getViewFromUrl() {
        return new URLSearchParams(location.search).get("view") === "resident" ? "resident" : "collector";
      }

      function syncViewToUrl() {
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        if (state.view === "resident") url.searchParams.set("view", "resident");
        else url.searchParams.delete("view");
        history.replaceState({}, "", url);
      }

      function residentTask(type = state.residentRequestType) {
        if (!type) return null;
        return state.tasks.find(item => item.id === `6-${type}`);
      }

      function ensureResidentTask(increment = false, type = state.residentRequestType) {
        if (!requestTypes[type]) return null;
        const existing = residentTask(type);
        if (existing) {
          if (increment) existing.count += 1;
          existing.latest = "刚刚";
          existing.hasPhoto = existing.hasPhoto || state.residentPhoto;
          existing.message = state.residentMessage;
          return existing;
        }

        const task = {
          id: `6-${type}`,
          floor: 6,
          type,
          latest: "刚刚",
          first: "刚刚",
          count: 1,
          hasPhoto: state.residentPhoto,
          message: state.residentMessage,
        };
        state.tasks.push(task);
        return task;
      }

      function syncResidentSupplement() {
        const task = residentTask();
        if (!task) return;
        task.hasPhoto = state.residentPhoto;
        task.message = state.residentMessage;
      }

      if (state.view === "resident") {
        state.beforeScan = structuredClone(state.tasks);
      }

      function sortedTasks() {
        return [...state.tasks].sort((a, b) => b.floor - a.floor || a.type.localeCompare(b.type));
      }

      function requestFor(taskOrType) {
        const type = typeof taskOrType === "string" ? taskOrType : taskOrType.type;
        return requestTypes[type];
      }

      function appHeader() {
        return `
          <header class="app-header">
            <div class="app-brand">
              <span class="app-logo" aria-hidden="true">
                <svg class="recycle-icon" viewBox="0 0 24 24"><use href="#recycle-icon"></use></svg>
              </span>
              <span>楼道收一收</span>
            </div>
            <div class="mini-menu" aria-hidden="true"><i></i>○</div>
          </header>`;
      }

      function emptyState() {
        return `
          <div class="empty-state">
            <div>
              <div class="empty-icon" aria-hidden="true">✓</div>
              <h2>现在没有要处理的</h2>
              <p>有住户发出提醒后，<br />待处理事项会出现在这里。</p>
            </div>
          </div>`;
      }

      function renderCollectorDrawer(selectedTasks) {
        if (!state.collectorDrawerOpen || state.selectedFloor === null) return "";

        const floor = state.selectedFloor;
        const completedTask = state.lastCleared?.floor === floor ? state.lastCleared : null;
        const completedRequest = completedTask ? requestFor(completedTask) : null;
        const countCopy = selectedTasks.length ? `${selectedTasks.length} 项待处理` : "本层已处理";

        return `
          <button class="collector-sheet-backdrop" type="button" data-action="close-collector-sheet" aria-label="关闭 ${floor} 楼操作抽屉"></button>
          <section class="collector-sheet" role="dialog" aria-modal="true" aria-labelledby="collector-sheet-title">
            <div class="collector-sheet-handle" aria-hidden="true"></div>
            <header class="collector-sheet-header">
              <div>
                <span>幸福苑 2 栋 · ${countCopy}</span>
                <h3 id="collector-sheet-title">${floor} 楼</h3>
              </div>
              <button class="collector-sheet-close" type="button" data-action="close-collector-sheet" aria-label="关闭楼层操作">×</button>
            </header>
            <div class="collector-sheet-scroll">
              ${completedTask ? `
                <div class="collector-completion-banner" role="status" aria-live="polite">
                  <span>${completedTask.outcome === "not-found" ? `已记录：${completedRequest.short} · 现场没发现` : `已完成：${completedRequest.short}`}</span>
                  <button type="button" data-action="undo">撤销</button>
                </div>` : ""}
              ${selectedTasks.length ? `
                <div class="collector-task-list">
                  ${selectedTasks.map(task => {
                    const request = requestFor(task);
                    const hasMessage = Boolean(task.message);
                    const supplementClass = task.hasPhoto && hasMessage ? "" : task.hasPhoto ? " photo-only" : " message-only";
                    return `
                      <article class="collector-task-detail ${task.type}">
                        <span class="collector-task-kind">${request.short}需求</span>
                        <h4>${request.taskTitle}</h4>
                        <div class="collector-task-meta">
                          <span>${task.count} 次上报</span>
                          <span>最早 ${task.first}</span>
                          <span>最近 ${task.latest}</span>
                        </div>
                        ${task.hasPhoto || hasMessage ? `
                          <div class="collector-supplements${supplementClass}">
                            ${task.hasPhoto ? `<div class="collector-photo" role="img" aria-label="住户补充的现场照片">现场照片</div>` : ""}
                            ${hasMessage ? `<p class="collector-message">住户留言：${task.message}</p>` : ""}
                          </div>` : ""}
                        <div class="collector-task-actions">
                          <button class="collector-complete-button" type="button" data-clear-task="${task.id}" data-clear-outcome="completed">${request.completion}</button>
                          <button class="collector-no-issue-button" type="button" data-clear-task="${task.id}" data-clear-outcome="not-found">现场没发现</button>
                        </div>
                      </article>`;
                  }).join("")}
                </div>` : `
                <div class="collector-sheet-empty">
                  <strong>本层已处理</strong>
                  <span>楼层按钮已熄灭，有新上报时会再次亮起。</span>
                </div>`}
            </div>
          </section>`;
      }

      function renderCollector() {
        const tasks = sortedTasks();
        const tasksByFloor = new Map();
        tasks.forEach(task => {
          const floorTasks = tasksByFloor.get(task.floor) || [];
          floorTasks.push(task);
          tasksByFloor.set(task.floor, floorTasks);
        });
        const selectedTasks = tasksByFloor.get(state.selectedFloor) || [];
        const floors = Array.from({ length: 18 }, (_, index) => 18 - index);
        const drawer = renderCollectorDrawer(selectedTasks);

        return `
          ${appHeader()}
          <div class="collector-scroll${state.collectorDrawerOpen ? " sheet-open" : ""}">
            <div class="building-home">
              <div class="building-title">
                <div><h2>楼层面板</h2><p>幸福苑 2 栋 · 亮起的楼层需要处理</p></div>
                <div class="building-count">${tasks.length} 项待处理</div>
              </div>
              <div class="legend"><span><i></i>亮起 · 待处理</span><span><i></i>熄灭 · 暂无事项</span></div>
              <div class="floor-grid">
                ${floors.map(floor => {
                  const floorTasks = tasksByFloor.get(floor) || [];
                  if (!floorTasks.length) return `<button class="floor-cell" type="button" disabled aria-label="${floor} 楼，暂无事项"><strong>${floor}</strong><span>无事</span></button>`;
                  const selectedClass = state.collectorDrawerOpen && state.selectedFloor === floor ? " selected" : "";
                  const summary = floorTasks.length === 1
                    ? `${requestFor(floorTasks[0]).short}${floorTasks[0].count > 1 ? ` · ${floorTasks[0].count} 次` : ""}`
                    : `${floorTasks.length} 项`;
                  const accessibleSummary = floorTasks.map(task => `${requestFor(task).short}需求 ${task.count} 次上报`).join("，");
                  return `<button class="floor-cell pending${selectedClass}" type="button" data-select-floor="${floor}" aria-haspopup="dialog" aria-expanded="${selectedClass ? "true" : "false"}" aria-label="${floor} 楼，${accessibleSummary}"><strong>${floor}</strong><span>${summary}</span></button>`;
                }).join("")}
              </div>
            </div>
          </div>
          ${drawer}`;
      }

      function residentHeader() {
        const titles = {
          choice: "楼道收一收",
          form: "确认提醒",
          sending: "正在发出提醒",
          success: "提醒已发出",
          withdrawn: "提醒已撤回",
        };
        const backAction = state.residentStep === "form" ? "resident-back" : state.residentStep === "sending" ? null : state.residentStep === "choice" ? "collector" : "resident-again";
        return `
          <header class="resident-header">
            ${backAction ? `<button class="back-button" type="button" data-action="${backAction}" aria-label="返回">‹</button>` : "<span></span>"}
            <strong>${titles[state.residentStep]}</strong>
            <span></span>
          </header>`;
      }

      function renderResidentChoice() {
        return `
          <div class="resident-scroll">
            <div class="resident-panel">
              <div class="resident-location">已识别：幸福苑 2 栋 · 6 楼</div>
              <h2>这层现在需要什么？</h2>
              <p class="resident-intro">请选择一件需要师傅处理的事情。</p>
              <div class="request-choice-list">
                ${Object.entries(requestTypes).map(([type, request]) => `
                  <button class="request-choice ${type}" type="button" data-request-type="${type}">
                    <span class="choice-icon" aria-hidden="true">${request.icon}</span>
                    <span class="choice-copy"><strong>${request.choiceTitle}</strong><span>${request.choiceDescription}</span></span>
                    <span class="choice-arrow" aria-hidden="true">›</span>
                  </button>`).join("")}
              </div>
            </div>
          </div>`;
      }

      function renderResidentForm() {
        const request = requestFor(state.requestType);
        return `
          <div class="resident-scroll">
            <div class="resident-panel">
              <div class="resident-location">幸福苑 2 栋 · 6 楼</div>
              <h2>${request.formTitle}</h2>
              <p class="resident-intro">确认事项后即可发出提醒，照片只用于补充现场情况。</p>
              <div class="request-summary ${state.requestType}">
                <span class="choice-icon" aria-hidden="true">${request.icon}</span>
                <div><strong>${request.choiceTitle}</strong><span>${request.choiceDescription}</span></div>
              </div>
              <div class="photo-field">
                <div class="field-heading"><strong>现场照片</strong><span class="optional-tag">可选</span></div>
                ${state.photoAttached ? `
                  <div class="photo-preview-card">
                    <div class="mock-photo" role="img" aria-label="现场照片示意"></div>
                    <div class="photo-preview-copy">
                      <strong>已添加 1 张照片</strong>
                      <span>原型中的示例现场照片</span>
                      <button class="remove-photo-button" type="button" data-action="remove-photo">删除照片</button>
                    </div>
                  </div>` : `
                  <button class="photo-add-button" type="button" data-action="add-photo">
                    <span class="photo-add-content">
                      <span class="photo-add-icon" aria-hidden="true">＋</span>
                      <span class="photo-add-title">添加现场照片</span>
                      <span class="photo-add-note">不添加也可以直接提交</span>
                    </span>
                  </button>`}
              </div>
              <button class="resident-submit" type="button" data-action="submit-request">${state.photoAttached ? "带上照片，发出提醒" : "不添加照片，直接发出提醒"}</button>
              <p class="resident-submit-note">照片不是必填项；此处不上传真实文件。</p>
            </div>
          </div>`;
      }

      function renderResidentResult() {
        const isSending = state.residentStep === "sending";
        const isWithdrawn = state.residentStep === "withdrawn";
        const submitted = state.submittedRequest;
        const request = submitted ? requestFor(submitted.type) : requestFor(state.requestType);
        const title = isSending ? "正在告诉师傅…" : isWithdrawn ? "已撤回这次提醒" : request.successTitle;
        const icon = isSending ? "↑" : isWithdrawn ? "↩" : "✓";
        const body = isSending ? "正在把楼层、事项和照片状态放进待处理列表。" : isWithdrawn ? "6 楼不会因为这次操作新增待处理事项。" : "师傅会在待处理列表中看到 6 楼。";

        return `
          <div class="resident-scroll">
            <div class="resident-result">
              <div>
                <div class="scan-visual${isSending ? " sending" : ""}" aria-hidden="true">${icon}</div>
                <h2>${title}</h2>
                <p>${body}</p>
                ${!isSending && !isWithdrawn ? `
                  <div class="result-summary">
                    <div class="result-row"><span>位置</span><strong>幸福苑 2 栋 · 6 楼</strong></div>
                    <div class="result-row"><span>事项</span><strong>${request.choiceTitle}</strong></div>
                    <div class="result-row"><span>现场照片</span><strong>${submitted.hasPhoto ? "已附 1 张" : "未添加"}</strong></div>
                  </div>
                  <div class="result-actions">
                    <button class="resident-submit" type="button" data-action="collector">去师傅端看看</button>
                    <button class="resident-again-button" type="button" data-action="resident-again">再发一条提醒</button>
                    <button class="withdraw-button" type="button" data-action="withdraw">撤回这次提醒</button>
                  </div>` : isWithdrawn ? `
                  <div class="result-actions">
                    <button class="resident-submit" type="button" data-action="resident-again">重新发一条提醒</button>
                    <button class="resident-again-button" type="button" data-action="collector">返回师傅端</button>
                  </div>` : ""}
              </div>
            </div>
          </div>`;
      }

      function renderResident() {
        const content = state.residentStep === "choice"
          ? renderResidentChoice()
          : state.residentStep === "form"
            ? renderResidentForm()
            : renderResidentResult();
        return `<div class="resident-screen">${residentHeader()}${content}</div>`;
      }

      /* #39 住户端变体：后声明的 renderResident 覆盖上方 main 版表单流程。 */
      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderPhotoPreview() {
        if (!state.residentPhoto) return "";
        return `
          <div class="photo-preview">
            <img src="assets/stairwell-recyclables.png" alt="楼道约定位置摆放整齐的纸箱和塑料瓶" />
            <div><strong>现场照片已补充</strong><span>师傅可以据此确认放置位置。</span></div>
          </div>`;
      }

      function renderMessagePreview() {
        if (!state.residentMessage) return "";
        return `<div class="message-preview"><strong>给师傅的话</strong><span>${escapeHtml(state.residentMessage)}</span></div>`;
      }

      function renderSupplementPreview() {
        if (!state.residentPhoto && !state.residentMessage) return "";
        return `<div class="supplement-preview" aria-label="本次上报的补充信息">${renderPhotoPreview()}${renderMessagePreview()}</div>`;
      }

      function renderMessageEditor() {
        return `
          <div class="resident-editor">
            <textarea class="resident-textarea" data-resident-message maxlength="80" placeholder="例如：纸箱放在消防门旁边，没有挡路。">${escapeHtml(state.residentDraft)}</textarea>
            <div class="editor-actions">
              <button class="text-button" type="button" data-action="cancel-message">先不写</button>
              <button class="save-button" type="button" data-action="save-message">保存留言</button>
            </div>
          </div>`;
      }

      function renderResidentProgress(includeSupplement = true) {
        const task = residentTask();
        const roundCount = task?.count || state.completedRoundCount || 1;
        return `
          <div class="progress-card">
            <strong>这轮回收进展</strong>
            <div class="progress-step"><time>本轮</time><span><strong>已登记待收</strong><br />幸福苑 2 栋 · 6 楼 · 已有 ${roundCount} 次待收确认</span></div>
            ${includeSupplement && (state.residentPhoto || state.residentMessage) ? `
              <div class="progress-step"><time>刚刚</time><span><strong>已补充现场信息</strong><br />${state.residentPhoto && state.residentMessage ? "照片和留言" : state.residentPhoto ? "现场照片" : "一句留言"}</span></div>` : ""}
            <div class="progress-step"><time>接下来</time><span><strong>等师傅来收</strong><br />收好后这里会更新</span></div>
          </div>`;
      }

      function renderResidentVariantA() {
        const report = residentRequestLabels[state.residentRequestType] || residentRequestLabels.recycle;
        return `
          <div class="resident-hero">
            <span class="success-check" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m6.5 12.5 3.4 3.4 7.6-8" /></svg>
            </span>
            <h2>上报成功</h2>
            <p>师傅会收到 6 楼的${report.short}提醒。</p>
            <div class="identified-floor">幸福苑 2 栋 · 6 楼</div>
          </div>
          <section class="resident-section" aria-labelledby="optional-heading-a">
            <div class="section-heading"><strong id="optional-heading-a">现场不好找？</strong><span class="optional-tag">可选</span></div>
            <p class="section-copy">需要时再补一张照片或一句话，师傅会和这轮 6 楼提醒一起看到。</p>
            <div class="supplement-actions">
              <button class="supplement-button${state.residentPhoto ? " active" : ""}" type="button" data-action="toggle-photo">${state.residentPhoto ? "照片已添加" : "补充现场照片"}</button>
              <button class="supplement-button${state.residentMessage ? " active" : ""}" type="button" data-action="open-message">${state.residentMessage ? "修改留言" : "给师傅留句话"}</button>
            </div>
            ${state.residentEditor === "message" ? renderMessageEditor() : ""}
            ${renderSupplementPreview()}
          </section>
          <div class="withdraw-wrap"><button class="withdraw-button" type="button" data-action="withdraw">扫错了，撤回这次提醒</button></div>`;
      }

      function renderResidentReportChoice() {
        return `
          <div class="report-choice-heading">
            <div class="resident-location">已识别：幸福苑 2 栋 · 6 楼</div>
            <h2>现在需要什么？</h2>
            <p>选一项，就会直接上报给师傅。</p>
          </div>
          <div class="request-choice-list" aria-label="选择上报类型">
            ${Object.entries(residentRequestLabels).map(([type, report]) => `
              <button class="request-choice resident-report-choice ${type}" type="button" data-report-type="${type}">
                <span class="choice-copy"><strong>${report.title}</strong><span>${report.description}</span></span>
                <span class="choice-arrow" aria-hidden="true">›</span>
              </button>`).join("")}
          </div>`;
      }

      function renderResidentVariantB() {
        const report = residentRequestLabels[state.residentRequestType] || residentRequestLabels.recycle;
        return `
          <div class="resident-hero">
            <h2>上报成功</h2>
            <p>师傅会收到 6 楼的${report.short}提醒。</p>
            <div class="report-summary" aria-label="本次上报内容">
              <div class="report-row"><span>位置</span><strong>幸福苑 2 栋 · 6 楼</strong></div>
              <div class="report-row"><span>事项</span><strong>${report.title}</strong></div>
            </div>
          </div>
          ${renderSupplementPreview()}
          <button class="open-sheet-button" type="button" data-action="open-sheet">${state.residentPhoto || state.residentMessage ? "查看或修改补充" : "补充照片或留言（可选）"}</button>
          <div class="withdraw-wrap"><button class="withdraw-button" type="button" data-action="withdraw">上报错了，撤回</button></div>`;
      }

      function renderResidentVariantC() {
        return `
          <div class="receipt-heading">
            <div><span>本轮回收提醒</span><strong>已提醒，等师傅来收</strong></div>
            <div class="receipt-location">6 楼</div>
          </div>
          ${renderResidentProgress()}
          <section class="resident-section" aria-labelledby="optional-heading-c">
            <div class="section-heading"><strong id="optional-heading-c">补充现场信息</strong><span class="optional-tag">可选</span></div>
            <p class="section-copy">提醒已经成功。只有放置点难找时，才需要补充。</p>
            <div class="supplement-actions">
              <button class="supplement-button${state.residentPhoto ? " active" : ""}" type="button" data-action="toggle-photo">${state.residentPhoto ? "移除照片" : "添加现场照片"}</button>
              <button class="supplement-button${state.residentMessage ? " active" : ""}" type="button" data-action="open-message">${state.residentMessage ? "修改留言" : "添加一句留言"}</button>
            </div>
            ${state.residentEditor === "message" ? renderMessageEditor() : ""}
            ${renderSupplementPreview()}
          </section>
          <div class="withdraw-wrap"><button class="withdraw-button" type="button" data-action="withdraw">扫错了，撤回这次提醒</button></div>`;
      }

      function renderResidentSheet() {
        if (!state.residentSheetOpen) return "";
        return `
          <div class="resident-sheet-backdrop">
            <section class="resident-sheet" aria-labelledby="sheet-title">
              <div class="sheet-heading">
                <div><h3 id="sheet-title">补充现场信息</h3><p>上报已经成功，补充完全可选。</p></div>
                <button class="sheet-close" type="button" data-action="close-sheet">关闭</button>
              </div>
              <div class="sheet-field">
                <strong>现场照片</strong>
                <button class="supplement-button${state.residentPhoto ? " active" : ""}" type="button" data-action="toggle-photo">${state.residentPhoto ? "照片已添加，点此移除" : "添加一张示例照片"}</button>
                ${state.residentPhoto ? `<div class="supplement-preview">${renderPhotoPreview()}</div>` : ""}
              </div>
              <div class="sheet-field">
                <strong>给师傅的话</strong>
                <textarea class="resident-textarea" data-resident-message maxlength="80" placeholder="例如：纸箱放在消防门旁边，没有挡路。">${escapeHtml(state.residentDraft)}</textarea>
              </div>
              <button class="open-sheet-button" type="button" data-action="save-sheet">保存补充</button>
            </section>
          </div>`;
      }

      function renderResidentCollected() {
        const roundCount = state.completedRoundCount || 1;
        return `
          <div class="completion-card">
            <div class="scan-visual" aria-hidden="true">好</div>
            <h2>6 楼这轮已经收好</h2>
            <p>师傅刚刚完成了这层的回收。</p>
            <span class="completion-time">今天 10:18 收好</span>
          </div>
          <div class="progress-card">
            <strong>这轮回收记录</strong>
            <div class="progress-step"><time>9:41</time><span><strong>本轮登记待收</strong><br />幸福苑 2 栋 · 6 楼 · 共 ${roundCount} 次待收确认</span></div>
            ${state.residentPhoto || state.residentMessage ? `<div class="progress-step"><time>9:42</time><span><strong>住户补充了现场信息</strong></span></div>` : ""}
            <div class="progress-step"><time>10:18</time><span><strong>师傅标记为已收好</strong></span></div>
          </div>
          <button class="new-round-button" type="button" data-action="new-round">这里又有新的可回收物</button>`;
      }

      function renderResident() {
        const isChoosing = state.scanPhase === "choice";
        const isSending = state.scanPhase === "sending";
        const isWithdrawn = state.scanPhase === "withdrawn";
        const report = residentRequestLabels[state.residentRequestType];
        let content;

        if (isChoosing) {
          content = renderResidentReportChoice();
        } else if (isSending || isWithdrawn) {
          content = `
            <div class="resident-hero">
              ${isSending ? `<div class="report-loader" aria-hidden="true"></div>` : ""}
              <h2>${isSending ? "正在上报…" : "已撤回"}</h2>
              <p>${isSending ? `${report?.title || "楼道事项"} · 幸福苑 2 栋 · 6 楼` : "这次上报不会出现在师傅的待办里。"}</p>
            </div>`;
        } else if (state.variant === "B") {
          content = renderResidentVariantB();
        } else if (state.residentStatus === "collected") {
          content = renderResidentCollected();
        } else if (state.variant === "C") {
          content = renderResidentVariantC();
        } else {
          content = renderResidentVariantA();
        }

        return `
          <div class="resident-screen variant-${state.variant.toLowerCase()}">
            <header class="resident-header">
              <button class="back-button" type="button" data-action="collector" aria-label="返回">‹</button>
              <strong>楼道收一收</strong>
              <span></span>
            </header>
            <div class="resident-scroll"><div class="resident-content">${content}</div></div>
            ${state.variant === "B" && state.scanPhase === "success" && state.residentStatus !== "collected" ? renderResidentSheet() : ""}
          </div>`;
      }

      function render() {
        const currentCollectorScroll = phoneScreen.querySelector(".collector-scroll");
        if (state.view === "collector" && currentCollectorScroll) {
          state.collectorScrollTop = currentCollectorScroll.scrollTop;
        }
        prototypeSwitcher.hidden = state.view !== "resident";
        switcherLabel.textContent = residentVariants[state.variant].label;
        if (state.view === "resident") {
          phoneScreen.innerHTML = renderResident();
        } else {
          phoneScreen.innerHTML = renderCollector();
          const nextCollectorScroll = phoneScreen.querySelector(".collector-scroll");
          if (nextCollectorScroll) nextCollectorScroll.scrollTop = state.collectorScrollTop;
        }
      }

      function clearTask(taskId, outcome = "completed") {
        const task = state.tasks.find(item => item.id === taskId);
        if (!task) return;
        if (outcome === "completed" && task.floor === 6) {
          state.completedRoundCount = task.count;
          state.residentStatus = "collected";
          state.residentEntry = "reopened";
        }
        state.tasks = state.tasks.filter(item => item.id !== taskId);
        state.lastCleared = { ...task, outcome };
        state.selectedFloor = task.floor;
        state.collectorDrawerOpen = true;
        render();
      }

      function undoClear() {
        if (!state.lastCleared) return;
        const restoredFloor = state.lastCleared.floor;
        if (!state.tasks.some(item => item.id === state.lastCleared.id)) {
          const { outcome, ...restoredTask } = state.lastCleared;
          state.tasks.push(restoredTask);
        }
        if (state.lastCleared.outcome === "completed" && state.lastCleared.floor === 6) {
          state.residentStatus = "waiting";
          state.completedRoundCount = 0;
          state.residentEntry = "reopened";
        }
        state.lastCleared = null;
        state.selectedFloor = restoredFloor;
        state.collectorDrawerOpen = true;
        render();
      }

      function startScan() {
        clearTimeout(state.submitTimer);
        state.view = "resident";
        state.residentStep = "choice";
        state.requestType = null;
        state.photoAttached = false;
        state.submittedRequest = null;
        state.beforeSubmit = null;
        state.lastCleared = null;
        render();
      }

      function selectRequest(type) {
        if (!requestTypes[type]) return;
        state.requestType = type;
        state.photoAttached = false;
        state.residentStep = "form";
        render();
      }

      function submitRequest() {
        if (!state.requestType) return;
        clearTimeout(state.submitTimer);
        state.beforeSubmit = structuredClone(state.tasks);
        state.submittedRequest = {
          floor: 6,
          type: state.requestType,
          hasPhoto: state.photoAttached,
        };
        state.residentStep = "sending";
        render();

        state.submitTimer = setTimeout(() => {
          const submitted = state.submittedRequest;
          const taskId = `${submitted.floor}-${submitted.type}`;
          const existing = state.tasks.find(item => item.id === taskId);
          if (existing) {
            existing.count += 1;
            existing.latest = "刚刚";
            existing.hasPhoto = existing.hasPhoto || submitted.hasPhoto;
          } else {
            state.tasks.push({
              id: taskId,
              floor: submitted.floor,
              type: submitted.type,
              latest: "刚刚",
              first: "刚刚",
              count: 1,
              hasPhoto: submitted.hasPhoto,
            });
          }
          state.residentStep = "success";
          render();
        }, 720);
      }

      function withdrawRequest() {
        if (state.beforeSubmit) state.tasks = structuredClone(state.beforeSubmit);
        state.residentStep = "withdrawn";
        render();
      }

      function restartResident() {
        clearTimeout(state.submitTimer);
        state.view = "resident";
        state.collectorDrawerOpen = false;
        state.selectedFloor = null;
        state.residentStep = "choice";
        state.requestType = null;
        state.photoAttached = false;
        state.submittedRequest = null;
        state.beforeSubmit = null;
        state.lastCleared = null;
        render();
      }

      function resetDemo() {
        clearTimeout(state.submitTimer);
        state.tasks = structuredClone(initialTasks);
        state.view = "collector";
        state.residentStep = "choice";
        state.requestType = null;
        state.photoAttached = false;
        state.submittedRequest = null;
        state.lastCleared = null;
        state.beforeSubmit = null;
        state.selectedFloor = null;
        state.collectorDrawerOpen = false;
        state.collectorScrollTop = 0;
        render();
      }

      /* #39 住户端状态操作：覆盖 main 版的选事项表单流程。 */
      function startResidentChoice() {
        clearTimeout(state.scanTimer);
        state.beforeScan = structuredClone(state.tasks);
        state.view = "resident";
        state.collectorDrawerOpen = false;
        state.selectedFloor = null;
        state.scanPhase = "choice";
        state.residentStatus = "waiting";
        state.residentEntry = "none";
        state.residentRequestType = null;
        state.completedRoundCount = 0;
        state.residentPhoto = false;
        state.residentMessage = "";
        state.residentDraft = "";
        state.residentEditor = null;
        state.residentSheetOpen = false;
        state.lastCleared = null;
        syncViewToUrl();
        render();
      }

      function submitResidentReport(type) {
        if (!residentRequestLabels[type]) return;
        clearTimeout(state.scanTimer);
        state.residentRequestType = type;
        state.scanPhase = "sending";
        state.residentStatus = "waiting";
        state.residentEntry = "reported";
        render();
        state.scanTimer = setTimeout(() => {
          ensureResidentTask(true, type);
          state.scanPhase = "success";
          render();
        }, 850);
      }

      function withdrawScan() {
        if (state.beforeScan) state.tasks = structuredClone(state.beforeScan);
        state.scanPhase = "withdrawn";
        state.residentSheetOpen = false;
        state.residentEditor = null;
        render();
      }

      function changeVariant(direction) {
        const keys = Object.keys(residentVariants);
        const current = keys.indexOf(state.variant);
        state.variant = keys[(current + direction + keys.length) % keys.length];
        state.residentEditor = null;
        state.residentSheetOpen = false;
        syncViewToUrl();
        render();
      }

      function showCollectedFeedback() {
        clearTimeout(state.scanTimer);
        const completedTask = residentTask();
        state.completedRoundCount = completedTask?.count || state.completedRoundCount || 1;
        state.tasks = state.tasks.filter(item => item.id !== "6-recycle");
        state.view = "resident";
        state.scanPhase = "success";
        state.residentStatus = "collected";
        state.residentEntry = "reopened";
        state.residentEditor = null;
        state.residentSheetOpen = false;
        syncViewToUrl();
        render();
      }

      function resetDemo() {
        clearTimeout(state.scanTimer);
        clearTimeout(state.submitTimer);
        state.tasks = structuredClone(initialTasks);
        state.view = "collector";
        state.scanPhase = "idle";
        state.residentStatus = "waiting";
        state.residentEntry = "none";
        state.residentRequestType = null;
        state.completedRoundCount = 0;
        state.residentPhoto = false;
        state.residentMessage = "";
        state.residentDraft = "";
        state.residentEditor = null;
        state.residentSheetOpen = false;
        state.lastCleared = null;
        state.beforeScan = null;
        state.selectedFloor = null;
        state.collectorDrawerOpen = false;
        state.collectorScrollTop = 0;
        syncViewToUrl();
        render();
      }

      document.addEventListener("click", event => {
        const clearButton = event.target.closest("[data-clear-task]");
        if (clearButton) {
          clearTask(clearButton.dataset.clearTask, clearButton.dataset.clearOutcome);
          return;
        }

        const selectButton = event.target.closest("[data-select-floor]");
        if (selectButton) {
          state.selectedFloor = Number(selectButton.dataset.selectFloor);
          state.collectorDrawerOpen = true;
          state.lastCleared = null;
          render();
          return;
        }

        const reportTypeButton = event.target.closest("[data-report-type]");
        if (reportTypeButton) {
          submitResidentReport(reportTypeButton.dataset.reportType);
          return;
        }

        const actionButton = event.target.closest("[data-action]");
        if (!actionButton) return;
        const action = actionButton.dataset.action;
        if (action === "scan") startResidentChoice();
        if (action === "collector") {
          clearTimeout(state.scanTimer);
          clearTimeout(state.submitTimer);
          state.view = "collector";
          state.collectorDrawerOpen = false;
          state.selectedFloor = null;
          state.lastCleared = null;
          state.residentEditor = null;
          state.residentSheetOpen = false;
          syncViewToUrl();
          render();
        }
        if (action === "close-collector-sheet") {
          state.collectorDrawerOpen = false;
          state.selectedFloor = null;
          state.lastCleared = null;
          render();
        }
        if (action === "withdraw") withdrawScan();
        if (action === "undo") undoClear();
        if (action === "reset") resetDemo();
        if (action === "new-round") startResidentChoice();
        if (action === "toggle-photo") {
          state.residentPhoto = !state.residentPhoto;
          syncResidentSupplement();
          render();
        }
        if (action === "open-message") {
          state.residentDraft = state.residentMessage;
          state.residentEditor = "message";
          render();
        }
        if (action === "cancel-message") {
          state.residentDraft = state.residentMessage;
          state.residentEditor = null;
          render();
        }
        if (action === "save-message") {
          state.residentMessage = state.residentDraft.trim();
          state.residentEditor = null;
          syncResidentSupplement();
          render();
        }
        if (action === "open-sheet") {
          state.residentDraft = state.residentMessage;
          state.residentSheetOpen = true;
          render();
        }
        if (action === "close-sheet") {
          state.residentDraft = state.residentMessage;
          state.residentSheetOpen = false;
          render();
        }
        if (action === "save-sheet") {
          state.residentMessage = state.residentDraft.trim();
          state.residentSheetOpen = false;
          syncResidentSupplement();
          render();
        }
        if (action === "previous-variant") changeVariant(-1);
        if (action === "next-variant") changeVariant(1);
      });

      document.addEventListener("click", event => {
        if (event.target.matches(".resident-sheet-backdrop")) {
          state.residentDraft = state.residentMessage;
          state.residentSheetOpen = false;
          render();
        }
      });

      document.addEventListener("input", event => {
        if (event.target.matches("[data-resident-message]")) {
          state.residentDraft = event.target.value;
        }
      });

      let collectorSheetTouchStart = null;
      document.addEventListener("touchstart", event => {
        if (event.target.closest(".collector-sheet-handle, .collector-sheet-header")) {
          collectorSheetTouchStart = event.touches[0]?.clientY ?? null;
        }
      }, { passive: true });

      document.addEventListener("touchend", event => {
        if (collectorSheetTouchStart === null) return;
        const endY = event.changedTouches[0]?.clientY ?? collectorSheetTouchStart;
        const distance = endY - collectorSheetTouchStart;
        collectorSheetTouchStart = null;
        if (distance > 64 && state.collectorDrawerOpen) {
          state.collectorDrawerOpen = false;
          state.selectedFloor = null;
          state.lastCleared = null;
          render();
        }
      }, { passive: true });

      window.addEventListener("keydown", event => {
        const active = document.activeElement;
        if (["INPUT", "TEXTAREA"].includes(active?.tagName) || active?.isContentEditable) return;
        if (state.view === "collector" && event.key === "Escape" && state.collectorDrawerOpen) {
          state.collectorDrawerOpen = false;
          state.selectedFloor = null;
          state.lastCleared = null;
          render();
          return;
        }
        if (state.view !== "resident") return;
        if (event.key === "ArrowLeft") changeVariant(-1);
        if (event.key === "ArrowRight") changeVariant(1);
      });

      window.addEventListener("popstate", () => {
        state.variant = getVariantFromUrl();
        state.view = getViewFromUrl();
        state.residentEditor = null;
        state.residentSheetOpen = false;
        state.collectorDrawerOpen = false;
        state.selectedFloor = null;
        if (state.view === "resident") {
          state.scanPhase = "choice";
          state.residentStatus = "waiting";
          state.residentEntry = "none";
          state.residentRequestType = null;
          state.beforeScan = structuredClone(state.tasks);
        }
        render();
      });

      render();
    </script>
  </body>
</html>
