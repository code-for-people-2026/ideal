<svg xmlns="http://www.w3.org/2000/svg" width="216mm" height="303mm" viewBox="-9.71 -9.71 699.43 981.71" role="img">
<title>传单3 · 生产 vs 消费：生产力发展，让"集结消费者"成为可能</title>
<desc>历史唯物主义视角：力量来自集结的人数；能集结谁由生产力决定。一条横轴表示互联网技术（生产力）发展方向。三层（电商/内容/软件）里，早期技术只够集结生产端（淘宝/公众号/互联网平台），技术成熟后才能集结海量分散的消费端（拼多多/抖音）。最下面的软件·AI 层是上面各层共同的底座，这层第一次白菜化，"替软件用户集结"才成为可能——那一格还空着。</desc>
<defs>
<marker id="hb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
<path d="M1.5 1L8.5 5L1.5 9Z" fill="context-stroke"/>
</marker>
</defs>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, -apple-system, sans-serif">

  <!-- A4 竖版 210×297mm + 3mm 出血：1 单位=0.3088mm；裁切框 0..680 × 0..962；内容分块垂直重排 -->
  <rect x="-12" y="-12" width="704" height="986" fill="#fbfaf6"/>

  <!-- 软件层 = 底座层：整条地层高亮带（置于网状之下，左右贯通到出血边） -->
  <g transform="translate(0,34)">
  <rect x="-12" y="526.9" width="704" height="252.8" fill="#8b1e2d" opacity="0.055"/>
  <line x1="-12" y1="526.9" x2="692" y2="526.9" stroke="#8b1e2d" stroke-width="1.2" opacity="0.4" stroke-dasharray="6 4"/>
  </g>

  <!-- header（顶部，下移 40 留出竖版上边距） -->
  <g transform="translate(0,24)">
  <text x="40" y="24" font-size="12" font-weight="500" letter-spacing="4" fill="#8b1e2d">数据平权 · AI 下乡</text>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#8b1e2d">生产力发展，让"集结消费者"成为可能</text>
  <text x="40" y="68" font-size="11" fill="#5a5a5a">力量来自集结的人数——线多的一端，就是这个平台集结起来的人。</text>
  <line x1="40" y1="76" x2="640" y2="76" stroke="#8b1e2d" stroke-width="2"/>
  </g>

  <!-- 图表主体（下移 150，竖版居中） -->
  <g transform="translate(0,34)">
  <!-- 列头 -->
  <text x="70" y="96" font-size="13" font-weight="700" fill="#2e5f8b" text-anchor="middle">生产者</text>
  <text x="255" y="96" font-size="13" font-weight="700" fill="#2e5f8b" text-anchor="middle">集结生产端</text>
  <text x="445" y="96" font-size="13" font-weight="700" fill="#2d6a3f" text-anchor="middle">集结消费端</text>
  <text x="610" y="96" font-size="13" font-weight="700" fill="#2d6a3f" text-anchor="middle">消费者</text>

  <!-- 生产力横轴 -->
  <text x="350" y="124.4" font-size="11" font-weight="700" fill="#b08d2e" text-anchor="middle">生产力 · 互联网技术发展 →</text>
  <line x1="150" y1="134.7" x2="552" y2="134.7" stroke="#b08d2e" stroke-width="2.5" marker-end="url(#hb)"/>
  <text x="350" y="152.8" font-size="9" fill="#8a6d1c" text-anchor="middle">越往右技术越成熟，越能把分散的多数（消费者）集结起来</text>

  <!-- 细线：平台也连另一端（线少） -->
  <g fill="none" stroke="#2e5f8b" stroke-width="1.2" opacity="0.5">
    <path d="M283 227.6 L604 204.4" marker-end="url(#hb)"/><path d="M283 227.6 L604 249.5" marker-end="url(#hb)"/>
    <path d="M283 421.1 L604 397.9" marker-end="url(#hb)"/><path d="M283 421.1 L604 443" marker-end="url(#hb)"/>
    <path d="M283 645.5 L604 583.6" marker-end="url(#hb)"/><path d="M283 645.5 L604 622.3" marker-end="url(#hb)"/>
  </g>
  <g fill="none" stroke="#2d6a3f" stroke-width="1.2" opacity="0.5">
    <path d="M76 249.5 L417 284.3" marker-end="url(#hb)"/><path d="M76 294.7 L417 286.9" marker-end="url(#hb)"/>
    <path d="M76 443 L417 477.8" marker-end="url(#hb)"/><path d="M76 488.2 L417 480.4" marker-end="url(#hb)"/>
  </g>

  <!-- 粗扇形：集结生产端 ← 生产者 -->
  <g fill="none" stroke="#2e5f8b" stroke-width="2.4">
    <path d="M76 165.7 L228 225" marker-end="url(#hb)"/><path d="M76 204.4 L228 226.3" marker-end="url(#hb)"/><path d="M76 249.5 L228 228.9" marker-end="url(#hb)"/><path d="M76 294.7 L228 230.2" marker-end="url(#hb)"/>
    <path d="M76 359.2 L228 418.5" marker-end="url(#hb)"/><path d="M76 397.9 L228 419.8" marker-end="url(#hb)"/><path d="M76 443 L228 422.4" marker-end="url(#hb)"/><path d="M76 488.2 L228 423.7" marker-end="url(#hb)"/>
    <path d="M76 583.6 L228 643" marker-end="url(#hb)"/><path d="M76 622.3 L228 644.2" marker-end="url(#hb)"/><path d="M76 667.5 L228 646.8" marker-end="url(#hb)"/><path d="M76 710 L228 648.1" marker-end="url(#hb)"/>
  </g>
  <!-- 粗扇形：集结消费端 → 消费者 -->
  <g fill="none" stroke="#2d6a3f" stroke-width="2.4">
    <path d="M473 285.6 L604 165.7" marker-end="url(#hb)"/><path d="M473 285.6 L604 204.4" marker-end="url(#hb)"/><path d="M473 286.9 L604 249.5" marker-end="url(#hb)"/><path d="M473 288.2 L604 294.7" marker-end="url(#hb)"/>
    <path d="M473 479.1 L604 359.2" marker-end="url(#hb)"/><path d="M473 479.1 L604 397.9" marker-end="url(#hb)"/><path d="M473 480.4 L604 443" marker-end="url(#hb)"/><path d="M473 481.7 L604 488.2" marker-end="url(#hb)"/>
  </g>
  <!-- 软件层 ?：两端虚线（潜在） -->
  <g fill="none" stroke="#8b1e2d" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4">
    <path d="M76 667.5 L415 701" marker-end="url(#hb)"/><path d="M76 710 L415 706.2" marker-end="url(#hb)"/>
    <path d="M478 693.3 L604 583.6" marker-end="url(#hb)"/><path d="M478 699.7 L604 622.3" marker-end="url(#hb)"/><path d="M478 706.2 L604 667.5" marker-end="url(#hb)"/><path d="M478 712.6 L604 710" marker-end="url(#hb)"/>
  </g>

  <!-- producer dots -->
  <g fill="#ffffff" stroke="#2e5f8b" stroke-width="1.6" opacity="0.35">
    <circle cx="70" cy="165.7" r="5"/><circle cx="70" cy="294.7" r="5"/><circle cx="70" cy="359.2" r="5"/><circle cx="70" cy="488.2" r="5"/><circle cx="70" cy="583.6" r="5"/><circle cx="70" cy="710" r="5"/>
  </g>
  <g fill="#ffffff" stroke="#2e5f8b" stroke-width="2">
    <circle cx="70" cy="204.4" r="6"/><circle cx="70" cy="249.5" r="6"/><circle cx="70" cy="397.9" r="6"/><circle cx="70" cy="443" r="6"/><circle cx="70" cy="622.3" r="6"/><circle cx="70" cy="667.5" r="6"/>
  </g>
  <g font-size="11" font-weight="700" fill="#174a85" text-anchor="end">
    <text x="50" y="209.5">商家</text><text x="50" y="254.7">农民</text>
    <text x="50" y="403">创作者</text><text x="50" y="448.2">up主</text>
    <text x="50" y="627.5">程序员</text><text x="50" y="672.6">产品经理</text>
  </g>
  <g font-size="12" font-weight="700" fill="#9bb3cb" text-anchor="end">
    <text x="50" y="289.5">···</text><text x="50" y="483">···</text><text x="50" y="707.5">···</text>
  </g>

  <!-- consumer dots -->
  <g fill="#e5efe4" stroke="#2d6a3f" stroke-width="1.6" opacity="0.35">
    <circle cx="610" cy="165.7" r="5"/><circle cx="610" cy="294.7" r="5"/><circle cx="610" cy="359.2" r="5"/><circle cx="610" cy="488.2" r="5"/><circle cx="610" cy="583.6" r="5"/><circle cx="610" cy="710" r="5"/>
  </g>
  <g fill="#e5efe4" stroke="#2d6a3f" stroke-width="2">
    <circle cx="610" cy="204.4" r="6"/><circle cx="610" cy="249.5" r="6"/><circle cx="610" cy="397.9" r="6"/><circle cx="610" cy="443" r="6"/><circle cx="610" cy="622.3" r="6"/><circle cx="610" cy="667.5" r="6"/>
  </g>
  <g font-size="11" font-weight="700" fill="#2d6a3f" text-anchor="start">
    <text x="630" y="209.5">买家</text><text x="630" y="254.7">消费者</text>
    <text x="630" y="403">读者</text><text x="630" y="448.2">观众</text>
    <text x="630" y="627.5">软件用户</text><text x="630" y="672.6">玩家</text>
  </g>
  <g font-size="12" font-weight="700" fill="#8fae97" text-anchor="start">
    <text x="630" y="289.5">···</text><text x="630" y="483">···</text><text x="630" y="707.5">···</text>
  </g>

  <!-- 集结生产端 (blue) -->
  <circle cx="255" cy="227.6" r="28" fill="#e8f0f7" stroke="#2e5f8b" stroke-width="2"/>
  <text x="255" y="234" font-size="13" font-weight="700" fill="#174a85" text-anchor="middle">淘宝</text>
  <circle cx="255" cy="421.1" r="28" fill="#e8f0f7" stroke="#2e5f8b" stroke-width="2"/>
  <text x="255" y="427.5" font-size="12" font-weight="700" fill="#174a85" text-anchor="middle">公众号</text>
  <circle cx="255" cy="645.5" r="28" fill="#e8f0f7" stroke="#2e5f8b" stroke-width="2"/>
  <text x="255" y="641.7" font-size="11.5" font-weight="700" fill="#174a85" text-anchor="middle">互联网</text>
  <text x="255" y="659.7" font-size="11.5" font-weight="700" fill="#174a85" text-anchor="middle">平台</text>

  <!-- 集结消费端 (green) -->
  <circle cx="445" cy="285.6" r="28" fill="#e5efe4" stroke="#2d6a3f" stroke-width="2"/>
  <text x="445" y="292.1" font-size="12" font-weight="700" fill="#1f5036" text-anchor="middle">拼多多</text>
  <circle cx="445" cy="479.1" r="28" fill="#e5efe4" stroke="#2d6a3f" stroke-width="2"/>
  <text x="445" y="485.6" font-size="13" font-weight="700" fill="#1f5036" text-anchor="middle">抖音</text>

  <circle cx="445" cy="703.6" r="39" fill="none" stroke="#8b1e2d" stroke-width="1.5" opacity="0.3"/>
  <circle cx="445" cy="703.6" r="32" fill="#8b1e2d"/>
  <text x="445" y="725.5" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>

  <!-- 底座层标题（带顶居中，留出 margin） -->
  <text x="340" y="568.1" font-size="10.5" font-weight="700" fill="#8b1e2d" text-anchor="middle">软件·AI 是所有层的底座——它一白菜化，"替软件用户集结"才第一次成为可能，而这一格还空着。</text>
  </g>

  <!-- 底部三栏注释 + 页脚（下移 215，落到竖版底部） -->
  <g transform="translate(0,200)">
  <line x1="40" y1="638" x2="640" y2="638" stroke="#d4d0c8" stroke-width="1"/>

  <text x="40" y="656" font-size="12" font-weight="700" fill="#8b1e2d">电商层</text>
  <text x="40" y="672" font-size="10" fill="#1a1a1a">淘宝先集结卖家。等移动互联</text>
  <text x="40" y="686" font-size="10" fill="#1a1a1a">网、下沉成熟，拼多多才把海</text>
  <text x="40" y="700" font-size="10" fill="#1a1a1a">量散户买家集结——变的是生产力。</text>

  <text x="247" y="656" font-size="12" font-weight="700" fill="#8b1e2d">内容层</text>
  <text x="247" y="672" font-size="10" fill="#1a1a1a">公众号集结创作者。等算法、</text>
  <text x="247" y="686" font-size="10" fill="#1a1a1a">短视频成熟，抖音才把亿万</text>
  <text x="247" y="700" font-size="10" fill="#1a1a1a">"看的人"集结起来。</text>

  <text x="454" y="656" font-size="12" font-weight="700" fill="#8b1e2d">软件层 · 底座 · 我们这层</text>
  <text x="454" y="672" font-size="10" fill="#1a1a1a">互联网平台把程序员当雇员集</text>
  <text x="454" y="686" font-size="10" fill="#1a1a1a">结。如今 AI 让"替软件用户集</text>
  <text x="454" y="700" font-size="10" font-weight="700" fill="#8b1e2d">结"第一次成为可能——那格空着。</text>

  <line x1="40" y1="712" x2="640" y2="712" stroke="#d4d0c8" stroke-width="1"/>
  <text x="40" y="730" font-size="12" font-weight="700" fill="#8b1e2d">码成工<tspan font-weight="400" font-size="10.5" fill="#73706a">　一个为工友敲键盘的组织</tspan></text>
  <text x="640" y="730" font-size="10.5" fill="#73706a" text-anchor="end">软件是一种服务，我们想把它还给人民</text>
  </g>

</g>
</svg>
