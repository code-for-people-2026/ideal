<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>街坊味 · 顾客使用端原型</title>
    <!-- PROTOTYPE — 顾客使用端，不接真实订单或支付。 -->
    <style>
      :root {
        color-scheme: light;
        --ink: #29231d;
        --muted: #675d53;
        --line: #e6dccd;
        --paper: #fff8ed;
        --red: #b64131;
        --red-dark: #8f2d22;
        --red-soft: #fbe9e4;
        --green: #287557;
        --green-dark: #1e5d45;
        --green-soft: #e7f3ec;
        --gold: #edae32;
        --gold-soft: #fff2d5;
        --phone: #211d18;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 8% 10%, rgba(182,65,49,.1), transparent 30rem), radial-gradient(circle at 92% 84%, rgba(237,174,50,.2), transparent 30rem), var(--paper); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .page { min-height: 100vh; padding: 28px 30px 110px; }
      .topbar { width: min(1220px, 100%); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding-right: 190px; }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 900; }
      .brand-logo { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 24px rgba(182,65,49,.2); }
      .proto-note { color: var(--muted); font-size: 12px; font-weight: 750; }
      .role-switch { position: fixed; z-index: 20; top: 22px; right: 24px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.86); color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 800; box-shadow: 0 8px 24px rgba(52,41,31,.08); backdrop-filter: blur(10px); }
      .blueprint-switch { position: fixed; z-index: 20; top: 66px; right: 24px; padding: 8px 12px; border-radius: 999px; background: var(--green-dark); color: #fff; text-decoration: none; font-size: 11px; font-weight: 850; box-shadow: 0 8px 24px rgba(30,93,69,.16); }
      .layout { width: min(1220px, 100%); margin: 34px auto 0; display: grid; grid-template-columns: minmax(340px,.95fr) minmax(390px,1.05fr); gap: 72px; align-items: center; }
      .story { padding: 20px 0; }
      .kicker { color: var(--red); font-size: 12px; font-weight: 900; letter-spacing: .08em; }
      h1 { max-width: 610px; margin: 14px 0 18px; font-size: clamp(40px,4.8vw,64px); line-height: 1.03; letter-spacing: -.055em; text-wrap: balance; }
      .lead { max-width: 570px; margin: 0; color: var(--muted); font-size: clamp(17px,2vw,20px); line-height: 1.7; }
      .proofs { display: grid; gap: 12px; max-width: 560px; margin-top: 34px; }
      .proof { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 13px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.72); font-size: 14px; font-weight: 750; }
      .proof b { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--red-soft); color: var(--red-dark); }
      .story-action { display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; padding: 15px 20px; border: 0; border-radius: 15px; background: var(--ink); color: #fff; font-weight: 850; box-shadow: 0 14px 30px rgba(41,35,29,.18); }
      .story-action span { color: var(--gold); font-size: 20px; }
      .visual { position: relative; min-height: 790px; display: grid; place-items: center; }
      .halo { position: absolute; inset: 8% 4%; border-radius: 50%; background: radial-gradient(circle, rgba(237,174,50,.34), rgba(182,65,49,.08) 45%, transparent 69%); }
      .phone { position: relative; z-index: 1; width: min(390px,92vw); height: 748px; overflow: hidden; border: 7px solid var(--phone); border-radius: 42px; background: #fff; box-shadow: 0 32px 90px rgba(82,48,28,.16); }
      .phone::before { content: ""; position: absolute; z-index: 8; top: 8px; left: 50%; transform: translateX(-50%); width: 92px; height: 25px; border-radius: 14px; background: var(--phone); }
      .statusbar { position: relative; z-index: 7; height: 35px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 800; }
      .appbar { height: 58px; padding: 0 15px; display: grid; grid-template-columns: 62px 1fr 62px; align-items: center; border-bottom: 1px solid rgba(0,0,0,.06); background: #fff; font-size: 17px; font-weight: 850; }
      .appbar strong { text-align: center; }
      .back { display: grid; width: 42px; height: 42px; place-items: center start; padding: 0; border: 0; background: transparent; color: var(--ink); font-size: 27px; font-weight: 400; }
      .back-placeholder { display: block; width: 42px; height: 42px; }
      .capsule { justify-self: end; width: 60px; height: 27px; border: 1px solid rgba(0,0,0,.16); border-radius: 999px; display: grid; place-items: center; letter-spacing: 3px; font-size: 10px; }
      .screen { height: 648px; padding: 15px; overflow-y: auto; background: #fbf8f1; }
      .phone.has-app-tabs .screen { height: 590px; }
      .app-tabs { position: relative; z-index: 7; height: 58px; display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid rgba(0,0,0,.08); background: rgba(255,255,255,.98); }
      .app-tabs button { border: 0; background: transparent; color: #8a8178; font-size: 10px; font-weight: 800; }
      .app-tabs button.active { color: var(--green-dark); }
      .wechat .statusbar, .wechat .appbar { background: #ededed; }
      .wechat .screen { background: #ededed; }
      .time { margin: 6px 0 17px; color: #8a8478; text-align: center; font-size: 11px; }
      .message { display: flex; gap: 8px; align-items: flex-start; }
      .avatar { flex: 0 0 auto; display: grid; place-items: center; width: 39px; height: 39px; border-radius: 8px; background: var(--green); color: #fff; font-size: 12px; font-weight: 900; }
      .sender { margin: 0 4px 4px; color: #6f6a60; font-size: 11px; }
      .share-card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 8px 22px rgba(52,41,31,.07); }
      .message .share-card { width: 270px; }
      .share-main { padding: 14px; }
      .share-brand { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 9px; font-weight: 800; }
      .mini-logo { width: 24px; height: 24px; border-radius: 7px; object-fit: cover; }
      .share-card h3 { margin: 10px 0 5px; font-size: 17px; }
      .share-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.55; }
      .share-foot { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-top: 1px solid #eee8df; color: var(--green-dark); font-size: 9px; font-weight: 850; }
      .menu-detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px; }
      .menu-detail-actions.single { grid-template-columns: 1fr; }
      .menu-detail-button { min-height: 31px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--green-dark); font-size: 9px; font-weight: 850; }
      .menu-detail-button[aria-expanded="true"] { border-color: rgba(40,117,87,.38); background: var(--green-soft); }
      .menu-detail-list { margin-top: 7px; padding: 8px 10px; border-radius: 10px; background: #f5f1e8; }
      .menu-detail-list strong { display: block; margin-bottom: 5px; font-size: 10px; }
      .menu-detail-list ul { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 9px; margin: 0; padding-left: 14px; color: var(--muted); font-size: 8px; line-height: 1.45; }
      .detail-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .detail-head span { color: var(--muted); font-size: 11px; }
      .detail-head strong { display: block; margin-top: 3px; font-size: 21px; }
      .detail-head em { color: var(--green-dark); font-size: 12px; font-style: normal; font-weight: 800; }
      .menu-rule { margin-bottom: 10px; padding: 10px 11px; border-radius: 12px; background: var(--gold-soft); color: #765313; font-size: 10px; line-height: 1.5; }
      .primary, .secondary { width: 100%; padding: 12px; border-radius: 11px; font-weight: 850; }
      .primary { margin-top: 12px; border: 0; background: var(--red); color: #fff; }
      .secondary { margin-top: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
      .order-types { display: grid; gap: 8px; margin-top: 10px; }
      .order-type { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); text-align: left; }
      .order-type b { display: inline-block; margin-bottom: 7px; padding: 4px 7px; border-radius: 999px; background: var(--red-soft); color: var(--red-dark); font-size: 8px; }
      .order-type.long b { background: var(--green-soft); color: var(--green-dark); }
      .order-type strong { display: block; font-size: 13px; }
      .order-type span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.5; }
      .order-type .order-entry { margin-top: 10px; color: var(--green-dark); text-align: right; font-weight: 900; }
      .meal-orders { display: grid; gap: 8px; margin: 10px 0; }
      .meal-order { display: grid; grid-template-columns: minmax(0, 1fr) 68px; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
      .meal-order:has(.meal-pick input:checked) { border-color: rgba(40,117,87,.55); background: var(--green-soft); }
      .meal-pick { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink); cursor: pointer; }
      .meal-pick input { flex: 0 0 auto; width: 16px; min-height: 16px; padding: 0; accent-color: var(--green); }
      .meal-copy { min-width: 0; }
      .meal-copy strong { display: block; font-size: 12px; }
      .meal-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 8px; font-weight: 500; line-height: 1.45; }
      .meal-quantity { gap: 3px; }
      .meal-quantity input { min-height: 34px; text-align: center; }
      .profile { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; padding: 10px; border-radius: 11px; background: #f3efe8; }
      .profile strong { font-size: 10px; }
      .profile span { color: var(--muted); font-size: 8px; }
      .tiny { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--green-dark); font-size: 9px; font-weight: 850; }
      .address-panel { display: grid; gap: 8px; margin-top: 8px; padding: 11px; border: 1px solid rgba(40,117,87,.34); border-radius: 12px; background: var(--green-soft); }
      .address-panel .field-grid { grid-template-columns: 1fr 1.25fr; }
      .address-actions { display: grid; grid-template-columns: 1fr 1.4fr; gap: 6px; }
      .address-actions button { min-height: 34px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--muted); font-size: 9px; font-weight: 850; }
      .address-actions button:last-child { border-color: transparent; background: var(--green); color: #fff; }
      .coverage-note { color: var(--green-dark); font-size: 8px; line-height: 1.5; }
      .fields { display: grid; gap: 8px; margin-top: 9px; padding: 11px; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      label { display: grid; gap: 4px; color: var(--muted); font-size: 8px; font-weight: 800; }
      input, select { width: 100%; min-height: 36px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; outline: 0; background: #fbf9f5; color: var(--ink); font-size: 10px; }
      input:focus, select:focus { border-color: rgba(40,117,87,.65); box-shadow: 0 0 0 3px rgba(40,117,87,.1); }
      .summary { padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(52,41,31,.07); }
      .summary small { color: var(--red-dark); font-size: 9px; font-weight: 900; }
      .summary h3 { margin: 7px 0 5px; font-size: 19px; }
      .summary p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
      .success { padding: 20px; border-radius: 20px; background: var(--green); color: #fff; }
      .success strong { display: block; margin-bottom: 8px; font-size: 22px; }
      .success p { margin: 0; font-size: 13px; line-height: 1.6; }
      .error { margin: 7px 0 0; color: var(--red-dark); font-size: 9px; font-weight: 750; }
      .order-list { display: grid; gap: 8px; margin-top: 10px; }
      .order-card { padding: 11px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
      .order-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .order-head strong { font-size: 12px; }
      .tag { padding: 5px 7px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); font-size: 8px; font-weight: 850; }
      .tag.short { background: var(--red-soft); color: var(--red-dark); }
      .order-card p { margin: 5px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
      .note { margin-top: 9px; color: var(--muted); font-size: 9px; line-height: 1.5; }
      .floating { position: absolute; z-index: 3; right: -4%; top: 11%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.9); box-shadow: 0 14px 34px rgba(52,41,31,.13); font-size: 11px; font-weight: 800; transform: rotate(3deg); }
      .floating em { display: block; margin-top: 4px; color: var(--red); font-size: 14px; font-style: normal; }
      .present-nav { position: fixed; z-index: 20; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; padding: 7px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; background: rgba(31,48,40,.94); box-shadow: 0 16px 46px rgba(0,0,0,.25); }
      .present-nav button { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: #fff; font-size: 18px; }
      .present-label { min-width: 170px; color: #fff; text-align: center; font-size: 11px; font-weight: 850; }
      .present-dots { display: flex; justify-content: center; gap: 5px; margin-top: 3px; }
      .present-dots i { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.25); }
      .present-dots i.active { width: 13px; border-radius: 5px; background: var(--gold); }
      @media (max-width: 930px) { .topbar { padding-right: 0; } .layout { grid-template-columns: 1fr; gap: 20px; } .story { text-align: center; } .lead, .proofs { margin-right: auto; margin-left: auto; } .story-action { margin-right: auto; margin-left: auto; } .visual { min-height: 770px; } .floating { right: 5%; } }
      @media (max-width: 560px) { .page { padding: 18px 14px 105px; } .proto-note { display: none; } .role-switch, .blueprint-switch { position: static; display: inline-block; margin: 14px 4px 0 14px; } .layout { margin-top: 14px; } .story { padding-top: 0; } h1 { font-size: 43px; } .proofs { display: none; } .visual { min-height: 720px; } .phone { height: 690px; border-radius: 36px; } .screen { height: 590px; } .phone.has-app-tabs .screen { height: 532px; } .floating { display: none; } }
    </style>
  </head>
  <body>
    <a class="role-switch" href="../prototype-taozi/">切到桃子使用端 →</a>
    <a class="blueprint-switch" href="../">返回工程总蓝图</a>
    <div id="app"></div>
    <script>
      const steps = ["entry", "choose", "short", "long", "orders"];
      const labels = { entry: "明日开饭卡片", choose: "选择订单类型", short: "明日短单", long: "长期订单", orders: "我的订单" };
      const copy = {
        entry: { kicker: "顾客使用端 · 01", title: "桃子今晚说开饭，<br />你来订明天。", lead: "桃子每天晚上确认明天是否做饭。她发出明日开饭卡片后，顾客可以选择明天午饭或晚饭，并展开查看这一餐完整的 5 道菜。", proofs: [["明", "卡片只对应明天，不开放更远日期"], ["菜", "午饭、晚饭都能查看完整菜品"], ["界", "这里只记订单，付款仍在微信完成"]], action: "打开明日开饭卡片" },
        choose: { kicker: "下单方式 · 02", title: "订明天，<br />或设置长期订单。", lead: "短单可以把明天的午饭和晚饭一次订完；长期订单适合连续 4—90 天的固定需求，先由桃子审核，再在线下付款。", proofs: [["短", "午饭和晚饭可以同单提交"], ["长", "长期订单支持连续 4—90 天"], ["审", "桃子同意后再微信付款生效"]], action: "先订明天" },
        short: { kicker: "明日短单 · 03", title: "午饭和晚饭，<br />一次就能订好。", lead: "日期固定为明天。顾客可以同时勾选午饭和晚饭，并从桃子开放的小区中选择配送地址。", proofs: [["餐", "午饭、晚饭可以一起选择"], ["址", "小区只能从桃子的配送范围选择"], ["止", "截止后关闭，不自动续订"]], action: "再看长期订单" },
        long: { kicker: "长期订单 · 04", title: "固定一段时间，<br />两餐一次订好。", lead: "顾客填写开始日期和连续天数，再同时选择每天的午饭、晚饭；配送小区同样受桃子的范围限制。", proofs: [["餐", "午饭和晚饭可以放在同一订单"], ["址", "长期订单也只能选择开放小区"], ["审", "审核通过后再微信付款生效"]], action: "查看停餐与退款" },
        orders: { kicker: "订单管理 · 05", title: "订单、菜品和停餐，<br />都能回来看。", lead: "每笔订单可以展开查看对应餐次的完整菜品。桃子临时停餐时仍在街坊微信群统一说明，订单页同时记录本餐应退金额。", proofs: [["菜", "短单和长期订单都能查看本餐菜品"], ["群", "明天停餐由桃子在微信群公告"], ["退", "按受影响餐次生成退款记录"]], action: "重新体验" },
      };
      let shortStage = "form";
      let longStage = "form";
      let shortLunchSelected = true;
      let shortDinnerSelected = false;
      let shortLunchQuantity = 1;
      let shortDinnerQuantity = 1;
      let longLunchSelected = true;
      let longDinnerSelected = false;
      let longLunchQuantity = 3;
      let longDinnerQuantity = 1;
      let longDuration = 30;
      let error = "";
      let refundAcknowledged = false;
      let shortOrderSummaryShared = false;
      let expandedCustomerMenu = null;
      let editingAddress = false;
      let customerCommunity = "桂花苑";
      let customerAddressDetail = "3 栋 502";
      let addressError = "";
      const deliveryStorageKey = "kith-inn-delivery-communities";
      function storedDeliveryCommunities() {
        try {
          const stored = JSON.parse(localStorage.getItem(deliveryStorageKey));
          if (Array.isArray(stored) && stored.length && stored.every((community) => typeof community === "string" && community.trim())) return stored;
        } catch {}
        return ["桂花苑", "梧桐里", "春和家园"];
      }
      let availableCommunities = storedDeliveryCommunities();
      if (!availableCommunities.includes(customerCommunity)) customerCommunity = availableCommunities[0];
      const customerMenus = {
        lunch: ["红烧排骨", "番茄炒蛋", "清炒油麦菜", "香菇青菜", "海带豆腐汤"],
        dinner: ["红烧牛腩", "清蒸鲈鱼", "蒜蓉时蔬", "手撕包菜", "番茄蛋汤"],
      };

      function currentStep() {
        const value = new URLSearchParams(location.search).get("step");
        return steps.includes(value) ? value : "entry";
      }
      function go(step) {
        const url = new URL(location.href);
        url.searchParams.set("step", step);
        history.replaceState({}, "", url);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function cyclePresentation(delta) {
        const index = steps.indexOf(currentStep());
        go(steps[(index + delta + steps.length) % steps.length]);
      }
      function logo(className = "mini-logo") { return `<img class="${className}" src="../kith-inn-logo.png" alt="街坊味" />`; }
      function customerBackVisible(step) { return ["short", "long"].includes(step); }
      function customerBackControl(step) {
        return customerBackVisible(step)
          ? `<button class="back" data-app-back aria-label="返回上一页">‹</button>`
          : `<span class="back-placeholder" aria-hidden="true"></span>`;
      }
      function customerTabBar(step) {
        const tabs = [["choose", "预订"], ["orders", "订单"]];
        return `<nav class="app-tabs" aria-label="顾客端主导航">${tabs.map(([target, label]) => `<button class="${step === target ? "active" : ""}" data-app-tab="${target}" ${step === target ? 'aria-current="page"' : ""}>${label}</button>`).join("")}</nav>`;
      }
      function handleCustomerBack() {
        if (editingAddress) { editingAddress = false; addressError = ""; render(); return; }
        const step = currentStep();
        if (step === "short") {
          if (shortStage === "review") { shortStage = "form"; render(); }
          else go("choose");
        }
        if (step === "long") {
          if (longStage === "review") { longStage = "form"; render(); }
          else go("choose");
        }
      }
      function phone(title, body, kind = "") {
        const step = currentStep();
        const showTabs = ["choose", "orders"].includes(step);
        return `<div class="phone ${kind} ${showTabs ? "has-app-tabs" : ""}"><div class="statusbar"><span>9:41</span><span>5G · 86%</span></div><div class="appbar">${customerBackControl(step)}<strong>${title}</strong><span class="capsule">•• ◉</span></div><div class="screen">${body}</div>${showTabs ? customerTabBar(step) : ""}</div>`;
      }
      function menuDetail(key, meal, label) {
        if (expandedCustomerMenu !== key) return "";
        return `<div class="menu-detail-list"><strong>${label} · 5 道菜</strong><ul>${customerMenus[meal].map((dish) => `<li>${dish}</li>`).join("")}</ul></div>`;
      }
      function menuDetailButton(key, meal, label) {
        const open = expandedCustomerMenu === key;
        return `<button class="menu-detail-button" data-customer-menu="${key}" aria-expanded="${open}" data-meal="${meal}">${open ? `收起${label}` : `查看${label} 5 道菜`}</button>`;
      }
      function shareCard() { return `<div class="share-card"><div class="share-main"><div class="share-brand">${logo()}街坊味 · 桃子的家常饭</div><h3>明天 9月8日开饭</h3><p>午饭：红烧排骨、番茄炒蛋等 5 道<br />晚饭：红烧牛腩、清蒸鲈鱼等 5 道</p><div class="menu-detail-actions">${menuDetailButton("card-lunch", "lunch", "午饭")}${menuDetailButton("card-dinner", "dinner", "晚饭")}</div>${menuDetail("card-lunch", "lunch", "午饭")}${menuDetail("card-dinner", "dinner", "晚饭")}</div><div class="share-foot"><span>菜单已发布锁定</span><span>今晚 21:30 截止</span></div></div>`; }
      function entryPhone() { return phone("街坊味街坊群", `<div class="time">晚上 8:12</div><div class="message"><div class="avatar">桃子</div><div><div class="sender">桃子</div>${shareCard()}<button class="primary" data-goto="choose">打开明日开饭卡片</button></div></div><div class="note">只有桃子确认明天做饭并发出卡片，短单入口才会开放。</div>`, "wechat"); }
      function choosePhone() { return phone("街坊味预订", `<div class="detail-head"><div><span>明天午饭和晚饭已开放</span><strong>想怎么订？</strong></div><em>顾客端</em></div>${shareCard()}<div class="order-types"><button class="order-type" data-goto="short"><b>明日短单</b><strong>订明天的午饭和晚饭</strong><span>可同时选择两个餐次，并分别填写份数。</span><span class="order-entry">进入预订</span></button><button class="order-type long" data-goto="long"><b>4 天起</b><strong>长期订单</strong><span>可同时订每天的午饭和晚饭，等待桃子审核。</span><span class="order-entry">进入预订</span></button></div><div class="note">长期订单最短 4 天；提交后需要桃子审核，不会直接生效或付款。</div>`); }
      function escapeHTML(value) { return String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character])); }
      function customerAddressText() { return `${customerCommunity} · ${customerAddressDetail}`; }
      function revealAddressEditor() {
        requestAnimationFrame(() => {
          const screen = document.querySelector(".screen");
          if (screen) screen.scrollTop = screen.scrollHeight;
        });
      }
      function addressEditor() {
        if (!editingAddress) return "";
        return `<div class="address-panel"><div class="field-grid"><label>配送小区<select id="customer-community" aria-label="配送小区">${availableCommunities.map((community) => `<option ${community === customerCommunity ? "selected" : ""}>${escapeHTML(community)}</option>`).join("")}</select></label><label>楼栋 / 门牌<input id="customer-address-detail" value="${escapeHTML(customerAddressDetail)}" aria-label="楼栋和门牌" /></label></div><div class="coverage-note">只显示桃子已经开放的 ${availableCommunities.length} 个小区，不能手动填写其他小区。</div>${addressError ? `<p class="error">${addressError}</p>` : ""}<div class="address-actions"><button data-action="cancel-address">取消</button><button data-action="save-address">保存配送地址</button></div></div>`;
      }
      function profile(quantity) { return `<div class="profile"><div><strong>周阿姨 · ${quantity} 份</strong><br /><span>送到 ${escapeHTML(customerAddressText())}</span></div><button class="tiny" data-action="edit-address">修改地址</button></div>${addressEditor()}`; }
      function selectedShortMeals() {
        const meals = [];
        if (shortLunchSelected) meals.push({ name: "午饭", quantity: shortLunchQuantity, menu: "红烧排骨、番茄炒蛋等 5 道" });
        if (shortDinnerSelected) meals.push({ name: "晚饭", quantity: shortDinnerQuantity, menu: "红烧牛腩、清蒸鲈鱼等 5 道" });
        return meals;
      }
      function shortTotalQuantity() { return selectedShortMeals().reduce((sum, meal) => sum + meal.quantity, 0); }
      function shortTotalPrice() { return shortTotalQuantity() * 30; }
      function shortMealText() { return selectedShortMeals().map((meal) => `${meal.name} ${meal.quantity} 份`).join(" · "); }
      function selectedLongMeals() {
        const meals = [];
        if (longLunchSelected) meals.push({ name: "午饭", quantity: longLunchQuantity });
        if (longDinnerSelected) meals.push({ name: "晚饭", quantity: longDinnerQuantity });
        return meals;
      }
      function longTotalQuantity() { return selectedLongMeals().reduce((sum, meal) => sum + meal.quantity, 0); }
      function longTotalPrice() { return longTotalQuantity() * 30 * longDuration; }
      function longMealText() { return selectedLongMeals().map((meal) => `${meal.name} ${meal.quantity} 份`).join(" · "); }
      function shortForm() {
        return `<div class="detail-head"><div><span>日期固定为明天</span><strong>明日短单</strong></div><em>9月8日</em></div>${shareCard()}<div class="menu-rule"><b>午饭、晚饭可以一起订</b><br />勾选需要的餐次，再分别填写份数；至少选择一餐。</div><div class="meal-orders"><div class="meal-order"><label class="meal-pick"><input id="short-lunch-selected" type="checkbox" ${shortLunchSelected ? "checked" : ""} /><span class="meal-copy"><strong>午饭</strong><small>红烧排骨、番茄炒蛋等 5 道</small></span></label><label class="meal-quantity">份数<input id="short-lunch-quantity" type="number" value="${shortLunchQuantity}" min="1" max="20" aria-label="明日午饭份数" /></label></div><div class="meal-order"><label class="meal-pick"><input id="short-dinner-selected" type="checkbox" ${shortDinnerSelected ? "checked" : ""} /><span class="meal-copy"><strong>晚饭</strong><small>红烧牛腩、清蒸鲈鱼等 5 道</small></span></label><label class="meal-quantity">份数<input id="short-dinner-quantity" type="number" value="${shortDinnerQuantity}" min="1" max="20" aria-label="明日晚饭份数" /></label></div></div>${profile(shortTotalQuantity())}${error ? `<p class="error">${error}</p>` : ""}<button class="primary" data-action="review-short">查看确认摘要</button><button class="secondary" data-goto="choose">换一种下单方式</button>`;
      }
      function shortReview() {
        const details = selectedShortMeals().map((meal) => `${meal.name}：${meal.quantity} 份 × ¥30 = ¥${meal.quantity * 30}`).join("<br />");
        return `<div class="detail-head"><div><span>提交前最后确认</span><strong>明日短单摘要</strong></div><em>未提交</em></div><div class="summary"><small>明天一次提交</small><h3>9月8日 · ${shortMealText()}</h3><p>${details}<br /><b>订单合计 ¥${shortTotalPrice()}</b><br />送到 ${escapeHTML(customerAddressText())}</p></div><button class="primary" data-action="submit-short">确认提交明日短单</button><button class="secondary" data-action="edit-short">返回修改</button><div class="note">午饭和晚饭会分别进入桃子的明日备餐表；平台不代收款。</div>`;
      }
      function shortDone() { return `<div class="success"><strong>明日短单已提交</strong><p>9月8日 · ${shortMealText()}。<br />配送到 ${escapeHTML(customerAddressText())}。</p></div><div class="order-list"><div class="order-card"><div class="order-head"><strong>9月8日 · ${shortMealText()}</strong><span class="tag short">短单</span></div><p>${escapeHTML(customerAddressText())} · 待桃子确认<br />订单金额 ¥${shortTotalPrice()}</p></div></div><button class="primary" data-goto="orders">查看我的订单</button><button class="secondary" data-action="share-short-summary">${shortOrderSummaryShared ? "订单摘要已生成 · 去微信发送" : "生成订单摘要发给桃子"}</button><button class="secondary" data-action="new-short">重新填写</button>`; }
      function shortPhone() { return phone("街坊味预订", shortStage === "review" ? shortReview() : shortStage === "done" ? shortDone() : shortForm()); }
      function longForm() {
        return `<div class="detail-head"><div><span>需要桃子审核</span><strong>长期订单</strong></div><em>4 天起</em></div><div class="menu-rule"><b>每天午饭、晚饭可以一起订</b><br />勾选需要长期保留的餐次，分别填写每天份数；临时停餐按当天对应餐次退款。</div><div class="meal-orders"><div class="meal-order"><label class="meal-pick"><input id="long-lunch-selected" type="checkbox" ${longLunchSelected ? "checked" : ""} /><span class="meal-copy"><strong>每天午饭</strong><small>午饭开饭时固定保留</small></span></label><label class="meal-quantity">份数<input id="long-lunch-quantity" type="number" value="${longLunchQuantity}" min="1" max="20" aria-label="长期午饭份数" /></label></div><div class="meal-order"><label class="meal-pick"><input id="long-dinner-selected" type="checkbox" ${longDinnerSelected ? "checked" : ""} /><span class="meal-copy"><strong>每天晚饭</strong><small>晚饭开饭时固定保留</small></span></label><label class="meal-quantity">份数<input id="long-dinner-quantity" type="number" value="${longDinnerQuantity}" min="1" max="20" aria-label="长期晚饭份数" /></label></div></div><div class="fields"><div class="field-grid"><label>开始日期<input value="9月8日" aria-label="长期开始日期" readonly /></label><label>连续天数<input id="long-duration" type="number" value="${longDuration}" min="4" max="90" aria-label="长期连续天数" /></label></div></div>${profile(longTotalQuantity())}${error ? `<p class="error">${error}</p>` : ""}<button class="primary" data-action="review-long">查看长期订单</button><button class="secondary" data-goto="choose">换一种下单方式</button>`;
      }
      function longReview() {
        const details = selectedLongMeals().map((meal) => `${meal.name}：每天 ${meal.quantity} 份 × ¥30 × ${longDuration} 天 = ¥${meal.quantity * 30 * longDuration}`).join("<br />");
        return `<div class="detail-head"><div><span>先审核，后付款</span><strong>长期订单摘要</strong></div><em>待提交</em></div><div class="summary"><small>9月8日起 · 连续 ${longDuration} 天</small><h3>每天 · ${longMealText()}</h3><p>${details}<br /><b>预估合计 ¥${longTotalPrice()}</b><br />送到 ${escapeHTML(customerAddressText())}</p></div><div class="menu-rule" style="margin-top:10px"><b>生效顺序</b><br />提交订单 → 桃子审核 → 微信付款 → 桃子标记生效。</div><button class="primary" data-action="submit-long">提交长期订单</button><button class="secondary" data-action="edit-long">返回修改</button>`;
      }
      function longDone() {
        return `<div class="success"><strong>长期订单已提交</strong><p>连续 ${longDuration} 天 · ${longMealText()}。<br />桃子同意后，再联系你微信付款。</p></div><div class="order-list"><div class="order-card"><div class="order-head"><strong>9月8日起 · ${longDuration} 天</strong><span class="tag">待桃子审核</span></div><p>每天 · ${longMealText()}<br />当前未生效，也尚未付款</p></div></div><button class="primary" data-goto="orders">查看示例生效订单</button><button class="secondary" data-action="new-long">修改订单</button>`;
      }
      function longPhone() { return phone("街坊味预订", longStage === "review" ? longReview() : longStage === "done" ? longDone() : longForm()); }
      function ordersPhone() {
        const refundState = refundAcknowledged ? "已确认收到" : "待确认退款";
        return phone("我的订单", `<div class="detail-head"><div><span>周阿姨</span><strong>我的订单</strong></div><em>线下付款</em></div><div class="order-list"><div class="order-card"><div class="order-head"><strong>9月8日 · 晚饭 · 1 份</strong><span class="tag short">明日短单</span></div><p>${escapeHTML(customerAddressText())} · 桃子已确认<br />订单金额 ¥30</p><div class="menu-detail-actions single">${menuDetailButton("order-short-dinner", "dinner", "本餐菜品")}</div>${menuDetail("order-short-dinner", "dinner", "9月8日晚饭")}</div><div class="order-card"><div class="order-head"><strong>9月8日起 · 连续 30 天</strong><span class="tag">长期生效中</span></div><p>每天午饭 3 份 · 晚饭 1 份 · 已线下付款<br />配送到 ${escapeHTML(customerAddressText())}</p><div class="menu-detail-actions">${menuDetailButton("order-long-lunch", "lunch", "9月8日午饭")}${menuDetailButton("order-long-dinner", "dinner", "9月8日晚饭")}</div>${menuDetail("order-long-lunch", "lunch", "9月8日午饭")}${menuDetail("order-long-dinner", "dinner", "9月8日晚饭")}</div><div class="order-card refund"><div class="order-head"><strong>9月10日午饭停餐</strong><span class="tag short">${refundState}</span></div><p>微信群公告：桃子明天有事，午饭暂停一次<br />应退 3 份 × ¥30 = ¥90</p>${refundAcknowledged ? `<div class="note">你已确认收到桃子的微信退款。</div>` : `<button class="tiny" data-action="ack-refund">确认已收到 ¥90 退款</button>`}</div></div><div class="menu-rule" style="margin-top:10px"><b>群里公告，微信退款</b><br />停餐由桃子在微信群统一说明；平台记录停餐原因、应退金额和顾客确认，不验证资金到账。</div><button class="secondary" data-goto="choose">继续查看预订方式</button>`);
      }
      function phoneFor(step) { return { entry: entryPhone, choose: choosePhone, short: shortPhone, long: longPhone, orders: ordersPhone }[step](); }
      function render() {
        const step = currentStep();
        const item = copy[step];
        const stepIndex = steps.indexOf(step);
        document.title = `${labels[step]} · 顾客使用端原型 · 街坊味`;
        document.querySelector("#app").innerHTML = `<main class="page"><header class="topbar"><div class="brand">${logo("brand-logo")}街坊味 · Kith Inn</div><div class="proto-note">顾客使用端原型 · 不接真实数据</div></header><div class="layout"><section class="story"><div class="kicker">${item.kicker}</div><h1>${item.title}</h1><p class="lead">${item.lead}</p><div class="proofs">${item.proofs.map(([icon,text]) => `<div class="proof"><b>${icon}</b>${text}</div>`).join("")}</div><button class="story-action" data-present-next>${item.action}<span>→</span></button></section><section class="visual" aria-label="顾客手机交互演示"><div class="halo"></div>${phoneFor(step)}<div class="floating">顾客只需要知道<em>“明天怎么吃”</em></div></section></div></main><nav class="present-nav" aria-label="顾客端原型讲解顺序"><button data-present-prev aria-label="上一个讲解页面">←</button><div class="present-label">讲解 ${stepIndex + 1} / ${steps.length} · ${labels[step]}<div class="present-dots">${steps.map((_, index) => `<i class="${index === stepIndex ? "active" : ""}"></i>`).join("")}</div></div><button data-present-next aria-label="下一个讲解页面">→</button></nav>`;
      }
      function validQuantity(value) {
        const parsed = Number(value);
        return Number.isInteger(parsed) && parsed >= 1 && parsed <= 20 ? parsed : null;
      }
      function validDuration(value) {
        const parsed = Number(value);
        return Number.isInteger(parsed) && parsed >= 4 && parsed <= 90 ? parsed : null;
      }
      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-present-next]")) { cyclePresentation(1); return; }
        if (event.target.closest("[data-present-prev]")) { cyclePresentation(-1); return; }
        const appTarget = event.target.closest("[data-app-tab]")?.dataset.appTab;
        if (appTarget) { go(appTarget); return; }
        if (event.target.closest("[data-app-back]")) { handleCustomerBack(); return; }
        const target = event.target.closest("[data-goto]")?.dataset.goto;
        if (target) go(target);
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (action === "review-short") {
          const lunchSelected = document.querySelector("#short-lunch-selected")?.checked || false;
          const dinnerSelected = document.querySelector("#short-dinner-selected")?.checked || false;
          const lunchQuantity = validQuantity(document.querySelector("#short-lunch-quantity")?.value);
          const dinnerQuantity = validQuantity(document.querySelector("#short-dinner-quantity")?.value);
          shortLunchSelected = lunchSelected;
          shortDinnerSelected = dinnerSelected;
          if (lunchQuantity) shortLunchQuantity = lunchQuantity;
          if (dinnerQuantity) shortDinnerQuantity = dinnerQuantity;
          if (editingAddress) error = "请先保存配送地址。";
          else if (!lunchSelected && !dinnerSelected) error = "请至少选择午饭或晚饭。";
          else if (lunchSelected && !lunchQuantity) error = "午饭份数请输入 1—20 的整数。";
          else if (dinnerSelected && !dinnerQuantity) error = "晚饭份数请输入 1—20 的整数。";
          else { error = ""; shortStage = "review"; }
          render();
        }
        if (action === "submit-short") { shortOrderSummaryShared = false; shortStage = "done"; render(); }
        if (action === "edit-short") { shortStage = "form"; render(); }
        if (action === "new-short") { shortStage = "form"; render(); }
        if (action === "share-short-summary") { shortOrderSummaryShared = true; render(); }
        if (action === "review-long") {
          const lunchSelected = document.querySelector("#long-lunch-selected")?.checked || false;
          const dinnerSelected = document.querySelector("#long-dinner-selected")?.checked || false;
          const lunchQuantity = validQuantity(document.querySelector("#long-lunch-quantity")?.value);
          const dinnerQuantity = validQuantity(document.querySelector("#long-dinner-quantity")?.value);
          const duration = validDuration(document.querySelector("#long-duration")?.value);
          longLunchSelected = lunchSelected;
          longDinnerSelected = dinnerSelected;
          if (lunchQuantity) longLunchQuantity = lunchQuantity;
          if (dinnerQuantity) longDinnerQuantity = dinnerQuantity;
          if (editingAddress) error = "请先保存配送地址。";
          else if (!lunchSelected && !dinnerSelected) error = "请至少选择每天的午饭或晚饭。";
          else if (lunchSelected && !lunchQuantity) error = "午饭份数请输入 1—20 的整数。";
          else if (dinnerSelected && !dinnerQuantity) error = "晚饭份数请输入 1—20 的整数。";
          else if (!duration) error = "长期订单请输入 4—90 天。";
          else { longDuration = duration; error = ""; longStage = "review"; }
          render();
        }
        if (action === "submit-long") { longStage = "done"; render(); }
        if (action === "edit-long") { longStage = "form"; render(); }
        if (action === "new-long") { longStage = "form"; render(); }
        if (action === "ack-refund") { refundAcknowledged = true; render(); }
        if (action === "edit-address") { editingAddress = true; addressError = ""; render(); revealAddressEditor(); }
        if (action === "cancel-address") { editingAddress = false; addressError = ""; render(); }
        if (action === "save-address") {
          const community = document.querySelector("#customer-community")?.value || "";
          const detail = document.querySelector("#customer-address-detail")?.value.trim() || "";
          if (!availableCommunities.includes(community)) addressError = "这个小区不在桃子的配送范围内。";
          else if (!detail) addressError = "请填写楼栋和门牌。";
          else {
            customerCommunity = community;
            customerAddressDetail = detail;
            addressError = "";
            error = "";
            editingAddress = false;
          }
          render();
        }
        const customerMenu = event.target.closest("[data-customer-menu]")?.dataset.customerMenu;
        if (customerMenu) {
          expandedCustomerMenu = expandedCustomerMenu === customerMenu ? null : customerMenu;
          render();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "SELECT"].includes(document.activeElement?.tagName)) return;
        if (event.key === "ArrowLeft") cyclePresentation(-1);
        if (event.key === "ArrowRight") cyclePresentation(1);
      });
      window.addEventListener("popstate", render);
      window.addEventListener("storage", (event) => {
        if (event.key !== deliveryStorageKey) return;
        availableCommunities = storedDeliveryCommunities();
        if (!availableCommunities.includes(customerCommunity)) customerCommunity = availableCommunities[0];
        render();
        if (editingAddress) revealAddressEditor();
      });
      render();
    </script>
  </body>
</html>
