<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>街坊味 · 客户体验原型</title>
    <!--
      PROTOTYPE — 不接真实数据
      问题：第一次接触产品的人，能否在 2 分钟内看懂菜单生成过程和四个最终结果？
      五步高光路径，不展示初始化、配置、识别和审核过程；使用 ?step= 可分享状态。
      运行：python3 -m http.server 4173
    -->
    <style>
      :root {
        color-scheme: light;
        --ink: #1e1b16;
        --muted: #59504a;
        --line: #e3ddcf;
        --paper: #fff8ed;
        --flag-red: #b64131;
        --flag-red-dark: #8f2d22;
        --flag-red-soft: #fbe9e4;
        --flag-gold: #edae32;
        --flag-gold-soft: #fff2d5;
        --green: #287557;
        --green-dark: #1e5d45;
        --green-soft: #e7f3ec;
        --phone: #1a1712;
        --shadow: 0 18px 50px rgba(46, 38, 22, .12);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--ink);
        background: var(--paper);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, input { font: inherit; }
      button { cursor: pointer; }
      .page { min-height: 100vh; padding: 28px 30px 110px; }
      .topbar {
        width: min(1220px, 100%); margin: 0 auto; display: flex; align-items: center;
        justify-content: space-between; gap: 18px; padding-right: 178px;
      }
      .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; }
      .brand-mark {
        display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px;
        color: #fff; background: var(--flag-red); box-shadow: 0 10px 24px rgba(212,43,30,.25);
      }
      .brand-logo { width: 36px; height: 36px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 24px rgba(182,65,49,.22); }
      .proto-note { color: var(--muted); font-size: 12px; font-weight: 750; }
      .layout {
        width: min(1220px, 100%); margin: 34px auto 0; display: grid;
        grid-template-columns: minmax(340px, .95fr) minmax(390px, 1.05fr); gap: 72px; align-items: center;
      }
      .story { padding: 20px 0; }
      .step-kicker { color: var(--flag-red); font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
      h1 { max-width: 610px; margin: 12px 0 14px; font-size: clamp(30px, 3.4vw, 44px); line-height: 1.12; letter-spacing: -.03em; text-wrap: balance; }
      .lead { max-width: 540px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
      .proofs { display: grid; gap: 9px; margin-top: 24px; max-width: 520px; }
      .proof {
        display: grid; grid-template-columns: 26px 1fr; gap: 11px; align-items: center;
        padding: 3px 0; font-size: 13px; font-weight: 600;
      }
      .proof-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--flag-red-soft); color: var(--flag-red); font-size: 12px; font-weight: 800; }
      .story-action {
        display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 13px 18px;
        border: 0; border-radius: 13px; background: var(--ink); color: #fff; font-weight: 800;
        box-shadow: 0 10px 24px rgba(23,32,25,.14);
      }
      .story-action span { color: var(--flag-gold); font-size: 18px; }
      .visual { position: relative; min-height: 790px; display: grid; place-items: center; }
      .phone {
        position: relative; z-index: 1; width: min(390px, 92vw); height: 748px; overflow: hidden;
        border: 7px solid var(--phone); border-radius: 42px; background: #fff; box-shadow: var(--shadow);
      }
      .phone::before {
        content: ""; position: absolute; z-index: 8; top: 8px; left: 50%; transform: translateX(-50%);
        width: 92px; height: 25px; border-radius: 14px; background: var(--phone);
      }
      .phone-screen { min-height: 100%; background: #fff; }
      .statusbar {
        position: relative; z-index: 7; height: 35px; padding: 0 20px; display: flex;
        align-items: center; justify-content: space-between; font-size: 11px; font-weight: 800;
      }
      .appbar {
        height: 58px; padding: 0 15px; display: grid; grid-template-columns: 62px 1fr 62px;
        align-items: center; border-bottom: 1px solid rgba(0,0,0,.06); font-size: 17px; font-weight: 850;
      }
      .appbar strong { text-align: center; }
      .back { padding: 0; border: 0; background: transparent; color: inherit; text-align: left; font-size: 27px; font-weight: 400; }
      .back-placeholder { display: block; width: 42px; height: 42px; }
      .capsule { justify-self: end; width: 60px; height: 27px; border: 1px solid rgba(0,0,0,.16); border-radius: 999px; display: grid; place-items: center; letter-spacing: 3px; font-size: 10px; }
      .screen-body { height: 648px; overflow: hidden; }
      .phone.has-app-tabs .screen-body { height: 590px; }
      .app-tabs {
        position: relative; z-index: 7; height: 58px; display: grid; grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid rgba(0,0,0,.08); background: rgba(255,255,255,.98);
      }
      .app-tabs button { border: 0; background: transparent; color: #8a8178; font-size: 10px; font-weight: 800; }
      .app-tabs button.active { color: var(--green-dark); }
      .wechat .statusbar, .wechat .appbar { background: #ededed; }
      .wechat .screen-body { background: #ededed; padding: 15px 12px 70px; position: relative; }
      .time { text-align: center; color: #8a8478; font-size: 11px; margin: 6px 0 17px; }
      .msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 17px; }
      .msg.me { flex-direction: row-reverse; }
      .avatar { flex: 0 0 auto; display: grid; place-items: center; width: 39px; height: 39px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 900; }
      .avatar.blue { background: #5072a8; } .avatar.gold { background: var(--flag-gold); } .avatar.red { background: var(--flag-red); }
      .sender { margin: 0 4px 4px; color: #6f6a60; font-size: 11px; }
      .msg.me .sender { text-align: right; }
      .bubble { max-width: 260px; padding: 11px 13px; border-radius: 4px 15px 15px; background: #fff; font-size: 14px; line-height: 1.55; }
      .msg.me .bubble { border-radius: 15px 4px 15px 15px; background: #95ec69; }
      .typing { display: inline-flex; gap: 4px; padding: 14px; }
      .typing i { width: 5px; height: 5px; border-radius: 50%; background: #888; animation: bob 1s infinite alternate; }
      .typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
      @keyframes bob { to { transform: translateY(-4px); opacity: .4; } }
      .mp-card { width: 260px; overflow: hidden; border: 0; border-radius: 9px; background: #fff; text-align: left; box-shadow: 0 3px 12px rgba(0,0,0,.08); }
      .mp-main { padding: 14px; }
      .mp-brand { display: flex; align-items: center; gap: 7px; color: #6f6a60; font-size: 11px; }
      .mini-logo { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--flag-red); color: #fff; font-weight: 900; }
      .mp-title { margin-top: 10px; font-size: 17px; font-weight: 900; line-height: 1.35; }
      .mp-status { margin-top: 8px; color: var(--flag-red-dark); font-size: 10px; font-weight: 900; }
      .mp-highlight { margin-top: 9px; padding: 11px; border-radius: 10px; background: var(--flag-red-soft); color: var(--flag-red-dark); font-size: 12px; line-height: 1.5; }
      .mp-foot { padding: 8px 14px; border-top: 1px solid #eee; color: #8a8478; font-size: 11px; }
      .chat-input { position: absolute; left: 0; right: 0; bottom: 0; height: 57px; padding: 9px 11px; display: flex; gap: 8px; background: #f7f7f7; border-top: 1px solid #ddd; }
      .chat-field { flex: 1; border-radius: 7px; background: #fff; }
      .round-tool { width: 36px; height: 36px; border: 1px solid #aaa; border-radius: 50%; }
      .share-compact .screen-body { padding: 6px 10px 51px; overflow: hidden; }
      .share-compact .time { margin: 1px 0 6px; font-size: 9px; }
      .share-compact .msg { gap: 7px; margin-bottom: 6px; }
      .share-compact .avatar { width: 30px; height: 30px; border-radius: 7px; font-size: 10px; }
      .share-compact .sender { margin: 0 3px 2px; font-size: 8px; }
      .share-compact .bubble { max-width: 272px; padding: 6px 9px; border-radius: 3px 11px 11px; font-size: 11px; line-height: 1.4; }
      .share-compact .mp-card { width: 266px; border-radius: 7px; }
      .share-compact .mp-main { padding: 8px 10px; }
      .share-compact .mp-brand { gap: 5px; font-size: 8px; }
      .share-compact .mini-logo-image { width: 16px; height: 16px; border-radius: 4px; }
      .share-compact .mp-title { margin-top: 5px; font-size: 14px; line-height: 1.25; }
      .share-compact .mp-status { margin-top: 4px; font-size: 8px; }
      .share-compact .mp-highlight { margin-top: 5px; padding: 6px 8px; border-radius: 7px; font-size: 9px; line-height: 1.4; }
      .share-compact .mp-foot { padding: 5px 10px; font-size: 8px; }
      .share-compact .delivery-time { margin-top: 1px; }
      .payment-card { border-top: 3px solid var(--flag-gold); }
      .payment-card .mp-status { color: #98620c; }
      .payment-card .mp-highlight { background: var(--flag-gold-soft); color: #765313; }
      .payment-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
      .payment-summary span { color: #98620c; font-size: 8px; font-weight: 900; }
      .payment-summary strong { font-size: 15px; }
      .share-compact .chat-input { height: 51px; padding: 7px 9px; gap: 7px; }
      .share-compact .round-tool { width: 34px; height: 34px; }
      .mini .statusbar, .mini .appbar { background: #fff; }
      .mini .screen-body { padding: 15px; background: #faf8f2; overflow-y: auto; }
      .generation-preview .screen-body,
      .menu-aligned .screen-body { padding: 15px; overflow-y: auto; background: #fbf8f1; }
      .week-toolbar { display: grid; grid-template-columns: 35px 1fr 35px; align-items: center; gap: 7px; margin-bottom: 10px; }
      .week-toolbar button { width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); font-size: 20px; }
      .week-range { text-align: center; }
      .week-range strong { display: block; font-size: 15px; }
      .week-range span { color: var(--muted); font-size: 9px; }
      .plan-state { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding: 10px 11px; border-radius: 12px; background: var(--green-soft); }
      .plan-state strong { font-size: 12px; }
      .plan-state span { padding: 5px 7px; border-radius: 999px; background: #fff; color: var(--green-dark); font-size: 9px; font-weight: 850; }
      .menu-rule { margin-bottom: 10px; padding: 10px 11px; border-radius: 12px; background: var(--flag-gold-soft); color: #765313; font-size: 10px; line-height: 1.5; }
      .generation-ready { padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(52,41,31,.07); }
      .card-kicker { color: var(--flag-red-dark); font-size: 11px; font-weight: 900; letter-spacing: .06em; }
      .generation-ready h3 { margin: 7px 0 5px; font-size: 19px; }
      .generation-ready p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .weekly-menu-boards { display: grid; gap: 12px; }
      .weekly-menu-board { padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .weekly-menu-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .weekly-menu-title strong { font-size: 15px; }
      .weekly-menu-title span { padding: 6px 8px; border-radius: 9px; background: var(--green-soft); color: var(--green); font-size: 9px; font-weight: 900; }
      .weekly-menu-grid { display: grid; grid-template-columns: 38px repeat(5, minmax(0, 1fr)); gap: 3px; margin-top: 9px; }
      .weekly-menu-row { display: contents; }
      .weekly-menu-head,
      .weekly-menu-day { display: grid; min-height: 26px; place-items: center; color: var(--muted); font-size: 8px; font-weight: 850; text-align: center; }
      .weekly-menu-day { align-content: center; color: var(--ink); }
      .weekly-menu-day strong { font-size: 9px; line-height: 1; }
      .weekly-menu-day small { margin-top: 3px; color: var(--muted); font-size: 7px; line-height: 1; }
      .weekly-dish-cell { display: grid; min-height: 38px; place-items: center; padding: 3px 2px; border: 1px solid #f1c3b8; border-radius: 7px; background: var(--flag-red-soft); color: var(--ink); font-size: 8px; font-weight: 850; line-height: 1.18; text-align: center; }
      .weekly-dish-cell.veg { border-color: #badcc9; background: var(--green-soft); }
      .weekly-dish-cell.soup { border-color: #c8d9ee; background: #edf5ff; }
      .weekly-dish-cell.active { outline: 2px solid var(--flag-red); outline-offset: 1px; }
      .weekly-dish-detail { margin-top: 10px; padding: 9px; border: 1px solid #dccfbf; border-radius: 9px; background: #fffdf8; }
      .weekly-dish-detail strong { display: block; font-size: 12px; }
      .weekly-dish-detail span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; line-height: 1.45; }
      .replace-selected { width: 100%; min-height: 35px; margin-top: 8px; border: 1px solid var(--flag-red); border-radius: 9px; background: #fff; color: var(--flag-red); font-size: 10px; font-weight: 900; }
      .plan-action { position: sticky; z-index: 3; bottom: -15px; margin-top: 9px; padding: 8px 0 2px; background: linear-gradient(transparent, #fbf8f1 25%); }
      .plan-action .primary { margin-top: 0; box-shadow: 0 8px 20px rgba(182,65,49,.16); }
      .candidate-sheet { position: sticky; z-index: 8; bottom: -15px; margin: 10px -15px -15px; padding: 13px 15px 17px; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; background: #fff; box-shadow: 0 -18px 40px rgba(41,35,29,.18); }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .sheet-head strong { font-size: 13px; }
      .sheet-head button { width: 32px; height: 32px; border: 0; border-radius: 10px; background: #f3eee5; color: var(--muted); font-weight: 900; }
      .candidate-list { display: grid; gap: 5px; }
      .candidate-list button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-align: left; }
      .candidate-list button b { font-size: 11px; }
      .candidate-list button span { color: var(--muted); font-size: 9px; }
      .promise {
        position: relative; overflow: hidden; padding: 18px; border-radius: 20px; background: var(--ink); color: #fff;
      }
      .promise::after { content: ""; position: absolute; right: -38px; bottom: -54px; width: 150px; height: 150px; border-radius: 50%; background: rgba(242,185,13,.20); }
      .promise-label { color: var(--flag-gold); font-size: 11px; font-weight: 900; letter-spacing: .08em; }
      .promise h3 { position: relative; z-index: 1; margin: 8px 0 8px; font-size: 24px; line-height: 1.15; }
      .promise p { position: relative; z-index: 1; margin: 0; opacity: .92; font-size: 13px; line-height: 1.6; }
      .trust-card { margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 20px; background: #fff; box-shadow: 0 9px 28px rgba(24,48,31,.07); }
      .relation { display: flex; align-items: center; gap: 10px; }
      .relation-avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--flag-gold-soft); color: #865e14; font-weight: 900; }
      .relation strong { display: block; font-size: 14px; }
      .relation small { color: var(--muted); font-size: 11px; }
      .quote { margin: 13px 0; padding: 11px 12px; border-left: 4px solid var(--flag-gold); border-radius: 0 10px 10px 0; background: var(--flag-gold-soft); font-size: 13px; line-height: 1.55; }
      .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
      .fact { padding: 9px 7px; border-radius: 10px; background: #f3f6f3; text-align: center; }
      .fact strong { display: block; font-size: 15px; }
      .fact span { color: var(--muted); font-size: 10px; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .tag { padding: 5px 9px; border-radius: 999px; background: var(--flag-red-soft); color: var(--flag-red-dark); font-size: 11px; font-weight: 800; }
      .risk { margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .primary, .secondary {
        width: 100%; padding: 13px; border-radius: 12px; font-weight: 850; border: 0;
      }
      .primary { margin-top: 12px; background: var(--flag-red); color: #fff; }
      .secondary { margin-top: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
      .room .screen-body { position: relative; display: flex; flex-direction: column; background: #f8f6f0; }
      .room-head { padding: 8px 13px; border-bottom: 1px solid var(--line); background: #fff; }
      .people { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .person { text-align: center; font-size: 9px; color: var(--muted); }
      .person i { display: grid; place-items: center; width: 24px; height: 24px; margin: 0 auto 2px; border-radius: 8px; color: #fff; font-style: normal; font-weight: 900; font-size: 10px; }
      .person.human i { background: var(--flag-red); } .person.agent i { background: #536c9d; } .person.system i { background: #b8860b; }
      .room-scope { margin-top: 5px; padding: 5px 8px; border-radius: 8px; background: var(--flag-red-soft); color: var(--flag-red-dark); font-size: 10px; }
      .thread { flex: 1; padding: 11px 13px; overflow-y: auto; }
      .system-note { margin-bottom: 7px; color: #6e6759; text-align: center; font-size: 10px; }
      .room-msg { display: grid; grid-template-columns: 29px 1fr; gap: 8px; margin-bottom: 9px; }
      .room-msg.me { grid-template-columns: 1fr 29px; }
      .room-msg.me .room-name { text-align: right; }
      .room-msg.me .room-bubble { border-radius: 12px 3px 12px 12px; background: var(--flag-red); color: #fff; }
      .room-msg.me .room-avatar { background: var(--flag-red); }
      .room-avatar { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: #536c9d; color: #fff; font-size: 9px; font-weight: 900; }
      .room-avatar.system { background: #b8860b; }
      .room-avatar.human { background: var(--flag-red); }
      .room-name { margin-bottom: 3px; color: var(--muted); font-size: 10px; }
      .role { margin-left: 4px; padding: 2px 4px; border-radius: 4px; background: #e8edf6; color: #47608f; }
      .room-bubble { padding: 9px 10px; border-radius: 3px 12px 12px; background: #fff; font-size: 13px; line-height: 1.55; box-shadow: 0 2px 6px rgba(0,0,0,.03); }
      .photo-msg { width: 100%; height: 44px; border-radius: 8px; background: #e8e2d5; display: grid; place-items: center; color: #8a8478; font-size: 11px; line-height: 1.4; text-align: center; padding: 8px; }
      .draft-card { margin-top: 8px; padding: 8px 10px; border-radius: 9px; background: var(--flag-gold-soft); font-size: 12px; line-height: 1.55; }
      .draft-card b { display: block; margin-bottom: 5px; color: #7a5a08; font-size: 11px; letter-spacing: .03em; }
      .draft-card li { margin-left: 16px; line-height: 1.4; }
      .booking-card { margin-top: 8px; overflow: hidden; border: 1px solid #ead9bb; border-radius: 12px; background: #fff; color: var(--ink); box-shadow: 0 5px 14px rgba(46,38,22,.08); }
      .booking-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; background: var(--flag-gold-soft); }
      .booking-head strong { font-size: 13px; }
      .booking-status { padding: 3px 6px; border-radius: 999px; background: #fff; color: #7a5a08; font-size: 9px; font-weight: 900; }
      .booking-body { display: grid; gap: 7px; padding: 9px 10px; }
      .booking-row { display: grid; grid-template-columns: 48px 1fr; gap: 8px; font-size: 10px; line-height: 1.4; }
      .booking-row span { color: var(--muted); }
      .booking-row b { text-align: right; font-size: 11px; }
      .booking-note { padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 9px; line-height: 1.4; }
      .booking-action { width: 100%; padding: 9px; border: 0; background: var(--flag-red); color: #fff; font-size: 11px; font-weight: 900; }
      .room-composer { padding: 9px 11px 13px; border-top: 1px solid var(--line); background: #fff; }
      .recipient { display: flex; gap: 5px; margin-bottom: 7px; }
      .recipient button { padding: 6px 9px; border: 0; border-radius: 999px; background: #efeadf; color: var(--muted); font-size: 10px; }
      .recipient button.active { background: var(--flag-red); color: #fff; }
      .composer-row { display: flex; gap: 7px; }
      .composer-row input { min-width: 0; flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #faf8f2; font-size: 12px; }
      .composer-row button { width: 38px; border: 0; border-radius: 10px; background: var(--flag-red); color: #fff; }
      .finish .screen-body { padding: 22px 18px; background: var(--ink); color: #fff; }

        return showcaseDishOverrides[key] || showcaseWeeklyMenu[dayIndex][meal][dishIndex];
      }

      function showcaseDishMeta(kind) {
        if (kind === "meat") return "荤菜 · 常做 · 近 5 天未用 · 费工度：中";
        if (kind === "veg") return "素菜 · 清爽 · 近期未重复 · 费工度：低";
        return "汤 · 每餐 1 道 · 近期未重复 · 费工度：低";
      }

      function showcaseDishSelector(dayIndex, meal, dishIndex) {
        const [name, kind] = showcaseDishFor(dayIndex, meal, dishIndex);
        const key = showcaseDishKey(dayIndex, meal, dishIndex);
        return `<button class="weekly-dish-cell ${kind} ${selectedShowcaseDishKey === key ? "active" : ""}" data-showcase-select-dish="${key}" type="button" aria-pressed="${selectedShowcaseDishKey === key}">${name}</button>`;
      }

      function showcaseUsedDishNames(exceptKey) {
        const used = new Set();
        showcaseWeeklyMenu.forEach((day, dayIndex) => ["lunch", "dinner"].forEach((meal) => day[meal].forEach((_, dishIndex) => {
          const key = showcaseDishKey(dayIndex, meal, dishIndex);
          if (key !== exceptKey) used.add(showcaseDishFor(dayIndex, meal, dishIndex)[0]);
        })));
        return used;
      }

      function showcaseSmartSwap(key, kind) {
        const history = showcaseDishSmartSwapHistory[key] || [];
        const used = showcaseUsedDishNames(key);
        const untried = showcaseCandidatePools[kind].filter(([name]) => !history.includes(name));
        const next = untried.find(([name]) => !used.has(name)) || untried[0];
        if (!next) return;
        showcaseDishOverrides[key] = next;
        showcaseDishSmartSwapHistory[key] = [...history, next[0]];
      }

      function showcaseWeeklyBoard() {
        const selectedParts = selectedShowcaseDishKey?.split("-") || [];
        const dayIndex = Number(selectedParts[0]);
        const meal = selectedParts[1];
        const dishIndex = Number(selectedParts[2]);
        const [name, kind] = showcaseDishFor(dayIndex, meal, dishIndex);
        const rows = showcaseWeeklyMenu.flatMap((day, currentDayIndex) => [["lunch", "午饭"], ["dinner", "晚饭"]].map(([currentMeal, label]) => `<div class="weekly-menu-row"><div class="weekly-menu-day"><strong>${day.day}</strong><small>${label}</small></div>${day[currentMeal].map((_, currentDishIndex) => showcaseDishSelector(currentDayIndex, currentMeal, currentDishIndex)).join("")}</div>`)).join("");
        return `<section class="weekly-menu-board">
          <div class="weekly-menu-title"><strong>下周十餐菜单</strong><span>10 餐通过</span></div>
          <div class="weekly-menu-grid" aria-label="下周十餐菜单">
            <div class="weekly-menu-head">餐次</div><div class="weekly-menu-head">荤1</div><div class="weekly-menu-head">荤2</div><div class="weekly-menu-head">素1</div><div class="weekly-menu-head">素2</div><div class="weekly-menu-head">汤</div>
            ${rows}
          </div>
          <div class="weekly-dish-detail"><strong>${name}</strong><span>${showcaseDishMeta(kind)}</span><button class="replace-selected" data-showcase-rotate="${selectedShowcaseDishKey}" data-kind="${kind}" type="button">换这道</button></div>
        </section>`;
      }

      function showcaseCandidateSheetView() {
        if (!showcaseCandidateSheet) return "";
        const [dayIndex, meal, dishIndex] = showcaseCandidateSheet.key.split("-");
        const currentName = showcaseDishFor(Number(dayIndex), meal, Number(dishIndex))[0];
        const choices = showcaseCandidatePools[showcaseCandidateSheet.kind].map(([name], index) => ({ name, index })).filter(({ name }) => name !== currentName);
        return `<div class="candidate-sheet"><div class="sheet-head"><strong>自己挑一道</strong><button data-showcase-action="close-sheet" aria-label="关闭候选列表">×</button></div><div class="candidate-list">${choices.map(({ name, index }) => `<button data-showcase-choice="${index}"><b>${name}</b><span>同类换菜候选</span></button>`).join("")}</div></div>`;
      }

      function generatePhone() {
        return phoneShell("generation-preview has-app-tabs", "本周菜单", `
          <div class="week-toolbar"><button aria-label="上一周">‹</button><div class="week-range"><strong>8月3日—8月7日</strong><span>周一至周五 · 午餐和晚餐</span></div><button aria-label="下一周">›</button></div>
          <div class="plan-state"><strong>本周还没有菜单</strong><span>10 餐待安排</span></div>
          <div class="menu-rule"><b>按桃子的默认方式排</b><br />每餐 2荤2素1汤 · 同一道菜近期尽量不重复 · 只用菜品池里的菜</div>
          <div class="generation-ready"><div class="card-kicker">准备就绪</div><h3>一次生成五天午晚餐</h3><p>生成后十个餐次按日期顺序放在同一张表里；点菜名即可替换。</p></div>
          <div class="plan-action"><button class="primary" data-showcase-generate type="button">生成本周菜单</button></div>
        `, { back: false, tabs: true, engineerChrome: true });
      }

      function menuPhone() {
        return phoneShell("menu-aligned has-app-tabs", "修改本周菜单", `
          <div class="weekly-menu-boards">${showcaseWeeklyBoard()}</div>
          <div class="plan-action"><button class="primary" data-next>确认十餐菜单</button></div>
          ${showcaseCandidateSheetView()}
        `, { back: false, tabs: true, engineerChrome: true });
      }

      function sharePhone() {
        return phoneShell("wechat share-compact", "街坊味街坊群（46）", `
          <div class="time">上午 10:02</div>
          <div class="msg"><div class="avatar gold">桃</div><div><div class="sender">桃子</div><div class="bubble">今天午饭开放预订，上午 11:00 截止。</div></div></div>
          <div class="msg"><div class="avatar gold">桃</div><div><button class="mp-card" data-next>
            <div class="mp-main">
              <div class="mp-brand"><img class="mini-logo-image" src="../prototype-implementation/kith-inn-logo.png" alt="街坊味" />街坊味 · 桃子的家常饭</div>
              <div class="mp-title">今天 8月4日午饭</div>
              <div class="mp-highlight"><b>红烧排骨、番茄炒蛋</b><br />清炒油麦菜、香菇青菜、海带豆腐汤</div>
            </div>
            <div class="mp-foot">菜单已发布锁定 · 上午 11:00 截止</div>
          </button></div></div>
          <div class="time">上午 10:08</div>
          <div class="msg me"><div class="avatar red">周</div><div><div class="bubble">订好了，2 份。</div></div></div>
          <div class="msg me"><div class="avatar red">周</div><div><button class="mp-card" data-next>
            <div class="mp-main">
              <div class="mp-brand"><img class="mini-logo-image" src="../prototype-implementation/kith-inn-logo.png" alt="街坊味" />街坊味</div>
              <div class="mp-status">午饭订单已提交</div>
              <div class="mp-title">8月4日午饭 · 2份</div>
              <div class="mp-highlight"><b>订单 #240804-12</b><br />送到桂花苑 3 栋 502</div>
            </div>
            <div class="mp-foot">订单已提交给桃子 · 查看订单 →</div>
          </button></div></div>
          <div class="chat-input"><div class="round-tool"></div><div class="chat-field"></div><div class="round-tool"></div></div>
        `);
      }

      function ordersPhone() {
        const orderRows = [
          { meal: "lunch", name: "周阿姨", detail: "午饭 · 明日短单 · 桂花苑 3 栋", quantity: "1 份", state: "待备餐", tone: "" },
          { meal: "lunch", name: "王叔", detail: "午饭 · 长期订单 · 连续 7 天", quantity: "3 份", state: showcasePendingState === "approved" ? "待付款" : showcasePendingState === "rejected" ? "已暂不接" : "待审核", tone: showcasePendingState === "approved" ? "" : "warn" },
          { meal: "dinner", name: "陈姐", detail: "晚饭 · 明日短单 · 望江里 18A", quantity: "2 份", state: "待确认", tone: "warn" },
          { meal: "lunch", name: "刘阿姨", detail: "午饭 · 长期订单 · 连续 30 天 · 已付款", quantity: "3 份", state: "生效中", tone: "" },
        ];
        const visibleOrderRows = orderRows.filter(({ meal }) => showcaseOrderMealFilter === "all" || meal === showcaseOrderMealFilter);
        return phoneShell("orders-focus has-app-tabs", "订单列表", `
          <section class="order-hero">
            <div class="order-hero-top"><span>明天 8月4日</span><b>还在接单</b></div>
            <strong>共 12 份</strong>
            <p>4 位顾客 · 明日短单 9 份 · 长期订单已计入</p>
          </section>
          <section class="order-priority">
            <div class="order-priority-head"><strong>${showcasePendingState === "approved" ? "长期申请已同意" : showcasePendingState === "rejected" ? "长期申请已暂不接" : "1 个长期申请待审核"}</strong><span>${showcasePendingState === "approved" ? "待微信付款" : showcasePendingState === "rejected" ? "私聊说明" : "需要处理"}</span></div>
            <p>${showcasePendingState === "approved" ? "王叔 · 桃子已同意，接下来私聊确认微信付款" : showcasePendingState === "rejected" ? "王叔 · 拒接结果只通过微信私聊说明" : "王叔 · 8月4日起连续 7 天 · 每天午饭 3 份"}</p>
            ${showcasePendingState === "open"
              ? `<div class="priority-actions"><button data-showcase-pending="rejected">暂不接</button><button class="approve" data-showcase-pending="approved">同意订单</button></div>`
              : showcasePendingState === "idle" ? `<button data-showcase-pending="open">查看并处理</button>` : ""}
          </section>
          <div class="order-section-head"><strong>全部订单 · ${visibleOrderRows.length} 笔</strong><div class="meal-filter" aria-label="按餐次筛选">${[["all","全部"],["lunch","午饭"],["dinner","晚饭"]].map(([value,label]) => `<button class="${showcaseOrderMealFilter === value ? "active" : ""}" data-showcase-meal-filter="${value}" aria-pressed="${showcaseOrderMealFilter === value}">${label}</button>`).join("")}</div></div>
          <div class="compact-orders">${visibleOrderRows.map((order) => `<div class="compact-order"><div><b>${order.name}</b><p>${order.detail}</p></div><div class="compact-order-side"><strong>${order.quantity}</strong><span class="compact-state ${order.tone}">${order.state}</span></div></div>`).join("")}</div>
          <button class="primary" data-next>去订单对账</button>
        `, { back: false, tabs: true, activeTab: "orders", engineerChrome: true });
      }

      function chatPhone() {
        return phoneShell("room", "彭师傅 · 水电维修", `
          <div class="room-head">
            <div class="people">
              <div class="person human"><i>李</i>你</div>
              <div class="person human"><i>彭</i>彭师傅本人</div>
              <div class="person agent"><i>TA</i>彭师傅 Agent</div>
              <div class="person system"><i>邻</i>系统 Agent</div>
            </div>
            <div class="room-scope">本房间仅可见：维修需求摘要 + 照片 + 当前对话</div>
          </div>
          <div class="thread">
            <div class="system-note">从赵阿姨的亲历卡进入 · 带入"水管漏水、尽快上门"</div>
            <div class="room-msg"><div class="room-avatar">TA</div><div><div class="room-name">彭师傅的 Agent <span class="role">初步判断</span></div><div class="room-bubble">收到。初步判断是软管接口老化渗水，不是主管道问题。
              <div class="draft-card"><b>已采集 · 顾客授权本房间可见</b>
                水槽下方软管 · 昨晚开始漏水 · 现场照片 1 张<br />
                建议备料：4 分编织软管 ×1、生料带 ×1
              </div>
            </div></div></div>
            <div class="room-msg"><div class="room-avatar human">彭</div><div><div class="room-name">彭师傅本人 <span class="role">真人确认</span></div><div class="room-bubble">照片看了，是软管老化。材料约 18，工时 50，明天下午过去换。</div></div></div>
            <div class="room-msg"><div class="room-avatar">TA</div><div><div class="room-name">彭师傅的 Agent <span class="role">发起预约</span></div><div class="room-bubble">彭师傅已经确认，我帮你整理成服务预约：
              <div class="booking-card">
                <div class="booking-head"><strong>🔧 上门维修预约</strong><span class="booking-status">师傅已确认</span></div>
                <div class="booking-body">
                  <div class="booking-row"><span>服务</span><b>厨房水槽软管更换</b></div>
                  <div class="booking-row"><span>时间</span><b>明天 14:00–16:00</b></div>
                  <div class="booking-row"><span>费用</span><b>工时 ¥50 · 材料约 ¥18</b></div>
                  <div class="booking-note">详细门牌仅在你确认后提供给彭师傅；临时变化仍由双方真人确认。</div>
                </div>
                <button class="booking-action" data-next>确认预约</button>
              </div>
            </div></div></div>
          </div>
          <div class="room-composer">
            <div class="recipient"><button>发给彭师傅本人</button><button class="active">发给彭师傅 Agent</button></div>
            <div class="composer-row"><input placeholder="有问题可以继续问……" aria-label="消息" /><button>➤</button></div>
          </div>
        `);
      }

      function finishPhone() {
        return phoneShell("finish", "近邻互助组", `
          <div class="finish-mark">✓</div>
          <h3>一次靠谱选择，<br />也是下一次互助的开始。</h3>
          <p class="finish-lead">小李完成服务后，可以把自己的真实经历存进亲历卡；下次邻居求助时，他也能成为那个“亲自用过的人”。</p>
          <div class="value-list">
            <div class="value"><b>1</b><div><strong>亲历，而非流量排名</strong><small>推荐从真实关系和实际使用出发</small></div></div>
            <div class="value"><b>2</b><div><strong>Agent，而非责任替身</strong><small>AI 提高效率，真人保留最终承诺</small></div></div>
            <div class="value"><b>3</b><div><strong>月卡，而非出售数据</strong><small>用透明付费支持消费者自己的网络</small></div></div>
          </div>
          <button class="new-need" data-next>我还有其他需求 ＋</button>
        `);
      }

      function reconcilePhone() {
        const items = [
          { name: "周阿姨 · 19:14", amount: "¥30", order: "8月4日午饭 · 1份", wait: "顾客名、金额、日期与订单唯一匹配" },
          { name: "小太阳 · 20:03", amount: "¥60", order: "待对应订单", wait: "2 个同金额候选，系统无法判断对应王叔还是陈姐" },
          { name: "李家 · 20:16", amount: "¥40", order: "待对应订单", wait: "订单列表中找不到同顾客、同金额记录" },
        ];
        const checkedCount = showcaseReconcileChecked.size;
        const systemCount = [...showcaseReconcileChecked].filter((index) => showcaseReconcileSources[index] === "system").length;
        const manualCount = checkedCount - systemCount;
        const rows = items.map((item, index) => {
          const checked = showcaseReconcileChecked.has(index);
          const source = showcaseReconcileSources[index];
          const status = checked
            ? source === "system"
              ? `<div class="reconcile-reason">系统划掉 · ${item.wait}</div>`
              : `<div class="reconcile-manual">桃子手动划掉</div>`
            : `<div class="reconcile-wait">${item.wait}</div>`;
          return `<label class="reconcile-item ${checked ? "checked" : ""}">
            <input class="reconcile-check" type="checkbox" data-showcase-reconcile-check="${index}" ${checked ? "checked" : ""} aria-label="${checked ? "恢复" : "划掉"}${item.name} ${item.amount}" />
            <span class="reconcile-item-main"><span class="reconcile-item-head"><b>${item.name}</b><strong>${item.amount}</strong></span><span class="reconcile-order">${item.order}</span>${status}</span>
          </label>`;
        }).join("");
        return phoneShell("reconcile-focus", "对账清单", `
          <section class="reconcile-progress"><div><span>已读取 3 张收款截图</span><strong>${checkedCount}/3 已划掉</strong></div><em>系统 ${systemCount} · 桃子 ${manualCount}</em></section>
          <div class="reconcile-caption"><strong>逐笔核对</strong><span>点方框可划掉或恢复</span></div>
          <div class="reconcile-list">${rows}</div>
          <p class="reconcile-note">系统代划一定保留匹配依据；桃子手动划掉不需要填写理由。这里只记录清单状态，不代表平台收款。</p>
        `);
      }

      function phoneFor(step) {
        return { generate: generatePhone, menu: menuPhone, share: sharePhone, orders: ordersPhone, reconcile: reconcilePhone }[step]();
      }

      function render() {
        const step = currentStep();
        const item = copy[step];
        const stepIndex = steps.indexOf(step);
        document.title = `${labels[step]} · 客户体验原型 · 街坊味`;
        document.querySelector("#app").innerHTML = `
          <main class="page">
            <header class="topbar">
              <div class="brand"><img class="brand-logo" src="../prototype-implementation/kith-inn-logo.png" alt="街坊味" />街坊味 · Kith Inn</div>
              <div class="proto-note">客户体验原型 · 不接真实数据</div>
            </header>
            <div class="layout">
              <section class="story">
                <div class="step-kicker">${item.kicker}</div>
                <h1>${item.title}</h1>
                <p class="lead">${item.lead}</p>
                <div class="proofs">${item.proofs.map(([icon, text]) => `<div class="proof"><span class="proof-icon">${icon}</span>${text}</div>`).join("")}</div>
                <button class="story-action" data-next>${item.action}<span>→</span></button>
              </section>
              <section class="visual" aria-label="手机交互演示">
                ${phoneFor(step)}
              </section>
            </div>
          </main>
          <nav class="nav" aria-label="原型步骤切换">
            <button data-prev aria-label="上一步">←</button>
            <div class="nav-label">${stepIndex + 1} / ${steps.length} · ${labels[step]}
              <div class="dots">${steps.map((_, i) => `<i class="${i === stepIndex ? "active" : ""}"></i>`).join("")}</div>
            </div>
            <button data-next aria-label="下一步">→</button>
          </nav>`;
      }

      function rerenderPhoneState() {
        const scrollTop = document.querySelector(".screen-body")?.scrollTop || 0;
        render();
        const nextBody = document.querySelector(".screen-body");
        if (nextBody) nextBody.scrollTop = scrollTop;
      }

      document.addEventListener("click", (event) => {
        if (event.target.closest("[data-showcase-generate]")) {
          selectedShowcaseDishKey = "0-lunch-0";
          showcaseCandidateSheet = null;
          Object.keys(showcaseDishOverrides).forEach((key) => delete showcaseDishOverrides[key]);
          Object.keys(showcaseDishSmartSwapHistory).forEach((key) => delete showcaseDishSmartSwapHistory[key]);
          go("menu");
          return;
        }
        const selectedDish = event.target.closest("[data-showcase-select-dish]")?.dataset.showcaseSelectDish;
        if (selectedDish) {
          selectedShowcaseDishKey = selectedDish;
          showcaseCandidateSheet = null;
          rerenderPhoneState();
          return;
        }
        const showcaseRotate = event.target.closest("[data-showcase-rotate]");
        if (showcaseRotate) {
          const key = showcaseRotate.dataset.showcaseRotate;
          const kind = showcaseRotate.dataset.kind;
          const smartSwapCount = showcaseDishSmartSwapHistory[key]?.length || 0;
          if (smartSwapCount < 3) showcaseSmartSwap(key, kind);
          else showcaseCandidateSheet = { key, kind };
          rerenderPhoneState();
          return;
        }
        const showcaseChoice = event.target.closest("[data-showcase-choice]")?.dataset.showcaseChoice;
        if (showcaseChoice !== undefined && showcaseCandidateSheet) {
          showcaseDishOverrides[showcaseCandidateSheet.key] = showcaseCandidatePools[showcaseCandidateSheet.kind][Number(showcaseChoice)];
          showcaseCandidateSheet = null;
          rerenderPhoneState();
          return;
        }
        if (event.target.closest('[data-showcase-action="close-sheet"]')) {
          showcaseCandidateSheet = null;
          rerenderPhoneState();
          return;
        }
        const showcaseTab = event.target.closest("[data-showcase-tab]")?.dataset.showcaseTab;
        if (showcaseTab) {
          if (showcaseTab === "orders") go("orders");
          else go("menu");
          return;
        }
        const pendingAction = event.target.closest("[data-showcase-pending]")?.dataset.showcasePending;
        if (pendingAction) {
          showcasePendingState = pendingAction;
          rerenderPhoneState();
          return;
        }
        const mealFilter = event.target.closest("[data-showcase-meal-filter]")?.dataset.showcaseMealFilter;
        if (mealFilter) {
          showcaseOrderMealFilter = mealFilter;
          rerenderPhoneState();
          return;
        }
        const reconcileCheck = event.target.closest("[data-showcase-reconcile-check]")?.dataset.showcaseReconcileCheck;
        if (reconcileCheck !== undefined) {
          const index = Number(reconcileCheck);
          if (showcaseReconcileChecked.has(index)) {
            showcaseReconcileChecked.delete(index);
            delete showcaseReconcileSources[index];
          } else {
            showcaseReconcileChecked.add(index);
            showcaseReconcileSources[index] = "manual";
          }
          rerenderPhoneState();
          return;
        }
        if (event.target.closest("[data-next]")) cycle(1);
        if (event.target.closest("[data-prev]")) cycle(-1);
      });
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
