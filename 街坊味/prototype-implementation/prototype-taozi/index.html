<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>街坊味 · 桃子使用端原型</title>
    <!--
      PROTOTYPE — 不接真实数据
      目标：展示桃子如何维护菜品池、排菜单、分享预订、看订单并辅助对账。
      使用 ?step= 保留可分享状态。
      视觉与交互骨架对照「近邻互助组 · 客户体验原型」。
    -->
    <style>
      :root {
        color-scheme: light;
        --ink: #29231d;
        --muted: #675d53;
        --line: #e6dccd;
        --paper: #fff8ed;
        --red: #b64131;
        --red-dark: #8f2d22;
        --red-soft: #fbe9e4;
        --green: #287557;
        --green-dark: #1e5d45;
        --green-soft: #e7f3ec;
        --gold: #edae32;
        --gold-soft: #fff2d5;
        --phone: #211d18;
        --shadow: 0 32px 90px rgba(82, 48, 28, 0.16);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--ink);
        background: var(--paper);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      .page { min-height: calc(100vh - 132px); padding: 28px 30px 110px; }
      .layout {
        width: min(1220px, 100%);
        margin: 34px auto 0;
        display: grid;
        grid-template-columns: minmax(340px, 0.95fr) minmax(390px, 1.05fr);
        gap: 72px;
        align-items: center;
      }
      .story { padding: 20px 0; }
      .step-kicker { color: var(--public-primary); font-size: 12px; font-weight: 900; letter-spacing: 0.08em; }
      h1 {
        max-width: 610px;
        margin: 14px 0 18px;
        font-size: clamp(40px, 4.8vw, 64px);
        line-height: 1.03;
        letter-spacing: -0.055em;
        text-wrap: balance;
      }
      .lead { max-width: 570px; margin: 0; color: var(--muted); font-size: clamp(17px, 2vw, 20px); line-height: 1.7; }
      .proofs { display: grid; gap: 12px; margin-top: 34px; max-width: 560px; }
      .proof {
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 13px;
        align-items: center;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        font-weight: 750;
      }
      .proof-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--public-primary-soft);
        color: var(--public-primary);
        font-weight: 900;
      }
      .story-action {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        padding: 15px 20px;
        border: 0;
        border-radius: 15px;
        background: var(--public-foreground);
        color: #fff;
        font-weight: 850;
        box-shadow: 0 14px 30px rgba(8, 22, 40, 0.18);
      }
      .story-action span { color: var(--public-primary); font-size: 20px; }
      .visual { position: relative; min-height: 790px; display: grid; place-items: center; padding: 20px; }
      .phone {
        position: relative;
        z-index: 1;
        width: min(390px, 92vw);
        height: 748px;
        overflow: hidden;
        border: 7px solid var(--phone);
        border-radius: 42px;
        background: #fff;
        box-shadow: var(--shadow);
      }
      .phone::before {
        content: "";
        position: absolute;
        z-index: 8;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 92px;
        height: 25px;
        border-radius: 14px;
        background: var(--phone);
      }
      .statusbar {
        position: relative;
        z-index: 7;
        height: 35px;
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 800;
      }
      .appbar {
        height: 58px;
        padding: 0 15px;
        display: grid;
        grid-template-columns: 62px 1fr 62px;
        align-items: center;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        background: #fff;
        font-size: 17px;
        font-weight: 850;
      }
      .appbar strong { text-align: center; }
      .back {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center start;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-size: 27px;
        font-weight: 400;
      }
      .back-placeholder { display: block; width: 42px; height: 42px; }
      .capsule {
        justify-self: end;
        width: 60px;
        height: 27px;
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 999px;
        display: grid;
        place-items: center;
        letter-spacing: 3px;
        font-size: 10px;
      }
      .screen-body { height: 648px; overflow: hidden; }
      .phone.has-app-tabs .screen-body { height: 590px; }
      .app-tabs {
        position: relative;
        z-index: 7;
        height: 58px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-top: 1px solid rgba(0, 0, 0, 0.08);
        background: rgba(255, 255, 255, 0.98);
      }
      .app-tabs button {
        border: 0;
        background: transparent;
        color: #8a8178;
        font-size: 10px;
        font-weight: 800;
      }
      .app-tabs button.active { color: var(--green-dark); }

      .wechat .statusbar, .wechat .appbar { background: #ededed; }
      .wechat .screen-body { position: relative; padding: 15px 12px 70px; background: #ededed; }
      .time { margin: 6px 0 17px; color: #8a8478; text-align: center; font-size: 11px; }
      .msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 17px; }
      .msg.me { flex-direction: row-reverse; }
      .avatar {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 39px;
        height: 39px;
        border-radius: 8px;
        color: #fff;
        font-size: 13px;
        font-weight: 900;
      }
      .avatar.green { background: #4f7895; }
      .avatar.gold { background: var(--gold); color: var(--ink); }
      .avatar.red { background: var(--red); }
      .sender { margin: 0 4px 4px; color: #6f6a60; font-size: 11px; }
      .msg.me .sender { text-align: right; }
      .bubble { max-width: 260px; padding: 11px 13px; border-radius: 4px 15px 15px; background: #fff; font-size: 14px; line-height: 1.55; }
      .msg.me .bubble { border-radius: 15px 4px 15px 15px; background: #95ec69; }
      .mp-card { width: 260px; overflow: hidden; border: 0; border-radius: 9px; background: #fff; text-align: left; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08); }
      .mp-main { padding: 14px; }
      .mp-brand { display: flex; align-items: center; gap: 7px; color: #6f6a60; font-size: 11px; }
      .mini-logo { width: 24px; height: 24px; border-radius: 7px; object-fit: cover; }
      .mp-title { margin-top: 10px; font-size: 17px; font-weight: 900; line-height: 1.35; }
      .mp-highlight { margin-top: 9px; padding: 11px; border-radius: 10px; background: var(--red-soft); color: var(--red-dark); font-size: 12px; line-height: 1.5; }
      .mp-foot { padding: 8px 14px; border-top: 1px solid #eee; color: #8a8478; font-size: 11px; }
      .chat-input { position: absolute; right: 0; bottom: 0; left: 0; height: 57px; padding: 9px 11px; display: flex; gap: 8px; background: #f7f7f7; border-top: 1px solid #ddd; }
      .round-tool { width: 36px; height: 36px; border: 1px solid #aaa; border-radius: 50%; }
      .chat-field { flex: 1; border-radius: 7px; background: #fff; }

      .mini .screen-body, .ops .screen-body { padding: 15px; overflow-y: auto; background: #fbf8f1; }
      .agent-intro { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
      .agent-avatar { width: 38px; height: 38px; border-radius: 13px; object-fit: cover; }
      .agent-bubble { padding: 10px 12px; border-radius: 4px 14px 14px; background: #fff; font-size: 13px; line-height: 1.55; box-shadow: 0 4px 14px rgba(52, 41, 31, 0.05); }
      .paste { margin: 11px 0; padding: 12px; border-radius: 13px 4px 13px 13px; background: var(--green); color: #fff; font-size: 12px; line-height: 1.55; }
      .change-card { padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 8px 24px rgba(52, 41, 31, 0.07); }
      .card-kicker { color: var(--red-dark); font-size: 11px; font-weight: 900; letter-spacing: 0.06em; }
      .change-card h3 { margin: 7px 0 5px; font-size: 19px; }
      .change-card > p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .changes { display: grid; gap: 8px; margin-top: 12px; }
      .change { display: grid; grid-template-columns: 50px 1fr; gap: 8px; padding: 9px; border-radius: 10px; background: #f7f4ed; font-size: 11px; line-height: 1.4; }
      .change b { color: var(--green-dark); }
      .change.warn b { color: #a9650b; }
      .guardrail { margin-top: 10px; color: var(--muted); font-size: 10px; line-height: 1.45; }
      .primary, .secondary { width: 100%; padding: 12px; border-radius: 11px; font-weight: 850; }
      .primary { margin-top: 12px; border: 0; background: var(--red); color: #fff; }
      .secondary { margin-top: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
      .success { padding: 20px; border-radius: 20px; background: var(--green); color: #fff; }
      .success strong { display: block; margin-bottom: 8px; font-size: 22px; }
      .success p { margin: 0; font-size: 13px; line-height: 1.6; }

      .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 13px; padding: 4px; border-radius: 14px; background: #efe9dd; }
      .tabbar button { padding: 9px 3px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 800; }
      .tabbar button.active { background: #fff; color: var(--red-dark); box-shadow: 0 4px 12px rgba(52, 41, 31, 0.06); }
      .detail-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      .detail-head span { color: var(--muted); font-size: 11px; }
      .detail-head strong { display: block; margin-top: 3px; font-size: 21px; }
      .detail-head em { color: var(--green-dark); font-size: 12px; font-style: normal; font-weight: 800; }
      .dish-list, .order-list, .delivery-list { display: grid; gap: 8px; }
      .dish, .order, .delivery {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
      }
      .dish b, .order b, .delivery b { display: block; font-size: 13px; }
      .dish small, .order small, .delivery small { color: var(--muted); font-size: 10px; }
      .kind { padding: 5px 8px; border-radius: 999px; background: var(--red-soft); color: var(--red-dark); font-size: 10px; font-weight: 850; }
      .kind.veg { background: var(--green-soft); color: var(--green-dark); }
      .kind.soup { background: var(--gold-soft); color: #8a5b0a; }
      .tiny-action { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--green-dark); font-size: 10px; font-weight: 850; }
      .query-card { padding: 15px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
      .query-card h3 { margin: 4px 0 12px; font-size: 19px; }
      .query-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .query-cell { padding: 11px; border-radius: 12px; background: #f5f1e8; }
      .query-cell strong { display: block; font-size: 20px; }
      .query-cell span { color: var(--muted); font-size: 10px; }
      .settings-profile { display: flex; align-items: center; gap: 11px; padding: 14px; border-radius: 17px; background: var(--green); color: #fff; }
      .settings-profile img { width: 46px; height: 46px; border-radius: 14px; object-fit: cover; background: #fff; }
      .settings-profile strong { display: block; font-size: 16px; }
      .settings-profile span { display: block; margin-top: 4px; color: rgba(255, 255, 255, 0.78); font-size: 9px; }
      .settings-group { display: grid; gap: 8px; margin-top: 12px; }
      .settings-row { width: 100%; display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); text-align: left; }
      .settings-row > b { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; background: var(--gold-soft); color: #82590f; font-size: 11px; }
      .settings-row:nth-child(2) > b { background: var(--green-soft); color: var(--green-dark); }
      .settings-row:nth-child(3) > b { background: var(--red-soft); color: var(--red-dark); }
      .settings-row strong { display: block; font-size: 12px; }
      .settings-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.4; }
      .settings-row > span { color: #a0968b; font-size: 18px; }

      .week-toolbar { display: grid; grid-template-columns: 35px 1fr 35px; align-items: center; gap: 7px; margin-bottom: 10px; }
      .week-toolbar button { width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); font-size: 20px; }
      .week-range { text-align: center; }
      .week-range strong { display: block; font-size: 15px; }
      .week-range span { color: var(--muted); font-size: 9px; }
      .plan-state { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; padding: 10px 11px; border-radius: 12px; background: var(--green-soft); }
      .plan-state strong { font-size: 12px; }
      .plan-state span { padding: 5px 7px; border-radius: 999px; background: #fff; color: var(--green-dark); font-size: 9px; font-weight: 850; }
      .menu-rule { margin-bottom: 10px; padding: 10px 11px; border-radius: 12px; background: var(--gold-soft); color: #765313; font-size: 10px; line-height: 1.5; }
      .week-plans { display: grid; gap: 7px; padding-bottom: 4px; }
      .day-plan { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
      .day-plan.open { border-color: rgba(182, 65, 49, 0.5); box-shadow: 0 6px 18px rgba(52, 41, 31, 0.06); }
      .day-plan.locked { border-color: rgba(40, 117, 87, 0.32); }
      .day-plan.locked .day-toggle { background: #f8fcfa; }
      .day-toggle { width: 100%; padding: 10px 11px; border: 0; background: #fff; text-align: left; }
      .day-head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
      .day-head strong { font-size: 12px; }
      .day-head b { color: var(--green-dark); font-size: 9px; }
      .day-summary { display: grid; gap: 2px; margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.4; }
      .day-summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .day-detail { padding: 0 10px 10px; border-top: 1px solid #f0e9df; }
      .meal-block { padding-top: 9px; }
      .meal-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; color: var(--muted); font-size: 9px; font-weight: 800; }
      .meal-title span { color: var(--green-dark); }
      .mini-dishes { display: grid; gap: 4px; }
      .mini-dish { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; min-height: 31px; padding: 5px 6px 5px 9px; border-radius: 9px; background: #f8f5ef; }
      .mini-dish b { overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .mini-dish small { padding: 3px 5px; border-radius: 999px; background: var(--red-soft); color: var(--red-dark); font-size: 8px; font-weight: 850; }
      .mini-dish small.veg { background: var(--green-soft); color: var(--green-dark); }
      .mini-dish small.soup { background: var(--gold-soft); color: #80580e; }
      .locked-dish { min-width: 42px; color: var(--green-dark); font-size: 8px; font-weight: 850; text-align: center; }
      .rotate-dish { display: inline-grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--muted); transition: background 140ms ease, opacity 140ms ease, transform 140ms ease; }
      .rotate-dish:hover { background: #f0ebe3; }
      .rotate-dish:active { opacity: 0.8; transform: scale(0.95); }
      .rotate-dish img { width: 14px; height: 14px; }
      .rotate-dish.spinning img { animation: rotate-dish-spin 0.3s ease-out; }
      @keyframes rotate-dish-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .rotate-dish { transition: none; } .rotate-dish.spinning img { animation: none; } }
      .plan-action { position: sticky; z-index: 3; bottom: -15px; margin-top: 9px; padding: 8px 0 2px; background: linear-gradient(transparent, #fbf8f1 25%); }
      .plan-action .primary { margin-top: 0; box-shadow: 0 8px 20px rgba(182, 65, 49, 0.16); }
      .candidate-sheet { position: sticky; z-index: 8; bottom: -15px; margin: 10px -15px -15px; padding: 13px 15px 17px; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; background: #fff; box-shadow: 0 -18px 40px rgba(41, 35, 29, 0.18); }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .sheet-head strong { font-size: 13px; }
      .sheet-head button { width: 32px; height: 32px; border: 0; border-radius: 10px; background: #f3eee5; color: var(--muted); font-weight: 900; }
      .candidate-list { display: grid; gap: 5px; }
      .candidate-list button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); text-align: left; }
      .candidate-list button b { font-size: 11px; }
      .candidate-list button span { color: var(--muted); font-size: 9px; }
      .copy-preview { margin-top: 10px; padding: 12px; border: 1px dashed #c9a665; border-radius: 12px; background: #fffaf0; color: var(--muted); font-size: 10px; line-height: 1.6; white-space: pre-line; }
      .input-label { display: block; margin: 9px 0 5px; color: var(--muted); font-size: 9px; font-weight: 850; }
      .prototype-textarea { display: block; width: 100%; min-height: 128px; padding: 11px; border: 1px solid var(--line); border-radius: 12px; outline: 0; background: #fff; color: var(--ink); font-size: 11px; line-height: 1.6; resize: none; }
      .prototype-textarea:focus { border-color: rgba(40, 117, 87, 0.65); box-shadow: 0 0 0 3px rgba(40, 117, 87, 0.1); }
      .import-list { display: grid; gap: 5px; margin-top: 10px; }
      .import-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; min-height: 37px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
      .import-row b { font-size: 10px; }
      .category-switch { display: flex; align-items: center; gap: 3px; }
      .category-switch .kind { min-width: 27px; text-align: center; }
      .coverage-list { display: grid; gap: 7px; margin: 10px 0; }
      .coverage-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 9px; min-height: 42px; padding: 8px 9px 8px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; }
      .coverage-row b { font-size: 11px; }
      .coverage-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
      .coverage-row button { min-height: 29px; padding: 6px 9px; border: 1px solid rgba(182, 65, 49, 0.25); border-radius: 8px; background: var(--red-soft); color: var(--red-dark); font-size: 8px; font-weight: 850; }
      .coverage-add { display: grid; grid-template-columns: 1fr 86px; gap: 7px; margin-top: 9px; }
      .coverage-add input { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; outline: 0; background: #fff; color: var(--ink); font-size: 10px; }
      .coverage-add input:focus { border-color: rgba(40, 117, 87, 0.65); box-shadow: 0 0 0 3px rgba(40, 117, 87, 0.1); }
      .coverage-add button { border: 0; border-radius: 10px; background: var(--green); color: #fff; font-size: 9px; font-weight: 850; }
      .field-error { margin: 7px 0 0; color: var(--red-dark); font-size: 9px; font-weight: 750; }
      .entry-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; padding: 4px; border-radius: 12px; background: #efeae1; }
      .entry-tabs button { min-height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 850; }
      .entry-tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 3px 10px rgba(52, 41, 31, 0.08); }
      .order-diff { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 9px 0; }
      .order-diff div { padding: 8px; border-radius: 10px; background: #f5f1e8; text-align: center; }
      .order-diff strong { display: block; font-size: 16px; }
      .order-diff span { color: var(--muted); font-size: 8px; }
      .manual-form { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
      .manual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      .manual-field { display: grid; gap: 4px; color: var(--muted); font-size: 8px; font-weight: 800; }
      .manual-field input, .manual-field select { width: 100%; min-height: 36px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 9px; outline: 0; background: #fbf9f5; color: var(--ink); font-size: 10px; }

        if (categoryButton) {
          const dishIndex = Number(categoryButton.dataset.cycleCategory);
          const categories = ["meat", "veg", "soup"];
          const currentIndex = categories.indexOf(importedDishes[dishIndex][1]);
          importedDishes[dishIndex][1] = categories[(currentIndex + 1) % categories.length];
          spinningCategoryIndex = dishIndex;
          render();
          setTimeout(() => {
            if (spinningCategoryIndex === dishIndex) {
              spinningCategoryIndex = null;
              render();
            }
          }, 300);
        }
        const removeCommunity = event.target.closest("[data-remove-community]")?.dataset.removeCommunity;
        if (removeCommunity !== undefined) {
          if (deliveryCommunities.length === 1) deliveryError = "至少保留一个可配送小区。";
          else { deliveryCommunities.splice(Number(removeCommunity), 1); deliveryError = ""; }
          render();
        }
        const nextMerchantOrderFilter = event.target.closest("[data-merchant-order-filter]")?.dataset.merchantOrderFilter;
        if (nextMerchantOrderFilter) {
          merchantOrderFilter = nextMerchantOrderFilter;
          render();
        }
        const day = event.target.closest("[data-day]")?.dataset.day;
        if (day !== undefined) {
          const dayIndex = Number(day);
          expandedDay = expandedDay === dayIndex ? null : dayIndex;
          candidateSheet = null;
          render();
        }
        const publishedMeal = event.target.closest("[data-published-menu]")?.dataset.publishedMenu;
        if (publishedMeal) {
          expandedPublishedMeal = expandedPublishedMeal === publishedMeal ? null : publishedMeal;
          render();
        }
        const rotateButton = event.target.closest("[data-rotate]");
        if (rotateButton) {
          const key = rotateButton.dataset.rotate;
          const dayIndex = Number(key.split("-")[0]);
          if (publishedDayIndexes.has(dayIndex)) return;
          const kind = rotateButton.dataset.kind;
          spinningDishKey = key;
          const count = (rotationCounts[key] || 0) + 1;
          if (count >= 3) {
            rotationCounts[key] = 0;
            candidateSheet = { key, kind };
          } else {
            rotationCounts[key] = count;
            const candidates = candidatePools[kind];
            const currentName = dishOverrides[key]?.[0];
            const currentIndex = Math.max(-1, candidates.findIndex(([name]) => name === currentName));
            dishOverrides[key] = candidates[(currentIndex + 1) % candidates.length];
          }
          render();
          setTimeout(() => {
            if (spinningDishKey === key) {
              spinningDishKey = null;
              render();
            }
          }, 300);
        }
        const choice = event.target.closest("[data-choice]")?.dataset.choice;
        if (choice !== undefined && candidateSheet) {
          const dayIndex = Number(candidateSheet.key.split("-")[0]);
          if (publishedDayIndexes.has(dayIndex)) {
            candidateSheet = null;
            render();
            return;
          }
          dishOverrides[candidateSheet.key] = candidatePools[candidateSheet.kind][Number(choice)];
          candidateSheet = null;
          render();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
        if (event.key === "ArrowLeft") cyclePresentation(-1);
        if (event.key === "ArrowRight") cyclePresentation(1);
      });
      window.addEventListener("popstate", render);
      render();
    </script>
  </body>
</html>
